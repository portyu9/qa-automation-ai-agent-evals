[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "qa-automation-ai-agent-evals"
version = "0.1.0"
description = "Evidence-bound evaluation, verification, validation, and release assurance for agentic systems"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Ƴunior Ƥortal"}]
license = {file = "LICENSE"}
keywords = ["ai-agents", "agent-evals", "quality-engineering", "tevv", "mcp", "pytest"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.10,<3",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
openai = ["openai-agents>=0.2,<1"]
yaml = ["pyyaml>=6.0.3,<7"]
dev = [
  "bandit>=1.8,<2",
  "mypy>=1.14,<2",
  "pip-audit>=2.8,<3",
  "pytest>=9,<10",
  "pytest-asyncio>=1,<2",
  "pytest-cov>=6,<8",
  "ruff==0.16.2",
]

[project.scripts]
agent-evals = "agent_evals.cli:app"

[project.urls]
Homepage = "https://github.com/portyu9/qa-automation-ai-agent-evals"
Repository = "https://github.com/portyu9/qa-automation-ai-agent-evals"
Documentation = "https://github.com/portyu9/qa-automation-ai-agent-evals/tree/main/docs"
Issues = "https://github.com/portyu9/qa-automation-ai-agent-evals/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers --disable-warnings"
markers = [
  "integration: deterministic integration tests",
  "live: tests requiring a live model/provider",
]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["agent_evals"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["agent_evals"]
warn_unused_ignores = true

[tool.bandit]
exclude_dirs = ["tests"]
