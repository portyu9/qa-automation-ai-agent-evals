name: Release request

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: Existing version tag to publish (must equal v<project.version>)
        required: true
        type: string
      ci_run_id:
        description: Successful main push CI run ID that produced the retained package artifact
        required: true
        type: string

permissions:
  contents: read

jobs:
  request:
    name: Record release request
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Create canonical release request
        env:
          VERSION_TAG: ${{ inputs.version_tag }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          tag = os.environ["VERSION_TAG"]
          run_id_text = os.environ["CI_RUN_ID"]
          if re.fullmatch(r"v[0-9A-Za-z][0-9A-Za-z._+-]{0,127}", tag) is None:
              raise SystemExit("version_tag must be a canonical v-prefixed tag")
          if re.fullmatch(r"[1-9][0-9]*", run_id_text) is None:
              raise SystemExit("ci_run_id must be a positive integer")
          payload = {
              "schema_version": "agent-evals/release-request/v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "version_tag": tag,
              "ci_run_id": int(run_id_text),
              "request_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "request_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
          }
          Path("release-request.json").write_text(
              json.dumps(
                  payload,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=False,
                  allow_nan=False,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
      - name: Upload release request
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-request-${{ github.run_id }}
          path: release-request.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true
