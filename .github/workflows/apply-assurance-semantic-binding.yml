name: Apply assurance semantic evidence binding

on:
  push:
    branches:
      - fix/assurance-semantic-evidence-binding
    paths:
      - .github/workflows/apply-assurance-semantic-binding.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/assurance-semantic-evidence-binding
      - name: Add adversarial semantic report tests
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/apply.py
          python /tmp/apply.py
          python -m compileall -q src tests/unit/test_assurance_semantic.py
      - name: Commit permanent changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/agent_evals/semantic/verification.py tests/unit/test_assurance_semantic.py
          git diff --cached --check
          git commit -m "test: cover assurance semantic evidence relation"
          git push origin HEAD:fix/assurance-semantic-evidence-binding
