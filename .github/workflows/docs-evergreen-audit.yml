name: docs-evergreen-audit

on:
  push:
    branches:
      - docs/evergreen-openai-mermaid

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate evergreen documentation and Mermaid quality
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import pathlib
          import re

          files = [pathlib.Path('README.md'), *sorted(pathlib.Path('docs').glob('*.md'))]
          version_patterns = {
              'python-runtime': re.compile(r'\bPython\s+\d+\.\d+(?:\s*[|/+,-]\s*\d+\.\d+)*', re.I),
              'semantic-version': re.compile(r'(?<![\w/.-])v\d+(?:\.\d+){0,2}\b', re.I),
              'three-part-version': re.compile(r'(?<![\w.-])\d+\.\d+\.\d+(?![\w.-])'),
              'exact-package-pin': re.compile(r'==\s*\d+(?:\.\d+)+'),
              'named-version': re.compile(r'\b(?:version|schema|report|protocol|format|model)\s+(?:v?\d+(?:\.\d+)*)\b', re.I),
          }

          version_hits: list[str] = []
          mermaid_errors: list[str] = []
          link_errors: list[str] = []
          mermaid_count = 0
          text_fence_count = 0

          for path in files:
              text = path.read_text(encoding='utf-8')
              text_fence_count += text.count('```text')

              for lineno, line in enumerate(text.splitlines(), 1):
                  matched = [name for name, pattern in version_patterns.items() if pattern.search(line)]
                  if matched:
                      version_hits.append(f'{path}:{lineno}: {",".join(matched)}: {line}')

              for index, block in enumerate(re.findall(r'```mermaid\n(.*?)\n```', text, flags=re.S), 1):
                  mermaid_count += 1
                  if 'accTitle:' not in block or 'accDescr:' not in block:
                      mermaid_errors.append(f'{path}: Mermaid {index} lacks accTitle/accDescr')
                  if 'classDef ' not in block and 'box rgba' not in block:
                      mermaid_errors.append(f'{path}: Mermaid {index} lacks explicit color semantics')

              for target in re.findall(r'\[[^\]]+\]\(([^)]+\.md)(?:#[^)]+)?\)', text):
                  if '://' in target:
                      continue
                  resolved = (path.parent / target).resolve()
                  if not resolved.exists():
                      link_errors.append(f'{path}: broken Markdown link -> {target}')

          for label, errors in (
              ('VERSION', version_hits),
              ('MERMAID', mermaid_errors),
              ('LINK', link_errors),
          ):
              for error in errors:
                  print(f'{label}\t{error}')

          print(
              'SUMMARY\t'
              f'files={len(files)}\tversion_lines={len(version_hits)}\t'
              f'text_fences={text_fence_count}\tmermaid_fences={mermaid_count}\t'
              f'mermaid_errors={len(mermaid_errors)}\tlink_errors={len(link_errors)}'
          )

          if version_hits or mermaid_errors or link_errors:
              raise SystemExit('documentation acceptance gate failed')
          PY
