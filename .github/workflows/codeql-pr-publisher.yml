name: Trusted CodeQL PR-head publication

# No privileged PR event. Protected main pushes, a main-owned schedule, or
# owner dispatch re-read canonical completed read-only CodeQL PR scans,
# checks live current-base/head/tree and revalidates original SARIF before upload.
# The privileged job NEVER checks out candidate files or runs candidate scripts.
on:
  push:
    branches: [main]
  schedule:
    # Keep the same 10-minute period away from highly contended minute :00.
    # GitHub's schedule remains best-effort; no privileged PR event is enabled.
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_run: # zizmor: ignore[dangerous-triggers] -- main-owned verifier reauthenticates exact SARIF; never checks out PR code
    workflows: [CodeQL]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trusted-codeql-pr-publisher-main
  cancel-in-progress: false

jobs:
  publish:
    name: Authenticated PR-head Code Scanning
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
      security-events: write
    steps:
      - name: Checkout accepted-main verification logic only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - name: Self-test trusted provenance refusal cases
        run: python3 trusted/.github/scripts/verify_codeql_pr_publication.py --self-test
      - name: Discover and authenticate completed PR CodeQL evidence
        id: provenance
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_MAIN_SHA: ${{ github.sha }}
        run: python3 trusted/.github/scripts/verify_codeql_pr_publication.py --discover
      - name: Download only canonical completed-run CodeQL evidence
        if: steps.provenance.outputs.has_target == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          repository: ${{ github.repository }}
          run-id: ${{ steps.provenance.outputs.run_id }}
          name: codeql-sarif-${{ steps.provenance.outputs.run_id }}
          github-token: ${{ github.token }}
          path: reports/security/pr-codeql
          digest-mismatch: error
      - name: Revalidate exact original CodeQL SARIF under trusted main
        if: steps.provenance.outputs.has_target == 'true'
        run: |
          python3 trusted/.github/scripts/verify_codeql_pr_publication.py --verify-sarif reports/security/pr-codeql
          python3 trusted/.github/scripts/validate_codeql_sarif.py reports/security/pr-codeql
      - name: Reauthenticate exact live target after download before privileged upload
        if: steps.provenance.outputs.has_target == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_MAIN_SHA: ${{ github.sha }}
          EXPECTED_PR_NUMBER: ${{ steps.provenance.outputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ steps.provenance.outputs.head_sha }}
          EXPECTED_BASE_SHA: ${{ steps.provenance.outputs.base_sha }}
          EXPECTED_RUN_ID: ${{ steps.provenance.outputs.run_id }}
          EXPECTED_ARTIFACT_ID: ${{ steps.provenance.outputs.artifact_id }}
          EXPECTED_ARTIFACT_DIGEST: ${{ steps.provenance.outputs.artifact_digest }}
        run: python3 trusted/.github/scripts/verify_codeql_pr_publication.py --revalidate-target
      - name: Publish authentic PR-head CodeQL result
        if: steps.provenance.outputs.has_target == 'true'
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: reports/security/pr-codeql
          ref: refs/pull/${{ steps.provenance.outputs.pr_number }}/head
          sha: ${{ steps.provenance.outputs.head_sha }}
          category: .github/workflows/codeql.yml:codeql-upload
          wait-for-processing: "true"
