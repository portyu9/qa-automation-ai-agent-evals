name: Apply approval request cardinality fix

on:
  push:
    branches:
      - fix/approval-request-cardinality
    paths:
      - .github/workflows/apply-approval-request-cardinality.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/approval-request-cardinality
      - name: Apply approval request cardinality fix
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/apply.py
          python /tmp/apply.py
      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Normalize and validate focused approval surface
        shell: bash
        run: |
          ruff check --fix src/agent_evals/evidence/approval_intent.py tests/unit/test_approval_continuation_chronology.py
          ruff format src/agent_evals/evidence/approval_intent.py tests/unit/test_approval_continuation_chronology.py
          ruff check src/agent_evals/evidence/approval_intent.py tests/unit/test_approval_continuation_chronology.py
          ruff format --check src/agent_evals/evidence/approval_intent.py tests/unit/test_approval_continuation_chronology.py
          pytest -q tests/unit/test_approval_continuation_chronology.py tests/unit/test_approval_intent.py tests/unit/test_approval_intent_fail_closed.py tests/unit/test_approval_intent_legacy_downgrade.py
          git diff --check
      - name: Commit permanent changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/agent_evals/evidence/approval_intent.py tests/unit/test_approval_continuation_chronology.py docs/APPROVAL_INTENT.md
          git commit -m "fix: reject unbound approval requests"
          git push origin HEAD:fix/approval-request-cardinality
