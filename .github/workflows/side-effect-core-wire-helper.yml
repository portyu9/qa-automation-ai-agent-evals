name: Side-effect core wiring helper

on:
  push:
    branches:
      - feat/side-effect-idempotency

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Wire side-effect assurance into core contracts and evaluator
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'src/agent_evals/contracts/models.py',
              'from agent_evals.retrieval.models import RetrievalContractSpec\n',
              'from agent_evals.retrieval.models import RetrievalContractSpec\nfrom agent_evals.side_effect.models import SideEffectIdempotencySpec\n',
          )
          replace_once(
              'src/agent_evals/contracts/models.py',
              '    retrieval: RetrievalContractSpec | None = None\n',
              '    retrieval: RetrievalContractSpec | None = None\n    side_effect_idempotency: SideEffectIdempotencySpec | None = None\n',
          )
          replace_once(
              'src/agent_evals/evidence/models.py',
              '    RETRIEVAL_DELIVERY = "retrieval_delivery"\n',
              '    RETRIEVAL_DELIVERY = "retrieval_delivery"\n    SIDE_EFFECT_OBSERVATION = "side_effect_observation"\n',
          )
          replace_once(
              'src/agent_evals/runtime/evaluator.py',
              'from agent_evals.oracles.deterministic import OracleResult, OutcomeOracle, PolicyOracle\n',
              'from agent_evals.oracles.deterministic import OracleResult, OutcomeOracle, PolicyOracle\nfrom agent_evals.side_effect.oracle import SideEffectIdempotencyOracle\nfrom agent_evals.side_effect.verification import (\n    SideEffectObservationError,\n    verify_side_effect_observation,\n)\n',
          )
          replace_once(
              '        self._oracles = (PolicyOracle(), OutcomeOracle())\n',
              '        self._oracles = (PolicyOracle(), SideEffectIdempotencyOracle(), OutcomeOracle())\n',
          )
          replace_once(
              '        try:\n            verify_approval_intent(scenario, evidence)\n',
              '        try:\n            verify_side_effect_observation(scenario, evidence)\n        except SideEffectObservationError as exc:\n            return EvaluatedTrial(\n                evidence=self._append_evaluation_error(\n                    evidence,\n                    source="evaluator:side-effect-observation",\n                    code="side_effect_observation_unverified",\n                    reason=str(exc),\n                ),\n                oracle_results=(),\n                verdict=TrialVerdict.BLOCKED,\n            )\n\n        try:\n            verify_approval_intent(scenario, evidence)\n',
          )
          PY
          rm .github/workflows/side-effect-core-wire-helper.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/agent_evals/contracts/models.py src/agent_evals/evidence/models.py src/agent_evals/runtime/evaluator.py .github/workflows/side-effect-core-wire-helper.yml
          git commit -m 'feat: wire side-effect assurance into trial grading'
          git push origin HEAD:feat/side-effect-idempotency
