name: docs-sequence-color

on:
  push:
    branches:
      - docs/evergreen-openai-mermaid

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add trust-boundary color semantics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          path = Path('docs/OPENAI_ADAPTER.md')
          text = path.read_text(encoding='utf-8')
          old = '''    actor E as Evaluator
    participant A as Side-effect adapter
    participant T as Real subject tool callback
    participant S as Effect-state reader
'''
          new = '''    actor E as Evaluator
    box rgba(9,105,218,0.08) Evaluator-owned control and observation
      participant A as Side-effect adapter
      participant S as Effect-state reader
    end
    box rgba(207,34,46,0.08) Evaluated subject boundary
      participant T as Real subject tool callback
    end
'''
          if old not in text:
              raise SystemExit('expected sequence participant block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'rm', '.github/workflows/docs-sequence-color.yml'], check=True)
          subprocess.run(['git', 'add', 'docs/OPENAI_ADAPTER.md'], check=True)
          subprocess.run(['git', 'commit', '-m', 'docs: color side-effect sequence trust boundaries'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:docs/evergreen-openai-mermaid'], check=True)
          PY
