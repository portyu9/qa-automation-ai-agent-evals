name: Apply Python endpoint badge

on:
  push:
    branches: [chore/python-endpoint-metadata]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/python-endpoint-metadata
      - name: Apply exact badge replacement
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text()
          old = "[![Python 3.11+](https://img.shields.io/badge/Python-3.11%2B-3776AB?logo=python&logoColor=white&style=flat-square)](pyproject.toml)"
          new = "[![Python 3.11 | 3.14](https://img.shields.io/badge/Python-3.11%20%7C%203.14-3776AB?logo=python&logoColor=white&style=flat-square)](pyproject.toml)"
          if text.count(old) == 1:
              path.write_text(text.replace(old, new))
          elif text.count(new) == 1:
              raise SystemExit(0)
          else:
              raise SystemExit("expected exactly one old or new Python badge")
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: make Python endpoint badge explicit"
          git push origin HEAD:chore/python-endpoint-metadata
