# Temporary branch-only validation; remove before the final PR candidate.
name: Side-effect assurance validation

on:
  push:
    branches:
      - feat/side-effect-idempotency

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: python -m pip install --disable-pip-version-check -e '.[dev,openai]'
      - name: Ruff
        run: ruff check src/agent_evals/side_effect src/agent_evals/adapters/openai_side_effect_idempotency.py tests/unit/test_side_effect_idempotency.py tests/integration/test_openai_side_effect_idempotency_adapter.py src/agent_evals/contracts/models.py src/agent_evals/evidence/models.py src/agent_evals/runtime/evaluator.py
      - name: Ruff format
        run: ruff format --check --diff src/agent_evals/side_effect src/agent_evals/adapters/openai_side_effect_idempotency.py tests/unit/test_side_effect_idempotency.py tests/integration/test_openai_side_effect_idempotency_adapter.py src/agent_evals/contracts/models.py src/agent_evals/evidence/models.py src/agent_evals/runtime/evaluator.py
      - name: Mypy
        run: mypy
      - name: Provider-neutral side-effect tests
        run: pytest tests/unit/test_side_effect_idempotency.py
      - name: Deterministic OpenAI side-effect tests
        run: pytest -m openai tests/integration/test_openai_side_effect_idempotency_adapter.py
