name: Temporary cache-hint ownership documentation sync

on:
  push:
    branches:
      - fix/mcp-cache-hint-ttl-ownership
    paths:
      - .github/workflows/cache-hint-doc-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/mcp-cache-hint-ttl-ownership
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
      - name: Synchronize ownership semantics
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise AssertionError(f"{path}: expected one match, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          def replace_exact(path: str, old: str, new: str, count: int) -> None:
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise AssertionError(f"{path}: expected {count} matches, found {actual}: {old!r}")
              p.write_text(text.replace(old, new))

          for path, anchor in (
              (
                  "tests/integration/test_openai_mcp_tool_schema_drift_adapter.py",
                  '    assert delivery.payload["recovery_call_id"] == "call_schema_recovery"\n',
              ),
              (
                  "tests/integration/test_openai_mcp_tool_identity_drift_adapter.py",
                  '    assert delivery.payload["recovery_call_id"] == "call_identity_recovery"\n',
              ),
          ):
              addition = (
                  anchor
                  + '    assert delivery.payload["mcp_cache_hint_ttl_ms"] == _TTL_MS\n'
                  + '    assert "ttl_ms" not in delivery.payload\n'
                  + '    assert fault().payload["ttl_ms"] == _TTL_MS\n'
              )
              replace_once(path, anchor, addition)

          replace_once(
              "README.md",
              "target initially observed under positive private TTL, removed from live registry, still returned from cache, then absent after refresh",
              "target initially observed with a positive MCP cache-hint TTL, removed from live registry, still returned from cache, then absent after refresh",
          )
          replace_once(
              "README.md",
              "The stale-cache bridge does not generalize to arbitrary TTL races, shared/distributed cache coherence, notification-driven invalidation, or automatic post-retirement recovery.",
              "The stale-cache bridge does not establish SDK expiry from the MCP cache hint and does not generalize to arbitrary TTL races, shared/distributed cache coherence, notification-driven invalidation, or automatic post-retirement recovery.",
          )

          replace_once("docs/MCP_STALE_CACHE.md", "## Controlled v1 contract", "## Controlled fault contract")
          replace_once(
              "docs/MCP_STALE_CACHE.md",
              "`ttl_ms` may vary within the existing positive bounded contract. The target name remains `fault.tool_name`. The controlled callable schema remains `query: string`, and the one stale request is bound to:",
              "`fault.payload[\"ttl_ms\"]` is the positive bounded **MCP server-advertised cache-hint value**. The cross-domain bridge copies that same value into `mcp_cache_hint_ttl_ms`; the different name is deliberate ownership notation, not a transformed duration. It does **not** assert that the Agents SDK honors, waits for, or automatically expires cache entries according to that duration. Host-cache behavior is evidenced separately by `cache_tools_list=True`, the observed cached post-removal discovery, and evaluator-owned `invalidate_tools_cache()`. The target name remains `fault.tool_name`. The controlled callable schema remains `query: string`, and the one stale request is bound to:",
          )
          replace_once(
              "docs/MCP_STALE_CACHE.md",
              "- receipt schema/version;",
              "- exact bridge schema `agent-evals/mcp-agent-tool-stale-cache-receipt/v2`;",
          )
          replace_once(
              "docs/MCP_STALE_CACHE.md",
              "- positive bounded TTL;",
              "- positive bounded MCP cache-hint value as `mcp_cache_hint_ttl_ms`;",
          )
          replace_once(
              "docs/MCP_STALE_CACHE.md",
              "The nested `MCPFaultReceipt` keeps the existing standalone protocol meaning: target initially present, target still present in cached discovery after live removal, forced/fresh discovery proves target absent, and the configured TTL is bound. The bridge receipt adds the cross-domain facts that standalone protocol evidence cannot establish.",
              "The nested `MCPFaultReceipt` keeps the existing standalone protocol meaning: target initially present, target still present in cached discovery after live removal, forced/fresh discovery proves target absent, and the server-advertised MCP cache-hint TTL is bound as protocol material. The bridge receipt adds cross-domain facts that standalone protocol evidence cannot establish; it does not upgrade that hint into evidence of host-side elapsed-time expiry.",
          )
          replace_once("docs/MCP_STALE_CACHE.md", "- wrong fault kind or malformed TTL;", "- wrong fault kind or malformed MCP cache-hint TTL;")
          replace_once(
              "docs/MCP_STALE_CACHE.md",
              "TTL/chronology/root tampering",
              "MCP cache-hint TTL/chronology/root tampering",
          )
          replace_once(
              "docs/MCP_STALE_CACHE.md",
              "- arbitrary TTL races, shared/distributed caches, or cross-process cache propagation;",
              "- automatic Agents SDK expiry from the MCP cache hint, arbitrary TTL races, shared/distributed caches, or cross-process cache propagation;",
          )

          replace_once(
              "docs/MCP_IDENTITY_DRIFT.md",
              "`fault.tool_name` is the exact original identity. The replacement name must be a distinct nonblank string already bound by `fault.identity`.",
              "`fault.payload[\"ttl_ms\"]` is the MCP server-advertised cache-hint value. The cross-domain receipt binds the same value as `mcp_cache_hint_ttl_ms`; this does not assert host-side TTL expiry. Host caching is evidenced independently by `cache_tools_list=True`, cached post-rename discovery, and evaluator-owned `invalidate_tools_cache()`. `fault.tool_name` is the exact original identity. The replacement name must be a distinct nonblank string already bound by `fault.identity`.",
          )
          replace_once(
              "docs/MCP_IDENTITY_DRIFT.md",
              "- configured TTL;",
              "- MCP server-advertised cache-hint TTL from `fault.payload[\"ttl_ms\"]`;",
          )
          replace_once(
              "docs/MCP_IDENTITY_DRIFT.md",
              "- scenario identity;\n- revalidated protocol receipt and protocol-receipt root;",
              "- exact bridge schema `agent-evals/mcp-agent-tool-identity-drift-receipt/v3`;\n- scenario identity;\n- revalidated protocol receipt and protocol-receipt root;\n- the MCP cache-hint value as `mcp_cache_hint_ttl_ms`;",
          )
          replace_once(
              "docs/MCP_IDENTITY_DRIFT.md",
              "- wrong fault kind, malformed TTL, or malformed/unbound replacement identity;",
              "- wrong fault kind, malformed MCP cache-hint TTL, or malformed/unbound replacement identity;",
          )
          replace_once(
              "docs/MCP_IDENTITY_DRIFT.md",
              "- automatic `notifications/tools/list_changed` handling;",
              "- automatic `notifications/tools/list_changed` handling;\n- automatic Agents SDK expiry according to the MCP cache-hint TTL;",
          )

          replace_once(
              "docs/MCP_LAB.md",
              "initial tools/list → target present + positive private TTL",
              "initial tools/list → target present + positive MCP cache-hint TTL",
          )
          replace_once(
              "docs/MCP_LAB.md",
              "including bounded TTL and the bound before/after schema or identity relation.",
              "including the bounded MCP cache-hint TTL and the bound before/after schema or identity relation.",
          )
          replace_once(
              "docs/MCP_LAB.md",
              "public/cross-partition cache sharing, cache poisoning, arbitrary cache stores, notification invalidation, or TTL race correctness beyond the implemented relations",
              "public/cross-partition cache sharing, cache poisoning, arbitrary cache stores, notification invalidation, automatic host expiry from MCP cache hints, or TTL race correctness beyond the implemented relations",
          )

          replace_once(
              "docs/OPENAI_ADAPTER.md",
              "whose controlled payload binds the repository's narrow v1/v2 scalar-required contracts plus a positive TTL.",
              "whose controlled payload binds the repository's narrow v1/v2 scalar-required contracts plus a positive MCP cache-hint TTL.",
          )
          replace_once(
              "docs/OPENAI_ADAPTER.md",
              "- positive bound TTL;",
              "- the MCP server-advertised cache-hint value as `mcp_cache_hint_ttl_ms`;",
          )
          replace_once(
              "docs/OPENAI_ADAPTER.md",
              "`MCPAgentToolSchemaDriftReceipt` binds:\n\n- scenario identity and the revalidated `MCPFaultReceipt`;",
              "`MCPAgentToolSchemaDriftReceipt` binds:\n\n- exact bridge schema `agent-evals/mcp-agent-tool-schema-drift-receipt/v3`;\n- scenario identity and the revalidated `MCPFaultReceipt`;",
          )
          replace_once(
              "docs/OPENAI_ADAPTER.md",
              "initial-list\n< hidden schema swap\n< stale call\n< host cache invalidation\n< first refreshed v2 list\n< recovery call",
              "initial-list\n< hidden schema swap\n< cached post-swap v1 list\n< stale call\n< host cache invalidation\n< first refreshed v2 list\n< recovery call",
          )
          replace_once(
              "docs/OPENAI_ADAPTER.md",
              "The controlled payload binds a positive TTL and one exact nonblank replacement identity.",
              "The controlled payload binds a positive MCP cache-hint TTL and one exact nonblank replacement identity.",
          )
          replace_once(
              "docs/OPENAI_ADAPTER.md",
              "`MCPAgentToolIdentityDriftReceipt` binds:\n\n- scenario identity and the revalidated `MCPFaultReceipt`;",
              "`MCPAgentToolIdentityDriftReceipt` binds:\n\n- exact bridge schema `agent-evals/mcp-agent-tool-identity-drift-receipt/v3`;\n- scenario identity and the revalidated `MCPFaultReceipt`;\n- the MCP server-advertised cache-hint value as `mcp_cache_hint_ttl_ms`;",
          )
          replace_once(
              "docs/OPENAI_ADAPTER.md",
              "initial-list\n< hidden identity swap\n< stale old-name call\n< host cache invalidation\n< first refreshed replacement list\n< replacement-name recovery call",
              "initial-list\n< hidden identity swap\n< cached post-swap original-name list\n< stale old-name call\n< host cache invalidation\n< first refreshed replacement list\n< replacement-name recovery call",
          )
          replace_exact(
              "docs/OPENAI_ADAPTER.md",
              "The adapter does **not** claim model-initiated refresh or automatic `tools/list_changed` handling.",
              "The adapter does **not** claim model-initiated refresh, automatic `tools/list_changed` handling, or automatic Agents SDK expiry according to the MCP cache hint. The hint is protocol evidence; host-cache behavior is demonstrated separately by `cache_tools_list=True`, observed cached post-mutation discovery, and evaluator-owned `invalidate_tools_cache()`.",
              2,
          )

          replace_once(
              "docs/EVIDENCE_AND_REPLAY.md",
              "scenario/tool/TTL binding",
              "scenario/tool/MCP-cache-hint binding (`mcp_cache_hint_ttl_ms` at the bridge boundary)",
          )
          replace_once(
              "docs/SECURITY.md",
              "`MCPAgentToolStaleCacheReceipt` binds target/TTL/call/argument/rejection/model-set/ordinal material without duplicating raw rejection text.",
              "`MCPAgentToolStaleCacheReceipt` binds target/MCP-cache-hint/call/argument/rejection/model-set/ordinal material, naming the bridge field `mcp_cache_hint_ttl_ms`, without duplicating raw rejection text. That field binds server-advertised protocol material; it is not evidence of automatic SDK TTL expiry.",
          )
          replace_once(
              "docs/SECURITY.md",
              "notification invalidation, or TTL race correctness",
              "notification invalidation, automatic host expiry from MCP cache hints, or TTL race correctness",
          )
          replace_once(
              "docs/LIMITATIONS.md",
              "generic cache-coherence policy, arbitrary TTL race behavior, notification-driven invalidation",
              "generic cache-coherence policy, automatic Agents SDK expiry from MCP cache hints, arbitrary TTL race behavior, notification-driven invalidation",
          )
          replace_once(
              "docs/LIMITATIONS.md",
              "a `TOOL_SCHEMA_DRIFT` fault whose payload matches the bound deterministic v1/v2 scalar-required fixture and positive TTL",
              "a `TOOL_SCHEMA_DRIFT` fault whose payload matches the bound deterministic v1/v2 scalar-required fixture and positive MCP cache-hint TTL",
          )
          replace_once(
              "docs/LIMITATIONS.md",
              "a `TOOL_IDENTITY_DRIFT` fault with positive TTL and one exact distinct replacement tool name",
              "a `TOOL_IDENTITY_DRIFT` fault with positive MCP cache-hint TTL and one exact distinct replacement tool name",
          )

          docs = "\n".join(
              Path(p).read_text()
              for p in (
                  "docs/MCP_STALE_CACHE.md",
                  "docs/MCP_IDENTITY_DRIFT.md",
                  "docs/OPENAI_ADAPTER.md",
              )
          )
          for schema in (
              "agent-evals/mcp-agent-tool-stale-cache-receipt/v2",
              "agent-evals/mcp-agent-tool-schema-drift-receipt/v3",
              "agent-evals/mcp-agent-tool-identity-drift-receipt/v3",
          ):
              if schema not in docs:
                  raise AssertionError(f"missing documented bridge schema: {schema}")
          PY
      - name: Verify provider-neutral contract
        run: |
          python -m pip install --disable-pip-version-check -e '.[dev]'
          ruff check .
          ruff format --check --diff .
          mypy
          pytest -q
      - name: Verify pinned SDK ownership assertions
        run: |
          python -m pip install --disable-pip-version-check -e '.[openai]'
          pytest -q -m 'openai and mcp' \
            tests/integration/test_openai_mcp_tool_stale_cache_adapter.py \
            tests/integration/test_openai_mcp_tool_schema_drift_adapter.py \
            tests/integration/test_openai_mcp_tool_identity_drift_adapter.py
          python - <<'PY'
          from pathlib import Path
          for path in (
              "tests/integration/test_openai_mcp_tool_stale_cache_adapter.py",
              "tests/integration/test_openai_mcp_tool_schema_drift_adapter.py",
              "tests/integration/test_openai_mcp_tool_identity_drift_adapter.py",
          ):
              text = Path(path).read_text()
              assert 'delivery.payload["mcp_cache_hint_ttl_ms"]' in text
              assert 'assert "ttl_ms" not in delivery.payload' in text
              assert 'fault().payload["ttl_ms"]' in text
          PY
      - name: Commit synchronized contract and remove helper
        run: |
          rm .github/workflows/cache-hint-doc-audit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs tests/integration .github/workflows/cache-hint-doc-audit.yml
          git diff --cached --check
          git commit -m 'docs: distinguish MCP cache hints from host expiry'
          git push origin HEAD:fix/mcp-cache-hint-ttl-ownership
