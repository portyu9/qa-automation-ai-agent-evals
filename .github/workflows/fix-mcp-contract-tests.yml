name: Temporary MCP contract verifier

on:
  push:
    branches: [test/mcp-contract-trust-boundaries]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: test/mcp-contract-trust-boundaries
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Apply lint-safe probe assertions
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/unit/test_mcp_contract_trust_boundaries.py')
          text = path.read_text()
          old = '''    assert getattr(with_receipt, "receipt") == matching
    assert getattr(without_receipt, "receipt") is None
'''
          new = '''    assert with_receipt.receipt == matching
    assert without_receipt.receipt is None
'''
          if text.count(old) != 1:
              raise AssertionError('probe receipt assertion block changed')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Verify contract suite and coverage
        run: |
          python -m pip install --disable-pip-version-check -e '.[dev]'
          ruff format tests/unit/test_mcp_contract_trust_boundaries.py
          ruff check tests/unit/test_mcp_contract_trust_boundaries.py
          pytest -q tests/unit/test_mcp_models.py tests/unit/test_mcp_fault_payload_json_contract.py tests/unit/test_mcp_contract_trust_boundaries.py
          pytest --cov=agent_evals --cov-branch --cov-report=term-missing
          coverage report --fail-under=90
      - name: Commit corrected suite and remove helper
        run: |
          rm .github/workflows/fix-mcp-contract-tests.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/unit/test_mcp_contract_trust_boundaries.py .github/workflows/fix-mcp-contract-tests.yml
          git diff --cached --check
          git commit -m 'test: verify MCP contract trust boundaries'
          git push origin HEAD:test/mcp-contract-trust-boundaries
