name: Side-effect oracle typing helper

on:
  push:
    branches:
      - feat/side-effect-idempotency

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Keep conditional oracle construction statically precise
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/agent_evals/runtime/evaluator.py')
          text = path.read_text()
          old = '''        oracles = self._oracles\n        if scenario.side_effect_idempotency is not None:\n            oracles = (self._oracles[0], SideEffectIdempotencyOracle(), self._oracles[1])\n        oracle_results = tuple(oracle.grade(scenario, evidence) for oracle in oracles)\n'''
          new = '''        if scenario.side_effect_idempotency is not None:\n            oracle_results = tuple(\n                oracle.grade(scenario, evidence)\n                for oracle in (\n                    self._oracles[0],\n                    SideEffectIdempotencyOracle(),\n                    self._oracles[1],\n                )\n            )\n        else:\n            oracle_results = tuple(oracle.grade(scenario, evidence) for oracle in self._oracles)\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one conditional-oracle block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/side-effect-oracle-type-helper.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/agent_evals/runtime/evaluator.py .github/workflows/side-effect-oracle-type-helper.yml
          git commit -m 'fix: type conditional side-effect oracle construction'
          git push origin HEAD:feat/side-effect-idempotency
