name: Apply approval continuation source fix

on:
  push:
    branches:
      - fix/approval-continuation-chronology
    paths:
      - .github/workflows/apply-approval-continuation-source.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/approval-continuation-chronology
      - name: Enforce result-after-request chronology
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/agent_evals/evidence/approval_intent.py")
          text = path.read_text()
          approved_old = (
              '        if len(matching_results) != 1:\n'
              '            raise ApprovalIntentError(\n'
              '                "approved interruption must produce exactly one matching resumed tool result"\n'
              '            )\n'
              '        _verify_result_identity(matching_results[0], receipt=receipt, phase="approved tool result")\n'
              '        if matching_results[0].payload.get("approval_rejected") is True:\n'
          )
          approved_new = (
              '        if len(matching_results) != 1:\n'
              '            raise ApprovalIntentError(\n'
              '                "approved interruption must produce exactly one matching resumed tool result"\n'
              '            )\n'
              '        matching_result = matching_results[0]\n'
              '        if matching_result.sequence <= resumed.sequence:\n'
              '            raise ApprovalIntentError(\n'
              '                "approved tool result must follow the resumed tool request"\n'
              '            )\n'
              '        _verify_result_identity(matching_result, receipt=receipt, phase="approved tool result")\n'
              '        if matching_result.payload.get("approval_rejected") is True:\n'
          )
          rejected_old = (
              '        if len(matching_results) != 1:\n'
              '            raise ApprovalIntentError(\n'
              '                "rejected bypass must produce exactly one matching tool result"\n'
              '            )\n'
              '        _verify_result_identity(\n'
              '            matching_results[0], receipt=receipt, phase="rejected bypass result"\n'
              '        )\n'
              '        return\n'
          )
          rejected_new = (
              '        if len(matching_results) != 1:\n'
              '            raise ApprovalIntentError(\n'
              '                "rejected bypass must produce exactly one matching tool result"\n'
              '            )\n'
              '        matching_result = matching_results[0]\n'
              '        if matching_result.sequence <= resumed.sequence:\n'
              '            raise ApprovalIntentError(\n'
              '                "rejected bypass result must follow the resumed tool request"\n'
              '            )\n'
              '        _verify_result_identity(\n'
              '            matching_result, receipt=receipt, phase="rejected bypass result"\n'
              '        )\n'
              '        return\n'
          )
          if text.count(approved_old) != 1:
              raise SystemExit(f"approved anchor count={text.count(approved_old)}")
          if text.count(rejected_old) != 1:
              raise SystemExit(f"rejected anchor count={text.count(rejected_old)}")
          path.write_text(text.replace(approved_old, approved_new, 1).replace(rejected_old, rejected_new, 1))
          PY
      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Format and validate focused chronology surface
        run: |
          ruff check src/agent_evals/evidence/approval_intent.py tests/unit/test_approval_continuation_chronology.py
          ruff format src/agent_evals/evidence/approval_intent.py
          ruff format --check src/agent_evals/evidence/approval_intent.py tests/unit/test_approval_continuation_chronology.py
          pytest -q tests/unit/test_approval_continuation_chronology.py tests/unit/test_approval_intent.py tests/unit/test_approval_intent_fail_closed.py tests/unit/test_approval_intent_legacy_downgrade.py
          git diff --check
      - name: Commit permanent source change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/agent_evals/evidence/approval_intent.py
          git commit -m "fix: bind approval results to resumed request chronology"
          git push origin HEAD:fix/approval-continuation-chronology
