name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "53 6 * * 4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    name: Security scanners
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact security subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate mandatory security scanner stack
        run: python .github/scripts/validate_security_stack.py

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install exact hash-checked security profile
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --require-hashes -r requirements/locks/core-py311.txt
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation .
          python -m pip check

      - name: Bandit static security scan
        run: bandit -q -r src

      - name: Audit installed dependency graph
        run: pip-audit

  security-gate:
    name: security-gate
    if: always()
    needs: [security-scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require security qualification
        env:
          SECURITY_SCAN: ${{ needs.security-scan.result }}
        run: |
          set -euo pipefail
          test "$SECURITY_SCAN" = "success"
