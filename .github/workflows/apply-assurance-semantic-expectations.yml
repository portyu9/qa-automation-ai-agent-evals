name: Apply assurance semantic test expectations

on:
  push:
    branches:
      - fix/assurance-semantic-evidence-binding
    paths:
      - .github/workflows/apply-assurance-semantic-expectations.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/assurance-semantic-evidence-binding
      - name: Update stronger-boundary assertions
        shell: bash
        run: |
          python -c 'from pathlib import Path; p=Path("tests/unit/test_assurance_semantic.py"); t=p.read_text(); assert t.count("subject identity does not match report")==1; assert t.count("scenario identity does not match report")==1; p.write_text(t.replace("subject identity does not match report", "subject identity does not match evidence", 1).replace("scenario identity does not match report", "scenario identity does not match evidence", 1))'
          python -m compileall -q tests/unit/test_assurance_semantic.py
      - name: Commit test expectations
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/test_assurance_semantic.py
          git diff --cached --check
          git commit -m "test: expect semantic evidence identity validation"
          git push origin HEAD:fix/assurance-semantic-evidence-binding
