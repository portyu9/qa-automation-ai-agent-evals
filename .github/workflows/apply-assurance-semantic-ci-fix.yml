name: Apply assurance semantic CI expectation fix

on:
  push:
    branches:
      - fix/assurance-semantic-evidence-binding
    paths:
      - .github/workflows/apply-assurance-semantic-ci-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/assurance-semantic-evidence-binding
      - name: Update duplicate-event expectation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/unit/test_assurance_semantic.py")
          text = path.read_text()
          old = 'with pytest.raises(ValueError, match="exactly one recorded judgment"):'
          new = 'with pytest.raises(ValueError, match="at most one recorded judgment"):'
          if text.count(old) != 1:
              raise SystemExit(f"expected one duplicate-event assertion, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit expectation fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/test_assurance_semantic.py
          git diff --cached --check
          git commit -m "test: align duplicate semantic event expectation"
          git push origin HEAD:fix/assurance-semantic-evidence-binding
