name: Apply blocked semantic assurance fix

on:
  push:
    branches:
      - fix/assurance-blocked-semantic-history
    paths:
      - .github/workflows/apply-assurance-blocked-semantic-history.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/assurance-blocked-semantic-history
      - name: Apply source, regression, and documentation changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          report = Path("src/agent_evals/assurance/report.py")
          text = report.read_text()
          start_marker = (
              "            try:\n"
              "                evidence_semantic = verify_semantic_judgment_evidence(evidence)\n"
          )
          end_marker = (
              "            if semantic is not None and evidence_semantic != semantic:\n"
              "                raise ValueError(\n"
              "                    \"trial semantic judgment does not match the receipt committed by final evidence\"\n"
              "                )\n"
          )
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit(
                  f"report sentinels start={text.count(start_marker)} end={text.count(end_marker)}"
              )
          start = text.index(start_marker)
          end = text.index(end_marker, start) + len(end_marker)
          new_block = '''            semantic = (
              SemanticJudgmentReceipt.model_validate(
                  trial.semantic_judgment.model_dump(mode="json")
              )
              if trial.semantic_judgment is not None
              else None
          )
          if trial.verdict is not TrialVerdict.BLOCKED:
              try:
                  evidence_semantic = verify_semantic_judgment_evidence(evidence)
              except SemanticJudgmentError as exc:
                  raise ValueError(f"trial semantic judgment evidence is invalid: {exc}") from exc

              if semantic is None and evidence_semantic is not None:
                  raise ValueError(
                      "trial semantic judgment field is absent but final evidence commits a judgment"
                  )
              if semantic is not None and evidence_semantic is None:
                  raise ValueError(
                      "trial semantic judgment is not committed by the final evidence envelope"
                  )
              if semantic is not None and evidence_semantic != semantic:
                  raise ValueError(
                      "trial semantic judgment does not match the receipt committed by final evidence"
                  )
          '''
          # The first line already contains source indentation; indent following lines to the same loop scope.
          lines = new_block.splitlines()
          new_block = "\n".join(
              [lines[0], *[("            " + line if line else "") for line in lines[1:]]]
          ) + "\n"
          report.write_text(text[:start] + new_block + text[end:])

          test = Path("tests/unit/test_semantic_replay.py")
          text = test.read_text()
          replacements = (
              (
                  "from dataclasses import dataclass\n",
                  "from dataclasses import dataclass, replace\n",
              ),
              (
                  "from agent_evals.adapters.replay import EvidenceReplayAdapter\n",
                  "from agent_evals.adapters.replay import EvidenceReplayAdapter\n"
                  "from agent_evals.assurance.report import AssuranceReport\n",
              ),
              (
                  "from agent_evals.evidence.models import TrialVerdict\n",
                  "from agent_evals.evidence.models import TrialEvidence, TrialVerdict\n"
                  "from agent_evals.gates.release import ReleasePolicy\n",
              ),
              (
                  "from agent_evals.runtime.evaluator import TrialRunner\n",
                  "from agent_evals.runtime.evaluator import EvaluatedTrial, TrialRunner\n"
                  "from agent_evals.runtime.session import EvaluationSessionResult\n",
              ),
          )
          for before, after in replacements:
              if text.count(before) != 1:
                  raise SystemExit(f"test import anchor count={text.count(before)} for {before!r}")
              text = text.replace(before, after, 1)

          import_marker = ")\n\n\ndef _subject() -> SubjectFingerprint:\n"
          import_replacement = (
              ")\n"
              "from agent_evals.semantic.receipt import SemanticJudgmentReceipt\n"
              "from agent_evals.semantic.verification import append_semantic_judgment\n"
              "from agent_evals.statistics.reliability import ReliabilityReport\n\n\n"
              "def _subject() -> SubjectFingerprint:\n"
          )
          if text.count(import_marker) != 1:
              raise SystemExit(f"semantic import marker count={text.count(import_marker)}")
          text = text.replace(import_marker, import_replacement, 1)

          helper_anchor = "class _Judge:\n"
          helpers = '''def _report_session(trial: EvaluatedTrial) -> EvaluationSessionResult:
              return EvaluationSessionResult(
                  subject_identity=trial.evidence.subject_identity,
                  scenario_identity=trial.evidence.scenario_identity,
                  trials=(trial,),
                  reliability=ReliabilityReport.from_verdicts((trial.verdict,)),
              )


          def _report_policy() -> ReleasePolicy:
              return ReleasePolicy(
                  min_resolved_trials=1,
                  min_success_rate=0.0,
                  min_wilson_low=0.0,
                  max_critical_violations=0,
                  max_blocked_trials=1,
                  max_inconclusive_trials=1,
              )


          class _Judge:
          '''
          helpers = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in helpers.splitlines()
          ) + "\n"
          if text.count(helper_anchor) != 1:
              raise SystemExit(f"test helper anchor count={text.count(helper_anchor)}")
          text = text.replace(helper_anchor, helpers, 1)

          test_start = (
              "@pytest.mark.asyncio\n"
              "async def test_replay_rejects_semantic_evidence_after_deterministic_failure() -> None:\n"
          )
          if text.count(test_start) != 1:
              raise SystemExit(f"semantic replay tail anchor count={text.count(test_start)}")
          tail = text.index(test_start)
          new_tests = '''@pytest.mark.asyncio
          async def test_assurance_reports_runtime_blocked_rejected_semantic_history() -> None:
              subject = _subject()
              scenario = _scenario()
              judge = _Judge()
              live = await TrialRunner(semantic_judge=judge).run(
                  _StaticAdapter(),
                  subject=subject,
                  scenario=scenario,
                  trial_id="semantic-rejected-history",
              )
              semantic_event = live.evidence.events[-1]
              malformed_payload = dict(semantic_event.payload)
              malformed_payload["receipt_root"] = "0" * 64
              malformed_event = semantic_event.model_copy(update={"payload": malformed_payload})
              malformed_evidence = live.evidence.model_copy(
                  update={"events": (*live.evidence.events[:-1], malformed_event)}
              )

              blocked = await TrialRunner().run(
                  EvidenceReplayAdapter(malformed_evidence),
                  subject=subject,
                  scenario=scenario,
                  trial_id="semantic-rejected-history",
              )

              assert blocked.verdict is TrialVerdict.BLOCKED
              assert blocked.oracle_results == ()
              assert blocked.semantic_judgment is None
              assert blocked.evidence.events[-2].kind.value == "semantic_judgment"
              assert blocked.evidence.events[-1].payload["code"] == "semantic_judgment_unverified"

              report = AssuranceReport.from_session(
                  _report_session(blocked),
                  release_policy=_report_policy(),
              )
              assert report.trials[0].verdict is TrialVerdict.BLOCKED
              assert report.trials[0].oracle_results == ()
              assert report.trials[0].semantic_judgment is None
              assert report.trials[0].evidence_root == blocked.evidence.evidence_root

              assert live.semantic_judgment is not None
              forged = replace(blocked, semantic_judgment=live.semantic_judgment)
              with pytest.raises(
                  ValueError,
                  match="blocked assurance trial cannot contain semantic judgment",
              ):
                  AssuranceReport.from_session(
                      _report_session(forged),
                      release_policy=_report_policy(),
                  )


          @pytest.mark.asyncio
          async def test_assurance_reports_runtime_blocked_semantic_after_deterministic_failure() -> None:
              subject = _subject()
              base = _scenario()
              failing_scenario = EvaluationScenario(
                  scenario_id=base.scenario_id,
                  revision=base.revision,
                  kind=base.kind,
                  objective=base.objective,
                  semantic_rubric=base.semantic_rubric,
                  required_outcomes={"required": "value"},
              )
              pre_semantic = TrialEvidence(
                  trial_id="semantic-invalid-precedence",
                  subject_identity=subject.identity,
                  scenario_identity=failing_scenario.identity,
                  final_state={"unexpected": "state"},
                  final_output="Grounded answer.",
              )
              judge_input = SemanticJudgeInput(
                  objective=failing_scenario.objective,
                  rubric=_rubric(),
                  candidate_output="Grounded answer.",
              )
              receipt = SemanticJudgmentReceipt.create(
                  scenario_identity=failing_scenario.identity,
                  subject_identity=subject.identity,
                  subject_evidence_root=pre_semantic.evidence_root,
                  rubric=_rubric(),
                  judge_profile=_profile(),
                  calibration_receipt=_calibration(),
                  judge_input=judge_input,
                  response=_response(SemanticDecision.PASS),
              )
              recorded = append_semantic_judgment(pre_semantic, receipt)

              blocked = await TrialRunner().run(
                  EvidenceReplayAdapter(recorded),
                  subject=subject,
                  scenario=failing_scenario,
                  trial_id="semantic-invalid-precedence",
              )

              assert blocked.verdict is TrialVerdict.BLOCKED
              assert blocked.oracle_results == ()
              assert blocked.semantic_judgment is None
              assert blocked.evidence.events[-2].kind.value == "semantic_judgment"
              assert blocked.evidence.events[-1].payload["code"] == (
                  "semantic_judgment_after_deterministic_failure"
              )

              report = AssuranceReport.from_session(
                  _report_session(blocked),
                  release_policy=_report_policy(),
              )
              assert report.trials[0].verdict is TrialVerdict.BLOCKED
              assert report.trials[0].semantic_judgment is None
              assert report.trials[0].evidence_root == blocked.evidence.evidence_root
          '''
          new_tests = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in new_tests.splitlines()
          ) + "\n"
          test.write_text(text[:tail] + new_tests)

          docs = Path("docs/ASSURANCE_REPORTS.md")
          text = docs.read_text()
          old_doc = '- optional semantic grading must be the exact valid receipt committed by one terminal, recognized, non-critical `SEMANTIC_JUDGMENT` event in that final evidence envelope, including the exact reconstructed pre-semantic evidence root; absence must match on both sides;\n'
          new_doc = (
              '- for resolved or inconclusive trials, optional semantic grading must be the exact valid receipt committed by one terminal, recognized, non-critical `SEMANTIC_JUDGMENT` event in that final evidence envelope, including the exact reconstructed pre-semantic evidence root; absence must match on both sides;\n'
              '- `BLOCKED` trials carry no finalized semantic grading authority: rejected semantic events may remain in the final evidence history before the evaluator error that caused blocking, but they are not copied into the report semantic field;\n'
          )
          if text.count(old_doc) != 1:
              raise SystemExit(f"assurance doc anchor count={text.count(old_doc)}")
          docs.write_text(text.replace(old_doc, new_doc, 1))
          PY
      - name: Install targeted test dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Normalize touched Python files
        run: |
          ruff check --fix src/agent_evals/assurance/report.py tests/unit/test_semantic_replay.py
          ruff format src/agent_evals/assurance/report.py tests/unit/test_semantic_replay.py
      - name: Run focused regression tests
        run: pytest -q tests/unit/test_semantic_replay.py tests/unit/test_assurance_semantic.py tests/unit/test_assurance_report.py
      - name: Validate patch
        run: |
          ruff check src/agent_evals/assurance/report.py tests/unit/test_semantic_replay.py
          ruff format --check src/agent_evals/assurance/report.py tests/unit/test_semantic_replay.py
          git diff --check
      - name: Commit permanent changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/agent_evals/assurance/report.py tests/unit/test_semantic_replay.py docs/ASSURANCE_REPORTS.md
          git commit -m "fix: report blocked trials with rejected semantic history"
          git push origin HEAD:fix/assurance-blocked-semantic-history
