name: docs-hub-link-fix

on:
  push:
    branches:
      - docs/evergreen-openai-mermaid

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link the framework surface from the authoritative docs hub
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          path = Path('docs/README.md')
          text = path.read_text(encoding='utf-8')
          anchor = '| [ARCHITECTURE.md](ARCHITECTURE.md) | Where do identity, adversarial derivation, protocol faults, six MCP→agent bridges, authorization/OAuth, evidence, grading, persistence, reporting, and release authority live? |'
          row = '| [FRAMEWORK_SURFACE.md](FRAMEWORK_SURFACE.md) | Which framework, provider, protocol, evidence, and release-assurance surfaces are executable, and where are their trust boundaries documented? |'
          if row in text:
              raise SystemExit('framework surface row already present')
          if anchor not in text:
              raise SystemExit('docs table anchor not found')
          text = text.replace(anchor, anchor + '\n' + row, 1)
          path.write_text(text, encoding='utf-8')

          files = [Path('README.md'), *sorted(Path('docs').glob('*.md'))]
          forbidden = re.compile(r'\bversion(?:ed|ing|s)?\b|--version\b', re.I)
          hits = []
          links = set()
          for doc in files:
              body = doc.read_text(encoding='utf-8')
              for lineno, line in enumerate(body.splitlines(), 1):
                  if forbidden.search(line):
                      hits.append(f'{doc}:{lineno}: {line}')
              if doc == Path('docs/README.md'):
                  for target in re.findall(r'\[[^\]]+\]\(([^)#]+\.md)(?:#[^)]+)?\)', body):
                      links.add((doc.parent / target).resolve())
          expected = {p.resolve() for p in Path('docs').glob('*.md') if p.name != 'README.md'}
          missing = sorted(p.name for p in expected - links)
          print(f'SUMMARY files={len(files)} forbidden_word_lines={len(hits)} docs_hub_missing={len(missing)}')
          for item in hits:
              print(item)
          if missing:
              print('missing:', ', '.join(missing))
          if hits or missing:
              raise SystemExit('docs hub acceptance failed')

          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'rm', '.github/workflows/docs-hub-link-fix.yml'], check=True)
          subprocess.run(['git', 'add', 'docs/README.md'], check=True)
          subprocess.run(['git', 'commit', '-m', 'docs: link framework surface from docs hub'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:docs/evergreen-openai-mermaid'], check=True)
          PY
