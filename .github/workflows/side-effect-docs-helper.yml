name: Side-effect documentation helper

on:
  push:
    branches:
      - feat/side-effect-idempotency

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Synchronize side-effect assurance documentation
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one anchor, found {count}: {old[:80]!r}')
              file.write_text(text.replace(old, new, 1))

          # Root README: navigation, invariants, executable scope, tables, and feature summary.
          replace_once(
              'README.md',
              '[HITL Approval](docs/APPROVAL_INTENT.md) · [Adversarial Testing](docs/ADVERSARIAL_TESTING.md)',
              '[HITL Approval](docs/APPROVAL_INTENT.md) · [Side-Effect Idempotency](docs/SIDE_EFFECT_IDEMPOTENCY.md) · [Adversarial Testing](docs/ADVERSARIAL_TESTING.md)',
          )
          replace_once(
              'README.md',
              'A tool call is not a successful side effect. An approval request is not an approval grant,',
              'A tool call is not a successful side effect. A duplicate-looking tool result is not proof that a repeated logical operation avoided a second physical mutation. An approval request is not an approval grant,',
          )
          replace_once(
              'README.md',
              '| **Retry label ≠ causal retry** | a second identical tool call is credited as recovery only when evidence orders the first result before the second request |',
              '| **Retry label ≠ causal retry** | a second identical tool call is credited as recovery only when evidence orders the first result before the second request |\n| **Duplicate attempt ≠ idempotent effect** | two exact logical-operation attempts are idempotent only when independently sampled effect state proves at most one physical mutation |',
          )
          replace_once(
              'README.md',
              'including scenario-owned directed handoff grants, exact accepted authority-path state, scenario-bound optional approval intent, optional content-addressed semantic rubrics, and scenario-owned deterministic retrieval contracts',
              'including scenario-owned directed handoff grants, exact accepted authority-path state, scenario-bound optional approval intent, optional run-local side-effect idempotency contracts, optional content-addressed semantic rubrics, and scenario-owned deterministic retrieval contracts',
          )
          replace_once(
              'README.md',
              'native handoff-authority attenuation, an exact native HITL `ToolApprovalItem` → same-`RunState` approve/reject continuation path, and a one-turn no-tools semantic judge',
              'native handoff-authority attenuation, an exact native HITL `ToolApprovalItem` → same-`RunState` approve/reject continuation path, a separate two-attempt local `FunctionTool` side-effect observer that never suppresses the subject callback, and a one-turn no-tools semantic judge',
          )
          replace_once(
              'README.md',
              '| **Scenario contract** | versioned objective, initial state, required/forbidden outcomes, classification, tags, fail-closed authority, exact optional root agent, canonical directed handoff grants, optional exact `ApprovalIntentSpec`, optional content-addressed `SemanticRubricSpec`, and optional `RetrievalContractSpec`; all behavior-bearing material participates in scenario identity |',
              '| **Scenario contract** | versioned objective, initial state, required/forbidden outcomes, classification, tags, fail-closed authority, exact optional root agent, canonical directed handoff grants, optional exact `ApprovalIntentSpec`, optional exact `SideEffectIdempotencySpec`, optional content-addressed `SemanticRubricSpec`, and optional `RetrievalContractSpec`; all behavior-bearing material participates in scenario identity |',
          )
          replace_once(
              'README.md',
              '| **Replay** | exact trial/subject/scenario historical regrading including delivery-receipt, approval-intent, handoff-authority, and persisted semantic-judgment revalidation; replay never silently calls a fresh semantic model |',
              '| **Replay** | exact trial/subject/scenario historical regrading including delivery-receipt, approval-intent, side-effect-observation, handoff-authority, and persisted semantic-judgment revalidation; replay never reruns subject side effects or silently calls a fresh semantic model |',
          )
          replace_once(
              'README.md',
              '| **Outcome oracle** | independently validates required and forbidden terminal state |\n| **Policy oracle** |',
              '| **Outcome oracle** | independently validates required and forbidden terminal state |\n| **Side-effect idempotency oracle** | when configured, critically fails verified duplicate physical mutation across two exact attempts to one scenario-bound logical operation; ordinary scenarios retain the historical policy/outcome oracle surface |\n| **Policy oracle** |',
          )
          replace_once(
              'README.md',
              '### Deterministic retrieval provenance and poisoning assurance\n',
              '''### Run-local side-effect idempotency assurance\n\n`OpenAIAgentsSideEffectIdempotencyAdapter` observes an existing local SDK `FunctionTool` without suppressing or repairing it. The real callback executes on both model-selected attempts. An evaluator-owned `effect_reader` is sampled immediately before and after each callback; exact call IDs, strict canonical arguments, logical-operation key, continuous effect digests, matching results, and serialized chronology close one `SideEffectIdempotencyReceipt`. `TrialRunner` revalidates that receipt before inserting `SideEffectIdempotencyOracle` between policy and outcome grading for opted-in scenarios.\n\nA verified second physical mutation is a critical subject `FAIL`; missing/ambiguous call provenance, malformed relation evidence, or effect-reader failure is `EVALUATION_ERROR / BLOCKED`. Replay regrades the historical receipt without invoking the callback or effect reader again. This does not claim distributed exactly-once execution, durable idempotency storage, crash/concurrency safety, external-target enforcement, or live-provider behavior. See [Side-Effect Idempotency Assurance](docs/SIDE_EFFECT_IDEMPOTENCY.md).\n\n### Deterministic retrieval provenance and poisoning assurance\n''',
          )

          # Documentation index.
          replace_once(
              'docs/README.md',
              '**approval-intent evidence**, **evaluation-precondition evidence**,',
              '**approval-intent evidence**, **side-effect observation evidence**, **evaluation-precondition evidence**,',
          )
          replace_once(
              'docs/README.md',
              'Approval decision receipt   ≠ human identity or external authorization\n',
              'Approval decision receipt   ≠ human identity or external authorization\nDuplicate-looking tool result ≠ proof of idempotent physical effect\n',
          )
          replace_once(
              'docs/README.md',
              '| [APPROVAL_INTENT.md](APPROVAL_INTENT.md) | How is one native OpenAI HITL approve/reject decision bound to the exact pending invocation, accepted delegated-authority path, same-run continuation, and deterministic failure semantics? |',
              '| [APPROVAL_INTENT.md](APPROVAL_INTENT.md) | How is one native OpenAI HITL approve/reject decision bound to the exact pending invocation, accepted delegated-authority path, same-run continuation, and deterministic failure semantics? |\n| [SIDE_EFFECT_IDEMPOTENCY.md](SIDE_EFFECT_IDEMPOTENCY.md) | How are two exact attempts to one logical operation bound to independently observed effect digests, reverified on replay, and graded without suppressing bad subject behavior? |',
          )
          replace_once(
              'docs/README.md',
              '| native OpenAI HITL interruption and exact approve/reject continuation | `ApprovalIntentSpec` + `ApprovalIntentReceipt` / `APPROVAL_DECISION` + normalized continuation evidence | human identity, enterprise approval attestation, production IAM, or target-side authorization |',
              '| native OpenAI HITL interruption and exact approve/reject continuation | `ApprovalIntentSpec` + `ApprovalIntentReceipt` / `APPROVAL_DECISION` + normalized continuation evidence | human identity, enterprise approval attestation, production IAM, or target-side authorization |\n| two exact local OpenAI tool attempts to one logical operation | `SideEffectIdempotencySpec` + `SideEffectIdempotencyReceipt` / `SIDE_EFFECT_OBSERVATION` + exact request/result chronology | distributed exactly-once execution, durable deduplication, concurrency/crash safety, or external-target enforcement |',
          )
          replace_once(
              'docs/README.md',
              '## MCP agent-bridge scope in one paragraph\n',
              '''## Side-effect idempotency in one paragraph\n\n`OpenAIAgentsSideEffectIdempotencyAdapter` wraps a copied local `FunctionTool` only to sample evaluator-owned effect state immediately before and after the real subject callback. Both callbacks execute, their output/exception behavior is preserved, and two distinct OpenAI call identities plus strict equal arguments must close one continuous two-attempt receipt. `TrialRunner` revalidates the receipt before `SideEffectIdempotencyOracle` can grade it. A verified second physical mutation is critical `FAIL`; missing or contradictory observation/provenance is `BLOCKED`. Replay rechecks the historical receipt without rerunning either callback or the effect reader. See [Side-Effect Idempotency Assurance](SIDE_EFFECT_IDEMPOTENCY.md).\n\n## MCP agent-bridge scope in one paragraph\n''',
          )

          # Evaluation model: conditional deterministic oracle and ordering semantics.
          replace_once(
              'docs/EVALUATION_MODEL.md',
              '''The runtime has two deterministic oracles:\n\n1. policy oracle;\n2. outcome oracle.\n\nWhen a scenario has no semantic rubric, those oracles preserve the existing deterministic-only behavior: any oracle failure yields `FAIL`; otherwise the trial yields `PASS`.\n''',
              '''The baseline runtime has two deterministic oracles:\n\n1. policy oracle;\n2. outcome oracle.\n\nOrdinary scenarios retain that historical surface. When `EvaluationScenario.side_effect_idempotency` is configured, successful side-effect-observation verification inserts a third deterministic oracle **between** them: `PolicyOracle → SideEffectIdempotencyOracle → OutcomeOracle`. The side-effect oracle is critical when a verified duplicate logical-operation attempt produces a second observable physical mutation or when the scenario requires a first mutation and none occurs.\n\nWhen a scenario has no semantic rubric, the active deterministic oracle set remains authoritative: any oracle failure yields `FAIL`; otherwise the trial yields `PASS`.\n''',
          )
          replace_once(
              'docs/EVALUATION_MODEL.md',
              '''PolicyOracle + OutcomeOracle\n    ├─ any deterministic FAIL''',
              '''PolicyOracle + optional SideEffectIdempotencyOracle + OutcomeOracle\n    ├─ any deterministic FAIL''',
          )
          replace_once(
              'docs/EVALUATION_MODEL.md',
              'Provider/runtime failure, unverifiable evaluation preconditions, malformed semantic evidence,',
              'Provider/runtime failure, unverifiable evaluation preconditions (including an enabled side-effect observation relation), malformed semantic evidence,',
          )
          replace_once(
              'docs/EVALUATION_MODEL.md',
              'For policy assertions such as approval-before-mutation, and for semantic receipt binding to pre-semantic evidence, event ordering is part of correctness and is evaluated directly.',
              'For policy assertions such as approval-before-mutation, for two-attempt side-effect chronology (`request1 < result1 < request2 < result2 < observation`), and for semantic receipt binding to pre-semantic evidence, event ordering is part of correctness and is evaluated directly.',
          )
          replace_once(
              'docs/EVALUATION_MODEL.md',
              'The current `PolicyOracle` marks policy failure critical. More specialized deterministic critical oracles can extend the same release semantics without granting semantic models critical release authority.',
              'The current `PolicyOracle` marks policy failure critical. `SideEffectIdempotencyOracle` is also critical when its scenario-owned contract is enabled and verified evidence proves duplicate physical mutation or a missing required first effect. More specialized deterministic critical oracles can extend the same release semantics without granting semantic models critical release authority.',
          )

          # OpenAI adapter overview and trust boundary.
          replace_once('docs/OPENAI_ADAPTER.md', 'Nine adapter boundaries are intentionally distinct:', 'Ten adapter boundaries are intentionally distinct:')
          replace_once(
              'docs/OPENAI_ADAPTER.md',
              '- `OpenAIAgentsHITLApprovalAdapter` — one exact native SDK `ToolApprovalItem` interruption bound to scenario-owned approve/reject intent, stable call identity, canonical arguments, exact resource, accepted authority path, and same-`RunState` continuation;',
              '- `OpenAIAgentsHITLApprovalAdapter` — one exact native SDK `ToolApprovalItem` interruption bound to scenario-owned approve/reject intent, stable call identity, canonical arguments, exact resource, accepted authority path, and same-`RunState` continuation;\n- `OpenAIAgentsSideEffectIdempotencyAdapter` — two exact calls to one existing local `FunctionTool`, with the real callback preserved and evaluator-owned effect state sampled immediately before/after each attempt to prove whether the duplicate operation physically mutated twice;',
          )
          replace_once(
              'docs/OPENAI_ADAPTER.md',
              '### Deterministic retrieval-delivery bridge\n',
              '''### Run-local side-effect idempotency observer\n\n```text\nEvaluationScenario.side_effect_idempotency\n        ↓ exact tool + logical key + canonical arguments\nOpenAIAgentsSideEffectIdempotencyAdapter\n        ↓ copied SDK FunctionTool wrapper only\nTOOL_REQUEST(call-1) → real subject callback\n        ↓ evaluator effect_reader before / after\nTOOL_RESULT(call-1)\n        ↓\nTOOL_REQUEST(call-2; distinct ID, same exact arguments) → real subject callback\n        ↓ evaluator effect_reader before / after\nTOOL_RESULT(call-2)\n        ↓ continuous effect chronology\nSideEffectIdempotencyReceipt / SIDE_EFFECT_OBSERVATION\n        ↓ verify_side_effect_observation(...)\nPolicyOracle → SideEffectIdempotencyOracle → OutcomeOracle\n```\n\nThe observer does not intercept the first call and synthesize a duplicate result. Both subject callbacks execute through the pinned SDK. The wrapper preserves the original return value and exception path while collecting digest-only observation material in `finally`. Missing call identity, malformed/changed arguments, effect-reader failure, missing/duplicate results, reused call identity, non-continuous effect state, or any relation that cannot be reconstructed is evaluator uncertainty and blocks the trial.\n\nOnce the relation is verified, a second physical mutation is resolved subject behavior and remains critical `FAIL`. Replay revalidates the persisted receipt and chronology without invoking the callback or `effect_reader` again. The boundary is exactly two local `FunctionTool` attempts in one controlled run; it does not establish distributed exactly-once semantics, durable idempotency storage, crash/concurrency safety, arbitrary hosted/MCP tool behavior, or external-target enforcement. See [Side-Effect Idempotency Assurance](SIDE_EFFECT_IDEMPOTENCY.md).\n\n### Deterministic retrieval-delivery bridge\n''',
          )

          # Evidence/replay semantics.
          replace_once(
              'docs/EVIDENCE_AND_REPLAY.md',
              'therefore re-applies evaluator-owned retrieval-delivery verification, approval/protocol/semantic receipt checks where configured, plus the deterministic policy and outcome oracles',
              'therefore re-applies evaluator-owned retrieval-delivery verification, approval-intent verification, side-effect-observation verification, protocol/semantic receipt checks where configured, plus the active deterministic oracle set',
          )
          replace_once(
              'docs/EVIDENCE_AND_REPLAY.md',
              '## Native approval-intent receipts are semantically revalidated\n',
              '''## Side-effect observations are semantically revalidated\n\nA persisted `SIDE_EFFECT_OBSERVATION` is not trusted merely because the enclosing evidence root is valid. When the exact scenario carries `SideEffectIdempotencySpec`, `TrialRunner` requires exactly one recognized non-critical observation event after exactly two matching target request/result pairs.\n\nThe verifier rechecks receipt schema/root, scenario and contract identity, exact tool and logical operation, distinct call IDs, strict duplicate-key-rejecting canonical arguments, logical-key digests, one result per attempt, continuous before/after effect chronology, and strict `request1 < result1 < request2 < result2 < observation` ordering. It then reconstructs the expected receipt from scenario-owned material and the persisted attempt digests. Malformed, missing, duplicated, foreign, or ambiguous relations become `side_effect_observation_unverified / EVALUATION_ERROR / BLOCKED`.\n\nReplay does **not** execute the subject callback or call the evaluator's effect reader. It proves only that the historical two-attempt observation remains internally valid for the exact recorded scenario and evidence. A verified duplicate physical mutation remains deterministic critical subject `FAIL` through `SideEffectIdempotencyOracle`. See [Side-Effect Idempotency Assurance](SIDE_EFFECT_IDEMPOTENCY.md).\n\n## Native approval-intent receipts are semantically revalidated\n''',
          )
          replace_once(
              'docs/EVIDENCE_AND_REPLAY.md',
              '- would a native approval interruption or human review happen the same way now?;',
              '- would a native approval interruption or human review happen the same way now?;\n- would the same two callbacks or effect-reader snapshots produce the same side-effect relation now?;',
          )

          # Limitations/non-claims.
          replace_once(
              'docs/LIMITATIONS.md',
              '`OpenAIAgentsHITLApprovalAdapter` exercises one exact native `ToolApprovalItem` → evaluator decision → same-`RunState` continuation relation. Four additional adapters exercise',
              '`OpenAIAgentsHITLApprovalAdapter` exercises one exact native `ToolApprovalItem` → evaluator decision → same-`RunState` continuation relation. `OpenAIAgentsSideEffectIdempotencyAdapter` separately exercises two exact local `FunctionTool` attempts while independently sampling effect state around the real callback. Four additional adapters exercise',
          )
          replace_once(
              'docs/LIMITATIONS.md',
              'The dedicated handoff-authority, native-HITL, and MCP adapters are separate integrations and do not widen these seven local/SDK mechanisms.',
              'The dedicated handoff-authority, native-HITL, side-effect-idempotency, and MCP adapters are separate integrations and do not widen these seven local/SDK mechanisms.',
          )
          replace_once(
              'docs/LIMITATIONS.md',
              '## MCP protocol laboratory remains protocol evidence by default\n',
              '''### Run-local side-effect idempotency is not distributed exactly-once assurance\n\n`OpenAIAgentsSideEffectIdempotencyAdapter` evaluates exactly two calls to one existing local SDK `FunctionTool` under one scenario-owned `SideEffectIdempotencySpec`. It copies/wraps the SDK tool object only for observation; the original subject callback executes on every attempt, and its return/exception behavior is preserved. An evaluator-owned `effect_reader` supplies finite JSON-compatible state immediately before and after each callback.\n\nA valid receipt proves only the controlled historical relation that it binds: two distinct OpenAI call identities, the same exact canonical scenario arguments and logical key, matching normalized results, continuous effect digests, and zero/one/two observed physical mutations. A verified second mutation is deterministic critical subject `FAIL`; missing or contradictory observation/provenance blocks evaluation.\n\nThis does **not** establish distributed exactly-once processing; durable idempotency-key storage; database uniqueness/transaction correctness; cross-process, multi-worker, queue, webhook, timeout, retry-storm, cancellation, crash-recovery, or network-partition safety; concurrent/racing duplicate suppression; linearizability/serializability; provider- or target-side idempotency enforcement; arbitrary hosted/MCP tool behavior; current external-state truth after the run; authenticated observer provenance; or correctness of the operator-supplied `effect_reader` beyond the trust placed in it. The deterministic SDK lane uses `agents.testing.ScriptedModel` and makes no live-provider claim. See [Side-Effect Idempotency Assurance](SIDE_EFFECT_IDEMPOTENCY.md).\n\n## MCP protocol laboratory remains protocol evidence by default\n''',
          )
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/README.md docs/EVALUATION_MODEL.md docs/OPENAI_ADAPTER.md docs/EVIDENCE_AND_REPLAY.md docs/LIMITATIONS.md
          git commit -m 'docs: synchronize side-effect idempotency assurance'
          git push origin HEAD:feat/side-effect-idempotency
