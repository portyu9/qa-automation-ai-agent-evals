name: Apply calibration commitment documentation sync

on:
  push:
    branches:
      - fix/semantic-calibration-case-commitments
    paths:
      - .github/workflows/apply-calibration-commitment-doc-sync.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/semantic-calibration-case-commitments
      - name: Synchronize calibration commitment claims
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("README.md"): [
                  (
                      "| **Calibration is identity-bound** | judge prompt/model/configuration drift invalidates calibration reuse; aggregate accuracy cannot substitute for false-PASS, abstention, judge-failure, and adversarial-coverage gates |",
                      "| **Calibration is commitment-bound** | judge prompt/model/configuration drift invalidates reuse; case labels and coverage tags participate in a privacy-preserving case commitment, while aggregate accuracy cannot substitute for false-PASS, abstention, judge-failure, and adversarial-coverage gates |",
                  ),
              ],
              Path("docs/SEMANTIC_JUDGING.md"): [
                  (
                      "The raw candidate text is not duplicated into the calibration receipt. Each observation binds the content-addressed case identity and either:\n\n- a rederived structured judge decision plus response digest; or\n- an explicit judge/malformed-response failure code.\n",
                      "Calibration case/observation/receipt schemas are explicitly versioned. In case v2, `SemanticCalibrationCase.identity` is the root of a privacy-preserving `SemanticCalibrationCaseCommitment` rather than a hash that requires the raw case body to be present. The commitment binds case ID/revision, objective SHA-256, rubric identity, candidate-output SHA-256, evaluator-owned expected PASS/FAIL label, and canonical coverage tags. Raw objective and candidate text are not duplicated into the durable observation or calibration receipt.\n\nEach observation v2 embeds that self-validating commitment and either:\n\n- a rederived structured judge decision plus response digest; or\n- an explicit judge/malformed-response failure code.\n\n`expected` and coverage `tags` are no longer independently serialized observation claims. Class support, false-PASS accounting, accuracy, and adversarial coverage are derived from the verified case commitment. Relabeling a case or injecting/removing a coverage tag therefore changes the case identity; retaining the old identity makes commitment validation fail.\n\nThe commitment is still an ordinary content hash. An actor able to author an entirely new unsigned case and recompute all roots can create a different valid identity; this mechanism provides internal binding and drift detection, not human-label authentication, trusted publisher identity, or signatures.\n",
                  ),
                  (
                      "- internally valid calibration metrics and receipt root.\n",
                      "- internally valid v2 case commitments, calibration metrics, and receipt root.\n\nCurrent authority validation accepts calibration receipt v2. Legacy v1 calibration receipts are not silently interpreted as the stronger relation: the typed nested calibration field causes both fresh semantic-authority validation and persisted `SemanticJudgmentReceipt` replay validation to fail closed on the old schema. The outer semantic-judgment schema does not change because its own relation and hashing semantics are unchanged; it already binds and validates the complete nested calibration receipt.\n",
                  ),
                  (
                      "A calibration case tagged `judge-prompt-injection` is not a magic security certification. It proves only that the exact calibrated judge configuration was evaluated against at least one explicitly labeled candidate containing evaluator-directed adversarial text.\n",
                      "A calibration case committed with the `judge-prompt-injection` tag is not a magic security certification. It proves only that the exact calibrated judge configuration was evaluated against at least one case whose evaluator-owned commitment includes that coverage label. An observation cannot manufacture this coverage by adding a standalone tag.\n",
                  ),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text()
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"expected exactly one match in {path}: {old!r}; found {count}")
                  text = text.replace(old, new)
              path.write_text(text)
          PY
      - name: Commit synchronized files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/SEMANTIC_JUDGING.md
          git diff --cached --check
          git commit -m "docs: bind calibration authority to case commitments"
          git push origin HEAD:fix/semantic-calibration-case-commitments
