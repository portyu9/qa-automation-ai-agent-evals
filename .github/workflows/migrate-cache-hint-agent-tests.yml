name: Temporary cache-hint agent test migration

on:
  push:
    branches:
      - fix/mcp-cache-hint-ttl-ownership
    paths:
      - .github/workflows/migrate-cache-hint-agent-tests.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/mcp-cache-hint-ttl-ownership
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Migrate only agent receipt ownership surfaces
        run: |
          python - <<'PY'
          from __future__ import annotations

          import ast
          from pathlib import Path

          RECEIPTS = {
              "MCPAgentToolStaleCacheReceipt",
              "MCPAgentToolSchemaDriftReceipt",
              "MCPAgentToolIdentityDriftReceipt",
          }

          test_files = sorted(Path("tests").rglob("*.py"))
          changed: list[Path] = []
          direct_keyword_changes = 0
          helper_dict_changes = 0

          def offsets(text: str) -> list[int]:
              starts = [0]
              for i, ch in enumerate(text):
                  if ch == "\n":
                      starts.append(i + 1)
              return starts

          for path in test_files:
              text = path.read_text()
              try:
                  tree = ast.parse(text)
              except SyntaxError:
                  continue
              starts = offsets(text)
              edits: list[tuple[int, int, str]] = []

              # Direct MCPAgent*Receipt.create(..., ttl_ms=...) calls.
              for node in ast.walk(tree):
                  if not isinstance(node, ast.Call):
                      continue
                  fn = node.func
                  if not (
                      isinstance(fn, ast.Attribute)
                      and fn.attr == "create"
                      and isinstance(fn.value, ast.Name)
                      and fn.value.id in RECEIPTS
                  ):
                      continue
                  for kw in node.keywords:
                      if kw.arg != "ttl_ms" or not hasattr(kw, "lineno"):
                          continue
                      start = starts[kw.lineno - 1] + kw.col_offset
                      if text[start : start + 6] != "ttl_ms":
                          raise AssertionError(f"unexpected keyword source at {path}:{kw.lineno}")
                      edits.append((start, start + 6, "mcp_cache_hint_ttl_ms"))
                      direct_keyword_changes += 1

              # Helper dictionaries expanded into MCPAgent*Receipt.create(**values/kwargs).
              for func in [n for n in ast.walk(tree) if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef))]:
                  expanded_names: set[str] = set()
                  for node in ast.walk(func):
                      if not isinstance(node, ast.Call):
                          continue
                      fn = node.func
                      if not (
                          isinstance(fn, ast.Attribute)
                          and fn.attr == "create"
                          and isinstance(fn.value, ast.Name)
                          and fn.value.id in RECEIPTS
                      ):
                          continue
                      for kw in node.keywords:
                          if kw.arg is None and isinstance(kw.value, ast.Name):
                              expanded_names.add(kw.value.id)
                  if not expanded_names:
                      continue
                  for node in ast.walk(func):
                      if not isinstance(node, ast.Assign) or len(node.targets) != 1:
                          continue
                      target = node.targets[0]
                      if not isinstance(target, ast.Name) or target.id not in expanded_names:
                          continue
                      if not isinstance(node.value, ast.Dict):
                          continue
                      for key in node.value.keys:
                          if not (isinstance(key, ast.Constant) and key.value == "ttl_ms"):
                              continue
                          start = starts[key.lineno - 1] + key.col_offset
                          segment = ast.get_source_segment(text, key)
                          if segment not in {'"ttl_ms"', "'ttl_ms'"}:
                              raise AssertionError(f"unexpected dict key source at {path}:{key.lineno}: {segment!r}")
                          edits.append((start + 1, start + 7, "mcp_cache_hint_ttl_ms"))
                          helper_dict_changes += 1

              if edits:
                  # Reject overlapping edits; then apply from the end of the file.
                  ordered = sorted(edits)
                  for (_, end_a, _), (start_b, _, _) in zip(ordered, ordered[1:]):
                      if end_a > start_b:
                          raise AssertionError(f"overlapping edits in {path}")
                  for start, end, replacement in reversed(ordered):
                      text = text[:start] + replacement + text[end:]
                  path.write_text(text)
                  changed.append(path)

          # Known serialized-field mutation fixture in the stale-cache boundary suite.
          boundary = Path("tests/unit/test_mcp_agent_stale_cache_bridge_boundaries.py")
          text = boundary.read_text()
          old = '("ttl_ms", 1, "payload digest does not match bound TTL"),'
          new = '("mcp_cache_hint_ttl_ms", 1, "payload digest does not match bound TTL"),'
          if old in text:
              text = text.replace(old, new, 1)
              boundary.write_text(text)
              if boundary not in changed:
                  changed.append(boundary)

          if direct_keyword_changes < 10:
              raise AssertionError(f"too few direct agent receipt keyword migrations: {direct_keyword_changes}")
          if helper_dict_changes < 2:
              raise AssertionError(f"too few helper-dict migrations: {helper_dict_changes}")

          # Guard the ownership boundary: protocol helpers and fault payloads must still use ttl_ms.
          source = "\n".join(p.read_text() for p in test_files)
          if "create_stale_cache_protocol_receipt(\n" not in source or "ttl_ms=" not in source:
              raise AssertionError("protocol helper TTL coverage unexpectedly disappeared")

          print(f"migrated direct agent keywords: {direct_keyword_changes}")
          print(f"migrated helper dictionary keys: {helper_dict_changes}")
          print("changed test files:")
          for path in changed:
              print(f"  {path}")
          PY
      - name: Add explicit ownership contract tests
        run: |
          cat > tests/unit/test_mcp_cache_hint_ttl_ownership.py <<'PY'
          from __future__ import annotations

          import inspect

          import pytest

          from agent_evals.mcp.agent_identity_bridge import (
              MCPAgentToolIdentityDriftReceipt,
              create_identity_drift_protocol_receipt,
          )
          from agent_evals.mcp.agent_schema_bridge import (
              MCPAgentToolSchemaDriftReceipt,
              create_schema_drift_protocol_receipt,
          )
          from agent_evals.mcp.agent_stale_cache_bridge import (
              MCPAgentToolStaleCacheReceipt,
              create_stale_cache_protocol_receipt,
          )


          @pytest.mark.parametrize(
              "receipt_type",
              [
                  MCPAgentToolStaleCacheReceipt,
                  MCPAgentToolSchemaDriftReceipt,
                  MCPAgentToolIdentityDriftReceipt,
              ],
          )
          def test_agent_receipt_schema_names_mcp_cache_hint_ownership(receipt_type: type[object]) -> None:
              fields = receipt_type.model_fields  # type: ignore[attr-defined]
              assert "mcp_cache_hint_ttl_ms" in fields
              assert "ttl_ms" not in fields

              parameters = inspect.signature(receipt_type.create).parameters  # type: ignore[attr-defined]
              assert "mcp_cache_hint_ttl_ms" in parameters
              assert "ttl_ms" not in parameters


          @pytest.mark.parametrize(
              "protocol_helper",
              [
                  create_stale_cache_protocol_receipt,
                  create_schema_drift_protocol_receipt,
                  create_identity_drift_protocol_receipt,
              ],
          )
          def test_protocol_helpers_retain_protocol_cache_hint_name(protocol_helper: object) -> None:
              parameters = inspect.signature(protocol_helper).parameters  # type: ignore[arg-type]
              assert "ttl_ms" in parameters
              assert "mcp_cache_hint_ttl_ms" not in parameters
          PY
      - name: Install and verify migrated contract
        run: |
          python -m pip install --disable-pip-version-check -e '.[dev]'
          ruff format tests/unit/test_mcp_agent_identity_bridge.py tests/unit/test_mcp_agent_identity_bridge_boundaries.py tests/unit/test_mcp_agent_schema_bridge.py tests/unit/test_mcp_agent_schema_bridge_boundaries.py tests/unit/test_mcp_protocol_delivery_schema_drift.py tests/unit/test_mcp_agent_stale_cache_bridge.py tests/unit/test_mcp_agent_stale_cache_bridge_boundaries.py tests/unit/test_mcp_cache_hint_ttl_ownership.py
          ruff check tests/unit/test_mcp_agent_identity_bridge.py tests/unit/test_mcp_agent_identity_bridge_boundaries.py tests/unit/test_mcp_agent_schema_bridge.py tests/unit/test_mcp_agent_schema_bridge_boundaries.py tests/unit/test_mcp_protocol_delivery_schema_drift.py tests/unit/test_mcp_agent_stale_cache_bridge.py tests/unit/test_mcp_agent_stale_cache_bridge_boundaries.py tests/unit/test_mcp_cache_hint_ttl_ownership.py
          pytest -q \
            tests/unit/test_mcp_agent_identity_bridge.py \
            tests/unit/test_mcp_agent_identity_bridge_boundaries.py \
            tests/unit/test_mcp_agent_schema_bridge.py \
            tests/unit/test_mcp_agent_schema_bridge_boundaries.py \
            tests/unit/test_mcp_protocol_delivery_schema_drift.py \
            tests/unit/test_mcp_agent_stale_cache_bridge.py \
            tests/unit/test_mcp_agent_stale_cache_bridge_boundaries.py \
            tests/unit/test_mcp_cache_hint_ttl_ownership.py
      - name: Commit migration and remove helper
        run: |
          rm .github/workflows/migrate-cache-hint-agent-tests.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests .github/workflows/migrate-cache-hint-agent-tests.yml
          git diff --cached --check
          git commit -m 'test: bind cache-hint TTL ownership explicitly'
          git push origin HEAD:fix/mcp-cache-hint-ttl-ownership
