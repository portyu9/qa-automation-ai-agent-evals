name: Generate compatibility lock candidates

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/scripts/generate_ci_lock.py'
      - '.github/workflows/compat-lock-candidates.yml'
      - 'pyproject.toml'
      - 'requirements-dev-ci-build.txt'

permissions:
  contents: read

jobs:
  generate:
    name: Candidate / ${{ matrix.profile }} / ${{ matrix.boundary }} / Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: core
            boundary: minimum
            python-version: "3.11"
            suffix: py311
          - profile: core
            boundary: latest
            python-version: "3.11"
            suffix: py311
          - profile: mcp
            boundary: minimum
            python-version: "3.11"
            suffix: py311
          - profile: mcp
            boundary: latest
            python-version: "3.11"
            suffix: py311
          - profile: openai-mcp
            boundary: minimum
            python-version: "3.11"
            suffix: py311
          - profile: openai-mcp
            boundary: latest
            python-version: "3.11"
            suffix: py311
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up candidate Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Bootstrap pinned maintenance resolver
        run: python -m pip install --disable-pip-version-check "pip==25.3" "pip-tools==7.5.2"
      - name: Generate candidate compatibility lock
        run: |
          python .github/scripts/generate_ci_lock.py \
            --profile "${{ matrix.profile }}" \
            --boundary "${{ matrix.boundary }}" \
            --output "candidate/${{ matrix.profile }}-${{ matrix.boundary }}-${{ matrix.suffix }}.txt"
      - name: Upload candidate only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compat-lock-${{ matrix.profile }}-${{ matrix.boundary }}-${{ matrix.suffix }}
          path: candidate/*.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
          overwrite: true
