name: Apply runtime snapshot docs

on:
  push:
    branches:
      - fix/scenario-contract-runtime-snapshot
    paths:
      - .github/workflows/apply-scenario-snapshot-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/scenario-contract-runtime-snapshot
      - name: Synchronize runtime snapshot documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label} match count: {count}")
              return text.replace(old, new, 1)

          path = Path('docs/EVALUATION_MODEL.md')
          text = path.read_text()
          marker = (
              '| **Release gate** | deterministic policy that decides whether evidence is sufficient for acceptance |\n\n'
              '## Outcome versus output'
          )
          replacement = '''| **Release gate** | deterministic policy that decides whether evidence is sufficient for acceptance |

## Runtime contract ownership

`EvaluationScenario` is content-addressed, but its JSON state/outcome containers remain ordinary Python containers for ergonomic construction. Pydantic `frozen=True` prevents field reassignment; it is not a claim of deep in-memory immutability.

The runtime establishes immutability at the ownership boundary instead of relying on caller object behavior:

1. `EvaluationSession` revalidates and snapshots the subject/scenario pair once before a repeated-trial loop;
2. `TrialRunner` revalidates its received pair before execution and retains an evaluator-owned scenario snapshot for identity, evidence verification, deterministic grading, and semantic input;
3. the adapter receives a second detached scenario snapshot rather than the evaluator-owned object;
4. after adapter completion—or an adapter exception—the evaluator recomputes the adapter-facing scenario identity; persistent drift produces `EVALUATION_ERROR / BLOCKED` with `scenario_contract_mutated` rather than grading against a changed contract.

Caller mutation after an awaited run/session has begun therefore cannot change the in-flight evaluator contract. Adapter-side mutation cannot alter the evaluator-owned grading basis. The drift check covers ordinary mutable-container changes; it is not tamper-proof memory, caller authentication, or protection against interpreter compromise or deliberate `object.__setattr__` abuse. Scenario and subject hashes remain integrity identities, not signatures.

## Outcome versus output'''
          text = once(text, marker, replacement, 'runtime ownership section')
          text = once(
              text,
              'separate in `AssuranceReport` v2.',
              'separate in `AssuranceReport` v3.',
              'assurance report version',
          )
          path.write_text(text)

          path = Path('docs/ARCHITECTURE.md')
          text = path.read_text()
          text = once(
              text,
              '├── subject/scenario contracts\n',
              '├── subject/scenario contracts\n'
              '│   ├── session-start revalidated snapshot for repeated trials\n'
              '│   ├── per-trial evaluator-owned grading snapshot\n'
              '│   ├── detached adapter-facing scenario copy\n'
              '│   └── persistent adapter-side contract drift -> EVALUATION_ERROR / BLOCKED\n',
              'trust-model snapshot ownership',
          )
          old = (
              '`SubjectFingerprint` binds provider, model, application revision, instructions, tool schema, policy, memory policy, and adapter identity/version. '
              '`EvaluationScenario` binds scenario ID/revision, objective, initial state, authority, required/forbidden outcomes, classification, tags, approval intent, optional side-effect-idempotency contract, optional `SemanticRubricSpec`, and optional `RetrievalContractSpec`. '
              'Behavior-bearing material therefore participates in scenario identity rather than living as untracked runtime configuration.'
          )
          new = old + (
              ' At execution time, those content identities are evaluated from detached, revalidated snapshots: the evaluator does not rely on Pydantic field freezing as deep container immutability, and a persistently mutated adapter-facing scenario is blocked before evidence normalization or grading.'
          )
          text = once(text, old, new, 'identity-domain runtime ownership')
          path.write_text(text)
          PY
      - name: Commit documentation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/EVALUATION_MODEL.md docs/ARCHITECTURE.md
          git diff --cached --check
          git commit -m "docs: define runtime contract snapshot ownership"
          git push origin HEAD:fix/scenario-contract-runtime-snapshot