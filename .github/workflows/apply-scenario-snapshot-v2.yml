name: Apply scenario snapshot v2

on:
  push:
    branches:
      - fix/scenario-contract-runtime-snapshot
    paths:
      - .github/workflows/apply-scenario-snapshot-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/scenario-contract-runtime-snapshot
      - name: Apply source changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label} match count: {count}")
              return text.replace(old, new, 1)

          def in_scope(text: str, start: str, end: str, old: str, new: str, label: str) -> str:
              i = text.index(start)
              j = text.index(end, i)
              scope = once(text[i:j], old, new, label)
              return text[:i] + scope + text[j:]

          identity = (
              '    @property\n'
              '    def identity(self) -> str:\n'
              '        return _sha256_json(self.model_dump(mode="python", exclude_none=True))\n'
          )

          path = Path('src/agent_evals/contracts/models.py')
          text = path.read_text()
          text = in_scope(
              text,
              'class SubjectFingerprint(BaseModel):',
              '\n\nclass HandoffAuthorityGrant(BaseModel):',
              identity,
              identity + (
                  '\n    def snapshot(self) -> SubjectFingerprint:\n'
                  '        """Return a detached, revalidated copy for one runtime boundary."""\n'
                  '        return SubjectFingerprint.model_validate_json(self.model_dump_json())\n'
              ),
              'subject snapshot',
          )
          text = in_scope(
              text,
              'class EvaluationScenario(BaseModel):',
              '\n\ndef _agent_path_requires_approval',
              identity,
              identity + (
                  '\n    def snapshot(self) -> EvaluationScenario:\n'
                  '        """Return a detached, revalidated copy for one runtime boundary."""\n'
                  '        return EvaluationScenario.model_validate_json(self.model_dump_json())\n'
              ),
              'scenario snapshot',
          )
          path.write_text(text)

          path = Path('src/agent_evals/runtime/evaluator.py')
          text = path.read_text()
          entry = (
              '    ) -> EvaluatedTrial:\n'
              '        started = perf_counter()\n'
              '        try:\n'
              '            result = await adapter.execute(\n'
              '                subject=subject,\n'
              '                scenario=scenario,\n'
              '                trial_id=trial_id,\n'
              '            )\n'
          )
          replacement = (
              '    ) -> EvaluatedTrial:\n'
              '        started = perf_counter()\n'
              '        subject = subject.snapshot()\n'
              '        scenario = scenario.snapshot()\n'
              '        execution_scenario = scenario.snapshot()\n'
              '        scenario_identity = scenario.identity\n'
              '        try:\n'
              '            result = await adapter.execute(\n'
              '                subject=subject,\n'
              '                scenario=execution_scenario,\n'
              '                trial_id=trial_id,\n'
              '            )\n'
          )
          text = once(text, entry, replacement, 'runner entry')

          mutation_check = (
              '            if self._scenario_contract_drifted(execution_scenario, scenario_identity):\n'
              '                return self._scenario_contract_mutated(\n'
              '                    adapter=adapter,\n'
              '                    subject=subject,\n'
              '                    scenario=scenario,\n'
              '                    trial_id=trial_id,\n'
              '                    elapsed_ms=(perf_counter() - started) * 1000.0,\n'
              '                )\n'
          )
          text = once(
              text,
              '        except AdapterPreconditionError as exc:\n',
              '        except AdapterPreconditionError as exc:\n' + mutation_check,
              'precondition drift check',
          )
          text = once(
              text,
              '        except Exception as exc:  # adapter boundary: provider failure becomes structured evidence\n',
              '        except Exception as exc:  # adapter boundary: provider failure becomes structured evidence\n' + mutation_check,
              'runtime drift check',
          )
          post_check = (
              '        if self._scenario_contract_drifted(execution_scenario, scenario_identity):\n'
              '            return self._scenario_contract_mutated(\n'
              '                adapter=adapter,\n'
              '                subject=subject,\n'
              '                scenario=scenario,\n'
              '                trial_id=trial_id,\n'
              '                elapsed_ms=(perf_counter() - started) * 1000.0,\n'
              '            )\n\n'
          )
          text = once(
              text,
              '        if not isinstance(result, AdapterResult):\n',
              post_check + '        if not isinstance(result, AdapterResult):\n',
              'post-adapter drift check',
          )
          marker = '    @staticmethod\n    def _semantic_verdict(decision: SemanticDecision) -> TrialVerdict:\n'
          helpers = (
              '    @staticmethod\n'
              '    def _scenario_contract_drifted(\n'
              '        scenario: EvaluationScenario,\n'
              '        expected_identity: str,\n'
              '    ) -> bool:\n'
              '        try:\n'
              '            return scenario.identity != expected_identity\n'
              '        except (TypeError, ValueError):\n'
              '            return True\n\n'
              '    @staticmethod\n'
              '    def _scenario_contract_mutated(\n'
              '        *,\n'
              '        adapter: AgentAdapter,\n'
              '        subject: SubjectFingerprint,\n'
              '        scenario: EvaluationScenario,\n'
              '        trial_id: str,\n'
              '        elapsed_ms: float,\n'
              '    ) -> EvaluatedTrial:\n'
              '        event = EvidenceEvent(\n'
              '            sequence=0,\n'
              '            kind=EvidenceKind.EVALUATION_ERROR,\n'
              '            source=f"evaluator:adapter:{adapter.name}",\n'
              '            payload={\n'
              '                "code": "scenario_contract_mutated",\n'
              '                "reason": (\n'
              '                    "adapter-facing scenario contract changed during execution; "\n'
              '                    "the evaluator retained the pre-execution contract"\n'
              '                ),\n'
              '            },\n'
              '            critical=True,\n'
              '        )\n'
              '        evidence = TrialEvidence(\n'
              '            trial_id=trial_id,\n'
              '            subject_identity=subject.identity,\n'
              '            scenario_identity=scenario.identity,\n'
              '            events=(event,),\n'
              '            elapsed_ms=elapsed_ms,\n'
              '        )\n'
              '        return EvaluatedTrial(\n'
              '            evidence=evidence,\n'
              '            oracle_results=(),\n'
              '            verdict=TrialVerdict.BLOCKED,\n'
              '        )\n\n'
          )
          text = once(text, marker, helpers + marker, 'drift helpers')
          path.write_text(text)

          path = Path('src/agent_evals/runtime/session.py')
          text = path.read_text()
          text = once(
              text,
              '        evaluated: list[EvaluatedTrial] = []\n',
              '        subject = subject.snapshot()\n'
              '        scenario = scenario.snapshot()\n'
              '        evaluated: list[EvaluatedTrial] = []\n',
              'session snapshot',
          )
          path.write_text(text)
          PY
      - name: Commit source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/agent_evals/contracts/models.py src/agent_evals/runtime/evaluator.py src/agent_evals/runtime/session.py
          git diff --cached --check
          git commit -m "fix: snapshot scenario contracts across runtime boundaries"
          git push origin HEAD:fix/scenario-contract-runtime-snapshot