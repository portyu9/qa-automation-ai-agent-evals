name: dependabot-auto-merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  merge:
    name: merge-green-dependabot-pr
    if: github.event_name != 'pull_request_target' || github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Verify checks and merge exact tested head
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const PASSING_CONCLUSIONS = new Set(['success', 'neutral', 'skipped']);
            const POLL_MS = 30_000;
            const SETTLE_MS = 60_000;
            const MAX_WAIT_MS = 35 * 60_000;
            const RETRYABLE_MERGE_STATUSES = new Set([405, 409, 422]);
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            const { owner, repo } = context.repo;

            function latestStatuses(statuses) {
              const latest = new Map();
              const sorted = [...statuses].sort((a, b) => {
                const aTime = Date.parse(a.updated_at || a.created_at || 0);
                const bTime = Date.parse(b.updated_at || b.created_at || 0);
                return bTime - aTime;
              });
              for (const status of sorted) {
                if (!latest.has(status.context)) latest.set(status.context, status);
              }
              return [...latest.values()];
            }

            async function candidateNumbers() {
              if (context.eventName === 'pull_request_target') {
                return [context.payload.pull_request.number];
              }
              const pulls = await github.paginate(github.rest.pulls.list, {
                owner,
                repo,
                state: 'open',
                per_page: 100,
              });
              return pulls
                .filter((pull) => pull.user?.login === 'dependabot[bot]')
                .map((pull) => pull.number);
            }

            async function inspect(number) {
              const { data: pull } = await github.rest.pulls.get({ owner, repo, pull_number: number });
              if (pull.state !== 'open' || pull.draft || pull.user?.login !== 'dependabot[bot]') {
                return { terminal: true, reason: 'not an open Dependabot PR' };
              }

              const sha = pull.head.sha;
              const [checkRuns, rawStatuses] = await Promise.all([
                github.paginate(github.rest.checks.listForRef, {
                  owner,
                  repo,
                  ref: sha,
                  filter: 'latest',
                  per_page: 100,
                }),
                github.paginate(github.rest.repos.listCommitStatusesForRef, {
                  owner,
                  repo,
                  ref: sha,
                  per_page: 100,
                }),
              ]);

              const statuses = latestStatuses(rawStatuses);
              const failedChecks = checkRuns.filter(
                (check) => check.status === 'completed' && !PASSING_CONCLUSIONS.has(check.conclusion),
              );
              const incompleteChecks = checkRuns.filter((check) => check.status !== 'completed');
              const failedStatuses = statuses.filter((status) => ['failure', 'error'].includes(status.state));
              const pendingStatuses = statuses.filter((status) => status.state === 'pending');
              const statusesGreen = statuses.every((status) => status.state === 'success');
              const checksGreen = checkRuns.length > 0 && incompleteChecks.length === 0 && failedChecks.length === 0;

              const signalTimes = [
                ...checkRuns.map((check) => Date.parse(check.completed_at || check.started_at || check.created_at || 0)),
                ...statuses.map((status) => Date.parse(status.updated_at || status.created_at || 0)),
              ].filter(Number.isFinite);
              const latestSignalAt = signalTimes.length > 0 ? Math.max(...signalTimes) : Date.now();
              const settled = Date.now() - latestSignalAt >= SETTLE_MS;

              if (failedChecks.length > 0 || failedStatuses.length > 0) {
                return {
                  terminal: true,
                  reason: `non-green checks/statuses: ${[
                    ...failedChecks.map((check) => `${check.name}=${check.conclusion}`),
                    ...failedStatuses.map((status) => `${status.context}=${status.state}`),
                  ].join(', ')}`,
                };
              }

              return {
                terminal: false,
                ready: checksGreen && statusesGreen && pendingStatuses.length === 0 && settled,
                sha,
                reason: checkRuns.length === 0
                  ? 'no check runs registered yet'
                  : incompleteChecks.length > 0 || pendingStatuses.length > 0
                    ? 'checks/statuses still pending'
                    : !settled
                      ? 'green checks are still settling'
                      : 'not all checks/statuses are green',
              };
            }

            async function refreshBehindBranch(number, expectedHeadSha) {
              const { data: fresh } = await github.rest.pulls.get({ owner, repo, pull_number: number });
              if (fresh.state !== 'open' || fresh.head.sha !== expectedHeadSha) {
                return { changed: true, reason: 'head changed while verifying' };
              }
              if (fresh.mergeable_state !== 'behind') {
                return { changed: false, pull: fresh };
              }

              core.notice(`PR #${number}: branch is behind ${fresh.base.ref}; requesting GitHub update-branch.`);
              try {
                await github.rest.pulls.updateBranch({
                  owner,
                  repo,
                  pull_number: number,
                  expected_head_sha: expectedHeadSha,
                });
              } catch (error) {
                if (RETRYABLE_MERGE_STATUSES.has(error.status)) {
                  core.notice(`PR #${number}: update-branch deferred by GitHub (${error.status}); next event/sweep will retry.`);
                  return { changed: true, reason: `update-branch deferred (${error.status})` };
                }
                throw error;
              }
              return { changed: true, reason: 'branch refresh requested' };
            }

            async function mergeWhenGreen(number, waitForCompletion) {
              const deadline = Date.now() + (waitForCompletion ? MAX_WAIT_MS : 0);
              while (true) {
                const state = await inspect(number);
                if (state.terminal) {
                  core.notice(`PR #${number}: ${state.reason}; not auto-merging.`);
                  return;
                }

                if (state.ready) {
                  const refresh = await refreshBehindBranch(number, state.sha);
                  if (refresh.changed) {
                    if (waitForCompletion && Date.now() < deadline && refresh.reason === 'head changed while verifying') {
                      await sleep(POLL_MS);
                      continue;
                    }
                    core.notice(`PR #${number}: ${refresh.reason}; waiting for the synchronize event or next sweep.`);
                    return;
                  }

                  const fresh = refresh.pull;
                  const { data: repository } = await github.rest.repos.get({ owner, repo });
                  const mergeMethod = repository.allow_rebase_merge
                    ? 'rebase'
                    : repository.allow_squash_merge
                      ? 'squash'
                      : 'merge';

                  try {
                    const { data: result } = await github.rest.pulls.merge({
                      owner,
                      repo,
                      pull_number: number,
                      sha: fresh.head.sha,
                      merge_method: mergeMethod,
                    });
                    if (!result.merged) {
                      core.notice(`PR #${number}: GitHub declined merge without merging (${result.message}); next event/sweep will retry.`);
                      return;
                    }
                    core.notice(`PR #${number}: merged ${fresh.head.sha} via ${mergeMethod}.`);
                    return;
                  } catch (error) {
                    if (RETRYABLE_MERGE_STATUSES.has(error.status)) {
                      core.notice(`PR #${number}: merge deferred by repository rules/race (${error.status}); next event/sweep will retry.`);
                      return;
                    }
                    throw error;
                  }
                }

                if (!waitForCompletion || Date.now() >= deadline) {
                  core.notice(`PR #${number}: ${state.reason}; leaving it open for the next event/sweep.`);
                  return;
                }
                await sleep(POLL_MS);
              }
            }

            for (const number of await candidateNumbers()) {
              await mergeWhenGreen(number, context.eventName === 'pull_request_target');
            }
