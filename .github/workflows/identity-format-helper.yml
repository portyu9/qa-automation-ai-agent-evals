name: Identity format helper

on:
  push:
    branches: [feat/mcp-tool-identity-drift]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/mcp-tool-identity-drift
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install pinned formatter
        run: python -m pip install --disable-pip-version-check 'ruff==0.16.5'
      - name: Format new Python files
        run: >-
          ruff format
          src/agent_evals/mcp/agent_identity_bridge.py
          src/agent_evals/adapters/openai_mcp_tool_identity_drift.py
          tests/unit/test_mcp_agent_identity_bridge.py
          tests/integration/test_openai_mcp_tool_identity_drift_adapter.py
          tests/fixtures/mcp_identity_drift_server.py
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/agent_evals/mcp/agent_identity_bridge.py \
            src/agent_evals/adapters/openai_mcp_tool_identity_drift.py \
            tests/unit/test_mcp_agent_identity_bridge.py \
            tests/integration/test_openai_mcp_tool_identity_drift_adapter.py \
            tests/fixtures/mcp_identity_drift_server.py
          git commit -m 'style: format MCP identity-drift assurance'
          git push origin HEAD:feat/mcp-tool-identity-drift
