name: Temporary schema-boundary verifier

on:
  push:
    branches:
      - test/mcp-schema-drift-boundaries
    paths:
      - .github/workflows/fix-schema-boundary-tests.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: test/mcp-schema-drift-boundaries
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
      - name: Correct defense-in-depth fault construction
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/unit/test_mcp_agent_schema_bridge_boundaries.py')
          text = path.read_text()
          text = text.replace(
              'from __future__ import annotations\n\nfrom typing import Any\n',
              'from __future__ import annotations\n\nimport json\nfrom typing import Any\n',
              1,
          )
          anchor = '''\ndef _protocol_receipt(*, fault: MCPFaultSpec | None = None) -> MCPFaultReceipt:\n'''
          helper = '''\ndef _invalid_fault(payload: dict[str, object]) -> MCPFaultSpec:\n    """Bypass MCPFaultSpec validators only to exercise bridge defense-in-depth checks."""\n    return MCPFaultSpec.model_construct(\n        schema_version="agent-evals/mcp-fault/v1",\n        fault_id="schema-drift-invalid-in-memory",\n        revision="1",\n        kind=MCPFaultKind.TOOL_SCHEMA_DRIFT,\n        tool_name=_TOOL,\n        payload_json=json.dumps(payload, sort_keys=True, separators=(",", ":")),\n    )\n\n\n'''
          if text.count(anchor) != 1:
              raise AssertionError('protocol receipt anchor changed')
          text = text.replace(anchor, helper + anchor, 1)

          old = '''@pytest.mark.parametrize(\n    ("fault", "ttl_ms", "message"),\n    [\n        (_fault(ttl_ms=59_999), _TTL_MS, "TTL"),\n        (_fault(initial_required={"query": "integer"}), _TTL_MS, "initial contract"),\n        (\n            _fault(replacement_required={"customer_id": "integer"}),\n            _TTL_MS,\n            "replacement contract",\n        ),\n    ],\n)\ndef test_protocol_receipt_rejects_invalid_fault_payload(\n    fault: MCPFaultSpec, ttl_ms: int, message: str\n) -> None:\n    with pytest.raises(ValueError, match=message):\n        create_schema_drift_protocol_receipt(\n            fault=fault,\n            ttl_ms=ttl_ms,\n'''
          new = '''@pytest.mark.parametrize(\n    ("fault", "ttl_ms", "message"),\n    [\n        (_fault(ttl_ms=59_999), _TTL_MS, "TTL"),\n        (\n            _invalid_fault(\n                {\n                    "ttl_ms": _TTL_MS,\n                    "initial_required": {"query": "integer"},\n                    "replacement_required": {\n                        "customer_id": "integer",\n                        "include_history": "boolean",\n                    },\n                }\n            ),\n            _TTL_MS,\n            "initial contract",\n        ),\n        (\n            _invalid_fault(\n                {\n                    "ttl_ms": _TTL_MS,\n                    "initial_required": {"query": "string"},\n                    "replacement_required": {"customer_id": "integer"},\n                }\n            ),\n            _TTL_MS,\n            "replacement contract",\n        ),\n    ],\n)\ndef test_protocol_receipt_rejects_invalid_fault_payload(\n    fault: MCPFaultSpec, ttl_ms: int, message: str\n) -> None:\n    with pytest.raises(ValueError, match=message):\n        create_schema_drift_protocol_receipt(\n            fault=fault,\n            ttl_ms=ttl_ms,\n'''
          if text.count(old) != 1:
              raise AssertionError('invalid-fault parameter block changed')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Verify boundary suite and coverage impact
        run: |
          python -m pip install --disable-pip-version-check -e '.[dev]'
          ruff format tests/unit/test_mcp_agent_schema_bridge_boundaries.py
          ruff check tests/unit/test_mcp_agent_schema_bridge_boundaries.py
          pytest -q tests/unit/test_mcp_agent_schema_bridge.py tests/unit/test_mcp_agent_schema_bridge_boundaries.py
          pytest --cov=agent_evals --cov-branch --cov-report=term-missing
          coverage report --fail-under=90
      - name: Commit corrected suite and remove helper
        run: |
          rm .github/workflows/fix-schema-boundary-tests.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/unit/test_mcp_agent_schema_bridge_boundaries.py .github/workflows/fix-schema-boundary-tests.yml
          git diff --cached --check
          git commit -m 'test: exercise schema fault defense in depth'
          git push origin HEAD:test/mcp-schema-drift-boundaries
