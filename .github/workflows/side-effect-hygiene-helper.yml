name: Side-effect hygiene helper

on:
  push:
    branches:
      - feat/side-effect-idempotency

permissions:
  contents: write

jobs:
  hygiene:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Apply pinned Ruff hygiene
        run: |
          python -m pip install --disable-pip-version-check ruff==0.16.5
          ruff check --fix src/agent_evals/side_effect src/agent_evals/adapters/openai_side_effect_idempotency.py tests/unit/test_side_effect_idempotency.py tests/integration/test_openai_side_effect_idempotency_adapter.py src/agent_evals/contracts/models.py src/agent_evals/evidence/models.py src/agent_evals/runtime/evaluator.py
          ruff format src/agent_evals/side_effect src/agent_evals/adapters/openai_side_effect_idempotency.py tests/unit/test_side_effect_idempotency.py tests/integration/test_openai_side_effect_idempotency_adapter.py src/agent_evals/contracts/models.py src/agent_evals/evidence/models.py src/agent_evals/runtime/evaluator.py
          rm .github/workflows/side-effect-hygiene-helper.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/agent_evals/side_effect src/agent_evals/adapters/openai_side_effect_idempotency.py tests/unit/test_side_effect_idempotency.py tests/integration/test_openai_side_effect_idempotency_adapter.py src/agent_evals/contracts/models.py src/agent_evals/evidence/models.py src/agent_evals/runtime/evaluator.py .github/workflows/side-effect-hygiene-helper.yml
          git commit -m 'chore: apply pinned side-effect hygiene'
          git push origin HEAD:feat/side-effect-idempotency
