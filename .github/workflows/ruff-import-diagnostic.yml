name: Ruff import diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check 'ruff==0.16.6'
      - name: Show Ruff import autofix diff
        run: ruff check --select I001 --fix --diff tests/unit/test_resource_scope_algebra.py
