name: docs-prose-polish

on:
  push:
    branches:
      - docs/evergreen-openai-mermaid

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Polish schema-history prose and revalidate documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          replacements = {
              'docs/ASSURANCE_BLOCKED_HISTORY.md': {
                  'For `PASS`, `FAIL`, and `INCONCLUSIVE` trials, The current Assurance schema rejects': 'For `PASS`, `FAIL`, and `INCONCLUSIVE` trials, the current Assurance schema rejects',
                  'The serialized Assurance Report intentionally stores evidence roots rather than duplicating every evidence event. current schema additionally stores': 'The serialized Assurance Report intentionally stores evidence roots rather than duplicating every evidence event. The current schema additionally stores',
                  'Loading a standalone current report can therefore': 'Loading a standalone current-schema report can therefore',
                  "silently changing predecessor schema semantics": "silently changing the predecessor schema's semantics",
                  '\npredecessor reports are rejected': '\nPredecessor reports are rejected',
              },
              'docs/ASSURANCE_REPORTS.md': {
                  'introduced in predecessor schema': 'introduced in the predecessor schema',
                  "silently changing predecessor schema semantics": "silently changing the predecessor schema's semantics",
                  'A predecessor schema report is not silently interpreted under current schema criticality semantics.': "A predecessor-schema report is not silently interpreted under the current schema's criticality semantics.",
                  '- earlier schema added exact Wilson `confidence_z` persistence;': '- an earlier schema added exact Wilson `confidence_z` persistence;',
                  '- predecessor schema added `ScenarioGradingProfile`, closing report-level semantic and side-effect grading-shape omission gaps;': '- the predecessor schema added `ScenarioGradingProfile`, closing report-level semantic and side-effect grading-shape omission gaps;',
                  '- current schema retains those guarantees and adds blocked explicit-policy fact preservation.': '- the current schema retains those guarantees and adds blocked explicit-policy fact preservation.',
                  'For every non-`BLOCKED` trial, current schema enforces:': 'For every non-`BLOCKED` trial, the current schema enforces:',
                  'derive current schema blocked policy snapshots;': "derive the current schema's blocked policy snapshots;",
                  'standalone current schema parsing revalidates': 'standalone current-schema parsing revalidates',
                  "Those are separate deployment and provenance concerns. current schema's guarantee": "Those are separate deployment and provenance concerns. The current schema's guarantee",
              },
              'docs/STATISTICAL_ASSURANCE.md': {
                  'Assurance Report current schema persists exact': 'The current Assurance Report schema persists exact',
                  'current schema also retains the predecessor schema scenario grading-profile binding': "The current schema also retains the predecessor schema's scenario grading-profile binding",
                  'legacy schema did not persist `confidence_z`; earlier schema added it; predecessor schema added `ScenarioGradingProfile`; current schema added': 'the legacy schema did not persist `confidence_z`; an earlier schema added it; the predecessor schema added `ScenarioGradingProfile`; the current schema added',
                  'read under current schema semantics.': "read under the current schema's semantics.",
              },
          }

          for filename, mapping in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              for old, new in mapping.items():
                  if old not in text:
                      raise SystemExit(f'{filename}: missing expected phrase: {old}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          files = [Path('README.md'), *sorted(Path('docs').glob('*.md'))]
          forbidden_word = re.compile(r'\bversion(?:ed|ing|s)?\b|--version\b', re.I)
          awkward = (
              ' current schema additionally',
              ' current schema also',
              'For every non-`BLOCKED` trial, current schema',
              "concerns. current schema's",
              'trials, The current',
              '\npredecessor reports',
              'Assurance Report current schema',
              'silently changing predecessor schema semantics',
          )
          mermaid_errors = []
          link_errors = []
          word_hits = []
          awkward_hits = []
          mermaid_count = 0

          for path in files:
              text = path.read_text(encoding='utf-8')
              for lineno, line in enumerate(text.splitlines(), 1):
                  if forbidden_word.search(line):
                      word_hits.append(f'{path}:{lineno}: {line}')
              for phrase in awkward:
                  if phrase in text:
                      awkward_hits.append(f'{path}: {phrase}')
              for index, block in enumerate(re.findall(r'```mermaid\n(.*?)\n```', text, flags=re.S), 1):
                  mermaid_count += 1
                  if 'accTitle:' not in block or 'accDescr:' not in block:
                      mermaid_errors.append(f'{path}: Mermaid {index} missing accessibility metadata')
                  if 'classDef ' not in block and 'box rgba' not in block:
                      mermaid_errors.append(f'{path}: Mermaid {index} missing explicit color semantics')
              for target in re.findall(r'\[[^\]]+\]\(([^)]+\.md)(?:#[^)]+)?\)', text):
                  if '://' in target:
                      continue
                  if not (path.parent / target).resolve().exists():
                      link_errors.append(f'{path}: broken link -> {target}')

          print(f'SUMMARY files={len(files)} word_hits={len(word_hits)} awkward_hits={len(awkward_hits)} mermaid={mermaid_count} mermaid_errors={len(mermaid_errors)} link_errors={len(link_errors)}')
          for item in word_hits + awkward_hits + mermaid_errors + link_errors:
              print(item)
          if word_hits or awkward_hits or mermaid_errors or link_errors:
              raise SystemExit('documentation prose acceptance failed')

          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'rm', '.github/workflows/docs-prose-polish.yml'], check=True)
          subprocess.run(['git', 'add', 'docs'], check=True)
          subprocess.run(['git', 'commit', '-m', 'docs: polish evergreen schema-history prose'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:docs/evergreen-openai-mermaid'], check=True)
          PY
