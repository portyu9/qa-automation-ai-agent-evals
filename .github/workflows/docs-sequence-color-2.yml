name: docs-sequence-color-2

on:
  push:
    branches:
      - docs/evergreen-openai-mermaid

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final diagram color semantics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          path = Path("docs/OPENAI_ADAPTER.md")
          text = path.read_text(encoding="utf-8")
          old = "    actor E as Evaluator\n    participant A as Side-effect adapter\n    participant T as Real subject tool callback\n    participant S as Effect-state reader\n"
          new = "    actor E as Evaluator\n    box rgba(9,105,218,0.08) Evaluator-owned control and observation\n      participant A as Side-effect adapter\n      participant S as Effect-state reader\n    end\n    box rgba(207,34,46,0.08) Evaluated subject boundary\n      participant T as Real subject tool callback\n    end\n"
          if old not in text:
              raise SystemExit("expected sequence participant block not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "rm", ".github/workflows/docs-sequence-color.yml", ".github/workflows/docs-sequence-color-2.yml"], check=True)
          subprocess.run(["git", "add", "docs/OPENAI_ADAPTER.md"], check=True)
          subprocess.run(["git", "commit", "-m", "docs: color side-effect sequence trust boundaries"], check=True)
          subprocess.run(["git", "push", "origin", "HEAD:docs/evergreen-openai-mermaid"], check=True)
          PY
