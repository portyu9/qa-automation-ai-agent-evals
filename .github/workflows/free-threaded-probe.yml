name: Free-threaded Python probe

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/free-threaded-probe.yml"
      - "pyproject.toml"
      - "requirements/locks/core-py314.txt"
      - "src/agent_evals/**"
      - "tests/unit/test_strict_json.py"
      - "tests/unit/test_oracles.py"
  schedule:
    - cron: "53 7 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: free-threaded-probe-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-314t:
    name: Experimental CPython 3.14t
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact probe subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up free-threaded Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14t"
          cache: pip
      - name: Record interpreter mode
        run: |
          python -VV
          python -c "import sysconfig; print('Py_GIL_DISABLED=', sysconfig.get_config_var('Py_GIL_DISABLED'))"
      - name: Install exact hash-checked core profile
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements/locks/core-py314.txt
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation .
          python -m pip check
      - name: Run deterministic kernel probe
        run: >-
          python -m pytest
          -o addopts="--strict-markers"
          -q
          tests/unit/test_strict_json.py
          tests/unit/test_oracles.py
