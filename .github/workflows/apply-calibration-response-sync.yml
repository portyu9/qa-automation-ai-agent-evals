name: Apply calibration response synchronization

on:
  push:
    branches:
      - fix/semantic-calibration-case-commitments
    paths:
      - .github/workflows/apply-calibration-response-sync.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/semantic-calibration-case-commitments
      - name: Synchronize response-derived calibration contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("src/agent_evals/semantic/calibration.py"): [
                  (
                      "            self.observed\n",
                      "            _ = self.observed\n",
                  ),
              ],
              Path("README.md"): [
                  (
                      "| **Calibration is commitment-bound** | judge prompt/model/configuration drift invalidates reuse; case labels and coverage tags participate in a privacy-preserving case commitment, while aggregate accuracy cannot substitute for false-PASS, abstention, judge-failure, and adversarial-coverage gates |",
                      "| **Calibration is commitment-bound** | judge prompt/model/configuration drift invalidates reuse; case labels and coverage tags participate in a privacy-preserving case commitment, resolved outcomes are rederived from persisted bounded judge responses, and aggregate accuracy cannot substitute for false-PASS, abstention, judge-failure, and adversarial-coverage gates |",
                  ),
              ],
              Path("docs/SEMANTIC_JUDGING.md"): [
                  (
                      "Calibration case/observation/receipt schemas are explicitly versioned. In case v2, `SemanticCalibrationCase.identity` is the root of a privacy-preserving `SemanticCalibrationCaseCommitment` rather than a hash that requires the raw case body to be present. The commitment binds case ID/revision, objective SHA-256, rubric identity, candidate-output SHA-256, evaluator-owned expected PASS/FAIL label, and canonical coverage tags. Raw objective and candidate text are not duplicated into the durable observation or calibration receipt.\n",
                      "Calibration case/observation/receipt schemas are explicitly versioned. In case v2, `SemanticCalibrationCase.identity` is the root of a privacy-preserving `SemanticCalibrationCaseCommitment` rather than a hash that requires the raw case body to be present. The commitment binds case ID/revision, objective SHA-256, the exact evaluator-owned rubric plus its identity, candidate-output SHA-256, evaluator-owned expected PASS/FAIL label, and canonical coverage tags. Raw objective and candidate text are not duplicated into the durable observation or calibration receipt.\n",
                  ),
                  (
                      "Each observation v2 embeds that self-validating commitment and either:\n\n- a rederived structured judge decision plus response digest; or\n- an explicit judge/malformed-response failure code.\n\n`expected` and coverage `tags` are no longer independently serialized observation claims. Class support, false-PASS accounting, accuracy, and adversarial coverage are derived from the verified case commitment. Relabeling a case or injecting/removing a coverage tag therefore changes the case identity; retaining the old identity makes commitment validation fail.\n",
                      "Each resolved observation v2 embeds that self-validating commitment **and the bounded `SemanticJudgeResponse` itself**. The response contains criterion IDs, bounded PASS/FAIL/ABSTAIN decisions, integer scores, and the overall decision; it contains no free-form reasoning or candidate text. On every construction and load, `derive_semantic_decision(...)` reruns against the committed rubric. `observed` and `response_sha256` are derived properties rather than independently serialized claims. A failed observation carries no response and requires an explicit judge/malformed-response failure code.\n\n`expected`, coverage `tags`, `observed`, and `response_sha256` are therefore not independent durable authority fields. Class support and adversarial coverage come from the verified case commitment; correctness, false-PASS accounting, abstention, and accuracy consume only the decision rederived from the persisted structured response. Relabeling a case, injecting/removing a coverage tag, changing the rubric, or making a response contradict criterion/order/threshold/overall semantics fails validation unless the corresponding case identity changes.\n",
                  ),
                  (
                      "- internally valid v2 case commitments, calibration metrics, and receipt root.\n",
                      "- internally valid v2 case commitments, persisted structured responses, rederived response decisions/digests, calibration metrics, and receipt root.\n",
                  ),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text()
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"expected exactly one match in {path}: {old!r}; found {count}")
                  text = text.replace(old, new)
              path.write_text(text)
          PY
      - name: Commit synchronized files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/agent_evals/semantic/calibration.py README.md docs/SEMANTIC_JUDGING.md
          git diff --cached --check
          git commit -m "docs: make calibration response derivation explicit"
          git push origin HEAD:fix/semantic-calibration-case-commitments
