name: Deep fuzz assurance

on:
  workflow_dispatch:
  schedule:
    - cron: "47 7 * * 3"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/deep-fuzz.yml"
      - ".github/scripts/validate_runtime_policy.py"
      - "pyproject.toml"
      - "requirements/locks/**"
      - ".github/scripts/validate_ci_locks.py"
      - "src/agent_evals/_strict_json.py"
      - "src/agent_evals/evidence/limits.py"
      - "src/agent_evals/evidence/models.py"
      - "src/agent_evals/evidence/store.py"
      - "src/agent_evals/evidence/legacy_v2.py"
      - "src/agent_evals/mcp/models.py"
      - "src/agent_evals/mcp/lab.py"
      - "src/agent_evals/mcp/oauth_flow.py"
      - "src/agent_evals/mcp/remote_auth.py"
      - "tests/fuzz/**"
      - "tests/unit/test_strict_json.py"
      - "tests/unit/test_evidence_store.py"

permissions:
  contents: read

concurrency:
  group: deep-fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deep-fuzz:
    name: Deep fuzz / trust boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      EXACT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      FUZZ_SEED: ${{ github.run_id }}
    steps:
      - name: Checkout exact subject commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXACT_COMMIT }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deep fuzz dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes \
            -r requirements/locks/mcp-py311.txt
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .

      - name: Dependency consistency
        run: python -m pip check

      - name: Bind fuzz evidence to exact commit and seed
        shell: bash
        run: |
          set -euo pipefail
          observed="$(git rev-parse HEAD)"
          test "$observed" = "$EXACT_COMMIT"
          printf '%s\n' "$observed" > deep-fuzz-commit.txt
          printf '%s\n' "$FUZZ_SEED" > deep-fuzz-seed.txt

      - name: Run deep fuzz campaigns
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest             -o addopts="--strict-markers"             -q             -m fuzz             tests/fuzz             --hypothesis-seed="$FUZZ_SEED"             --junitxml=deep-fuzz-junit.xml             2>&1 | tee deep-fuzz.log

      - name: Upload exact-commit fuzz evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: deep-fuzz-${{ env.EXACT_COMMIT }}
          path: |
            deep-fuzz-commit.txt
            deep-fuzz-seed.txt
            deep-fuzz.log
            deep-fuzz-junit.xml
            .hypothesis/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 21

  atheris-strict-json:
    name: Native Atheris / strict JSON / Python 3.14
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      EXACT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      FUZZ_SEED: ${{ github.run_id }}
      PYTHONPATH: src
    steps:
      - name: Checkout exact subject commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXACT_COMMIT }}
          persist-credentials: false

      - name: Set up Python 3.14 for pinned Atheris native wheel
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install verified Python 3.14 core and isolated Atheris
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements/locks/core-py314.txt
          python -m pip install --disable-pip-version-check --require-hashes -r requirements/locks/atheris-py314.txt
          python -m pip check

      - name: Bind native fuzz evidence and seed to exact subject
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_COMMIT"
          mkdir -p atheris-evidence/corpus atheris-evidence/crashes
          cp tests/fuzz/corpus/strict-json/*.json atheris-evidence/corpus/
          printf '%s\n' "$EXACT_COMMIT" > atheris-evidence/commit.txt
          printf '%s\n' "$FUZZ_SEED" > atheris-evidence/github-run-id.txt
          printf '%s\n' "$((FUZZ_SEED % 2147483647))" > atheris-evidence/seed.txt
          python -c 'from importlib.metadata import version; assert version("atheris") == "3.1.0"' 
          sha256sum requirements/locks/atheris-py314.txt > atheris-evidence/lock.sha256
          printf '%s\n' "linux-x86_64/cpython-3.14/atheris-3.1.0; 5000 bounded mutations" > atheris-evidence/scope.txt

      - name: Run native coverage-guided Atheris campaign
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 180s \
            python tests/fuzz/atheris_strict_json.py atheris-evidence/corpus \
              -atheris_runs=5000 -max_len=4096 -seed="$(cat atheris-evidence/seed.txt)" \
              -artifact_prefix=atheris-evidence/crashes/ \
            2>&1 | tee atheris-evidence/run.log

      - name: Retain exact-subject Atheris corpus and crash evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: atheris-strict-json-${{ env.EXACT_COMMIT }}
          path: atheris-evidence/
          if-no-files-found: error
          retention-days: 21
