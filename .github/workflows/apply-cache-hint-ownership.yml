name: Apply MCP cache-hint ownership patch
on:
  push:
    branches: [fix/mcp-cache-hint-ttl-ownership]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/mcp-cache-hint-ttl-ownership
          fetch-depth: 0
      - name: Patch bridge ownership semantics
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          bridges = {
              Path('src/agent_evals/mcp/agent_stale_cache_bridge.py'): (
                  'agent-evals/mcp-agent-tool-stale-cache-receipt/v1',
                  'agent-evals/mcp-agent-tool-stale-cache-receipt/v2',
                  'def create_stale_cache_protocol_receipt(',
              ),
              Path('src/agent_evals/mcp/agent_schema_bridge.py'): (
                  'agent-evals/mcp-agent-tool-schema-drift-receipt/v2',
                  'agent-evals/mcp-agent-tool-schema-drift-receipt/v3',
                  'def create_schema_drift_protocol_receipt(',
              ),
              Path('src/agent_evals/mcp/agent_identity_bridge.py'): (
                  'agent-evals/mcp-agent-tool-identity-drift-receipt/v2',
                  'agent-evals/mcp-agent-tool-identity-drift-receipt/v3',
                  'def create_identity_drift_protocol_receipt(',
              ),
          }

          for path, (old_schema, new_schema, marker) in bridges.items():
              text = path.read_text()
              if text.count(old_schema) != 4:
                  raise SystemExit(f'{path}: expected 4 old schema references, got {text.count(old_schema)}')
              if text.count(marker) != 1:
                  raise SystemExit(f'{path}: protocol helper marker mismatch')
              prefix, suffix = text.split(marker, 1)
              prefix, n = re.subn(r'(?<!["\'])\bttl_ms\b(?!["\'])', 'mcp_cache_hint_ttl_ms', prefix)
              if n < 8:
                  raise SystemExit(f'{path}: too few bridge TTL identifier migrations: {n}')
              # Helper function parameter names remain protocol-domain ttl_ms. Only the value
              # crossing from the agent bridge is renamed to make ownership explicit.
              helper_kw = 'mcp_cache_hint_ttl_ms=mcp_cache_hint_ttl_ms'
              helper_count = prefix.count(helper_kw)
              if helper_count < 3:
                  raise SystemExit(f'{path}: expected at least 3 protocol helper TTL calls, got {helper_count}')
              prefix = prefix.replace(helper_kw, 'ttl_ms=mcp_cache_hint_ttl_ms')
              old_unsigned = '"ttl_ms": mcp_cache_hint_ttl_ms,'
              if prefix.count(old_unsigned) != 1:
                  raise SystemExit(f'{path}: expected exactly one bridge unsigned TTL field')
              prefix = prefix.replace(
                  old_unsigned,
                  '"mcp_cache_hint_ttl_ms": mcp_cache_hint_ttl_ms,',
              )
              text = (prefix + marker + suffix).replace(old_schema, new_schema)
              path.write_text(text)

          adapters = {
              Path('src/agent_evals/adapters/openai_mcp_tool_stale_cache.py'): (
                  'stale-cache fault TTL is not a positive integer',
                  'stale-cache MCP cache-hint TTL is not a positive integer',
                  'MCPAgentToolStaleCacheReceipt.create(',
              ),
              Path('src/agent_evals/adapters/openai_mcp_tool_schema_drift.py'): (
                  'schema-drift fault TTL is not a positive integer',
                  'schema-drift MCP cache-hint TTL is not a positive integer',
                  'MCPAgentToolSchemaDriftReceipt.create(',
              ),
              Path('src/agent_evals/adapters/openai_mcp_tool_identity_drift.py'): (
                  'identity-drift fault TTL is not a positive integer',
                  'identity-drift MCP cache-hint TTL is not a positive integer',
                  'MCPAgentToolIdentityDriftReceipt.create(',
              ),
          }
          for path, (old_reason, new_reason, bridge_marker) in adapters.items():
              text = path.read_text()
              if text.count('def ttl_ms(self) -> int:') != 1:
                  raise SystemExit(f'{path}: expected one recorder ttl_ms property')
              if text.count(old_reason) != 1:
                  raise SystemExit(f'{path}: TTL diagnostic mismatch')
              text = text.replace('def ttl_ms(self) -> int:', 'def mcp_cache_hint_ttl_ms(self) -> int:')
              text = text.replace(old_reason, new_reason)
              text = text.replace('self.ttl_ms', 'self.mcp_cache_hint_ttl_ms')
              if text.count(bridge_marker) != 1:
                  raise SystemExit(f'{path}: bridge constructor marker mismatch')
              before, after = text.split(bridge_marker, 1)
              if after.count('ttl_ms=recorder.ttl_ms,') != 1:
                  raise SystemExit(f'{path}: bridge recorder TTL call mismatch')
              after = after.replace(
                  'ttl_ms=recorder.ttl_ms,',
                  'mcp_cache_hint_ttl_ms=recorder.mcp_cache_hint_ttl_ms,',
                  1,
              )
              text = before + bridge_marker + after
              path.write_text(text)

          for path in bridges:
              prefix = path.read_text().split(bridges[path][2], 1)[0]
              if re.search(r'^\s+ttl_ms:\s', prefix, re.M):
                  raise SystemExit(f'{path}: bare bridge ttl_ms field remains')
              if '"ttl_ms": mcp_cache_hint_ttl_ms,' in prefix:
                  raise SystemExit(f'{path}: bare bridge serialized ttl_ms remains')
          for path in adapters:
              text = path.read_text()
              if 'def ttl_ms(self) -> int:' in text or '.ttl_ms' in text:
                  raise SystemExit(f'{path}: ambiguous adapter ttl_ms property remains')
          PY
      - name: Install and verify source
        run: |
          python -m pip install --disable-pip-version-check -e '.[dev]'
          ruff format src/agent_evals/mcp/agent_stale_cache_bridge.py src/agent_evals/mcp/agent_schema_bridge.py src/agent_evals/mcp/agent_identity_bridge.py src/agent_evals/adapters/openai_mcp_tool_stale_cache.py src/agent_evals/adapters/openai_mcp_tool_schema_drift.py src/agent_evals/adapters/openai_mcp_tool_identity_drift.py
          ruff check src/agent_evals/mcp/agent_stale_cache_bridge.py src/agent_evals/mcp/agent_schema_bridge.py src/agent_evals/mcp/agent_identity_bridge.py src/agent_evals/adapters/openai_mcp_tool_stale_cache.py src/agent_evals/adapters/openai_mcp_tool_schema_drift.py src/agent_evals/adapters/openai_mcp_tool_identity_drift.py
          mypy src/agent_evals/mcp/agent_stale_cache_bridge.py src/agent_evals/mcp/agent_schema_bridge.py src/agent_evals/mcp/agent_identity_bridge.py
      - name: Commit patch and remove helper
        run: |
          rm .github/workflows/apply-cache-hint-ownership.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src .github/workflows/apply-cache-hint-ownership.yml
          git commit -m 'fix: separate MCP cache-hint TTL ownership'
          git push origin HEAD:fix/mcp-cache-hint-ttl-ownership
