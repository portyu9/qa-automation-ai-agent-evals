name: Inspect approval predecision patch

on:
  push:
    branches:
      - fix/approval-predecision-result
    paths:
      - .github/workflows/inspect-approval-predecision-patch.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/approval-predecision-result
      - name: Apply and inspect patch
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/apply.py
          python /tmp/apply.py
          sed -n '220,252p' src/agent_evals/evidence/approval_intent.py
