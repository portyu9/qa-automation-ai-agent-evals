name: Apply calibration Ruff format

on:
  push:
    branches:
      - fix/semantic-calibration-case-commitments
    paths:
      - .github/workflows/apply-calibration-ruff-format.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/semantic-calibration-case-commitments
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Apply pinned formatter
        run: |
          python -m pip install --disable-pip-version-check ruff==0.16.5
          ruff format src/agent_evals/semantic/calibration.py
          git diff --check
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/agent_evals/semantic/calibration.py
          git commit -m "style: format calibration response derivation"
          git push origin HEAD:fix/semantic-calibration-case-commitments
