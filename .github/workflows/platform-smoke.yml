name: Platform smoke

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/platform-smoke.yml"
      - ".github/scripts/validate_runtime_policy.py"
      - "pyproject.toml"
      - "requirements/locks/core-py314.txt"
      - "requirements/platform/windows-core-py314-supplement.txt"
      - "src/agent_evals/**"
      - "tests/unit/test_strict_json.py"
      - "tests/unit/test_oracles.py"
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-smoke-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core-platform:
    name: Core smoke / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS 26 / Python 3.14
            runner: macos-26
          - platform: Windows 2025 / Python 3.14
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Checkout exact platform subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install hash-pinned Windows supplement
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --require-hashes \
            -r requirements/platform/windows-core-py314-supplement.txt
      - name: Install exact hash-checked core profile
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --require-hashes -r requirements/locks/core-py314.txt
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation .
          python -m pip check
      - name: Run platform-neutral deterministic kernel smoke
        run: >-
          python -m pytest
          -o addopts="--strict-markers"
          -q
          tests/unit/test_strict_json.py
          tests/unit/test_oracles.py
