name: Format replay fix branch

on:
  push:
    branches: [fix/mcp-protocol-replay-evidence-binding]
    paths: [.github/workflows/format-replay-fix.yml]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/mcp-protocol-replay-evidence-binding
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check 'ruff==0.16.5'
      - name: Format changed Python files
        run: |
          ruff format \
            src/agent_evals/mcp/delivery.py \
            tests/unit/test_mcp_protocol_delivery.py \
            tests/unit/test_mcp_protocol_delivery_schema_drift.py \
            tests/unit/test_mcp_agent_identity_bridge.py
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/agent_evals/mcp/delivery.py \
            tests/unit/test_mcp_protocol_delivery.py \
            tests/unit/test_mcp_protocol_delivery_schema_drift.py \
            tests/unit/test_mcp_agent_identity_bridge.py
          git commit -m 'style: normalize replay evidence binding fix'
          git push
