name: Migrate MCP drift chronology tests
on:
  push:
    branches: [fix/mcp-post-mutation-stale-discovery]
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/mcp-post-mutation-stale-discovery
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e '.[dev,openai,mcp]'
      - name: Migrate seven-leg chronology
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          paths = [
              Path('tests/unit/test_mcp_agent_identity_bridge.py'),
              Path('tests/unit/test_mcp_agent_identity_bridge_boundaries.py'),
              Path('tests/unit/test_mcp_agent_schema_bridge.py'),
              Path('tests/unit/test_mcp_protocol_delivery_schema_drift.py'),
              Path('tests/integration/test_openai_mcp_tool_schema_drift_adapter.py'),
              Path('tests/integration/test_openai_mcp_tool_identity_drift_adapter.py'),
          ]
          counts = {'normal': 0, 'dict': 0, 'inverted': 0, 'assert': 0, 'residual': 0}

          def block(kind: str, mutation: str, inverted: bool = False) -> tuple[re.Pattern[str], str]:
              if kind == 'kw':
                  key = lambda n: n
                  sep = '='
              else:
                  key = lambda n: f'"{n}"'
                  sep = ': '
              inv, ref = ((5, 4) if inverted else (4, 5))
              pattern = re.compile(
                  rf'(?m)^(?P<i>[ \t]*){re.escape(key("initial_list_ordinal"))}{re.escape(sep)}0,\n'
                  rf'(?P=i){re.escape(key(mutation))}{re.escape(sep)}1,\n'
                  rf'(?P=i){re.escape(key("stale_call_ordinal"))}{re.escape(sep)}2,\n'
                  rf'(?P=i){re.escape(key("cache_invalidation_ordinal"))}{re.escape(sep)}{4 if inverted else 3},\n'
                  rf'(?P=i){re.escape(key("refreshed_list_ordinal"))}{re.escape(sep)}{3 if inverted else 4},\n'
                  rf'(?P=i){re.escape(key("recovery_call_ordinal"))}{re.escape(sep)}5,'
              )
              replacement = (
                  rf'\g<i>{key("initial_list_ordinal")}{sep}0,\n'
                  rf'\g<i>{key(mutation)}{sep}1,\n'
                  rf'\g<i>{key("cached_list_ordinal")}{sep}2,\n'
                  rf'\g<i>{key("stale_call_ordinal")}{sep}3,\n'
                  rf'\g<i>{key("cache_invalidation_ordinal")}{sep}{inv},\n'
                  rf'\g<i>{key("refreshed_list_ordinal")}{sep}{ref},\n'
                  rf'\g<i>{key("recovery_call_ordinal")}{sep}6,'
              )
              return pattern, replacement

          for path in paths:
              text = path.read_text()
              for mutation in ('schema_swap_ordinal', 'identity_swap_ordinal'):
                  for kind in ('kw', 'dict'):
                      pat, repl = block(kind, mutation)
                      text, n = pat.subn(repl, text)
                      counts['dict' if kind == 'dict' else 'normal'] += n
                  pat, repl = block('kw', mutation, inverted=True)
                  text, n = pat.subn(repl, text)
                  counts['inverted'] += n

              for mutation in ('schema_swap_ordinal', 'identity_swap_ordinal'):
                  pat = re.compile(
                      rf'(?m)^(?P<i>[ \t]*)delivery\.payload\["initial_list_ordinal"\],\n'
                      rf'(?P=i)delivery\.payload\["{mutation}"\],\n'
                      rf'(?P=i)delivery\.payload\["stale_call_ordinal"\],\n'
                      rf'(?P=i)delivery\.payload\["cache_invalidation_ordinal"\],\n'
                      rf'(?P=i)delivery\.payload\["refreshed_list_ordinal"\],\n'
                      rf'(?P=i)delivery\.payload\["recovery_call_ordinal"\],\n'
                      rf'(?P<c>[ \t]*)\] == \[0, 1, 2, 3, 4, 5\]'
                  )
                  repl = (
                      rf'\g<i>delivery.payload["initial_list_ordinal"],\n'
                      rf'\g<i>delivery.payload["{mutation}"],\n'
                      rf'\g<i>delivery.payload["cached_list_ordinal"],\n'
                      rf'\g<i>delivery.payload["stale_call_ordinal"],\n'
                      rf'\g<i>delivery.payload["cache_invalidation_ordinal"],\n'
                      rf'\g<i>delivery.payload["refreshed_list_ordinal"],\n'
                      rf'\g<i>delivery.payload["recovery_call_ordinal"],\n'
                      rf'\g<c>] == [0, 1, 2, 3, 4, 5, 6]'
                  )
                  text, n = pat.subn(repl, text)
                  counts['assert'] += n

              # Add the required field to remaining standalone negative constructors only.
              lines = text.splitlines(keepends=True)
              out = []
              for idx, line in enumerate(lines):
                  out.append(line)
                  stripped = line.rstrip('\n')
                  kw = re.match(r'^(?P<i>[ \t]*)(schema_swap_ordinal|identity_swap_ordinal)=[^,]+,\s*$', stripped)
                  dk = re.match(r'^(?P<i>[ \t]*)"(schema_swap_ordinal|identity_swap_ordinal)": [^,]+,\s*$', stripped)
                  nxt = lines[idx + 1] if idx + 1 < len(lines) else ''
                  if kw and 'cached_list_ordinal' not in nxt:
                      out.append(f"{kw.group('i')}cached_list_ordinal=2,\n")
                      counts['residual'] += 1
                  elif dk and '"cached_list_ordinal"' not in nxt:
                      out.append(f"{dk.group('i')}\"cached_list_ordinal\": 2,\n")
                      counts['residual'] += 1
              text = ''.join(out)
              text = text.replace('agent-evals/mcp-agent-tool-schema-drift-receipt/v1', 'agent-evals/mcp-agent-tool-schema-drift-receipt/v2')
              text = text.replace('agent-evals/mcp-agent-tool-identity-drift-receipt/v1', 'agent-evals/mcp-agent-tool-identity-drift-receipt/v2')
              path.write_text(text)

          assert counts['normal'] >= 10, counts
          assert counts['dict'] >= 2, counts
          assert counts['inverted'] == 2, counts
          assert counts['assert'] == 2, counts

          additions = {
              Path('tests/unit/test_mcp_agent_identity_bridge_boundaries.py'): '''\n\n@pytest.mark.parametrize("cached_list_ordinal", [0, 1])\ndef test_protocol_receipt_rejects_cached_discovery_not_after_identity_swap(cached_list_ordinal: int) -> None:\n    with pytest.raises(ValueError, match="chronology"):\n        create_identity_drift_protocol_receipt(\n            fault=_fault(), ttl_ms=60_000, original_tool_name=_OLD, replacement_tool_name=_NEW,\n            stale_protocol_text=_STALE_TEXT, protocol_recovery_text=_RECOVERY_TEXT,\n            initial_list_ordinal=0, identity_swap_ordinal=1, cached_list_ordinal=cached_list_ordinal,\n            stale_call_ordinal=3, cache_invalidation_ordinal=4, refreshed_list_ordinal=5, recovery_call_ordinal=6,\n        )\n''',
              Path('tests/unit/test_mcp_agent_schema_bridge.py'): '''\n\n@pytest.mark.parametrize("cached_list_ordinal", [0, 1])\ndef test_schema_drift_protocol_receipt_rejects_cached_discovery_not_after_schema_swap(cached_list_ordinal: int) -> None:\n    with pytest.raises(ValueError, match="chronology"):\n        create_schema_drift_protocol_receipt(\n            fault=fault(), ttl_ms=_TTL_MS, initial_schema=initial_schema(), cached_schema=initial_schema(),\n            refreshed_schema=replacement_schema(), stale_protocol_text=_STALE_TEXT, protocol_recovery_text=_RECOVERY_TEXT,\n            initial_list_ordinal=0, schema_swap_ordinal=1, cached_list_ordinal=cached_list_ordinal,\n            stale_call_ordinal=3, cache_invalidation_ordinal=4, refreshed_list_ordinal=5, recovery_call_ordinal=6,\n        )\n''',
          }
          for path, addition in additions.items():
              text = path.read_text()
              marker = addition.split('def ', 1)[1].split('(', 1)[0]
              if marker not in text:
                  path.write_text(text + addition)

          for path in paths:
              lines = path.read_text().splitlines()
              for idx, line in enumerate(lines):
                  standalone = re.match(r'^[ \t]*(?:"?(?:schema_swap_ordinal|identity_swap_ordinal)"?)(?:=|: )[^,]+,\s*$', line)
                  if standalone and (idx + 1 >= len(lines) or 'cached_list_ordinal' not in lines[idx + 1]):
                      raise SystemExit(f'missing cached-list ordinal after mutation field in {path}:{idx + 1}')
          PY
          ruff format tests/unit/test_mcp_agent_identity_bridge.py tests/unit/test_mcp_agent_identity_bridge_boundaries.py tests/unit/test_mcp_agent_schema_bridge.py tests/unit/test_mcp_protocol_delivery_schema_drift.py tests/integration/test_openai_mcp_tool_schema_drift_adapter.py tests/integration/test_openai_mcp_tool_identity_drift_adapter.py
      - name: Verify migrated contracts
        env:
          OPENAI_AGENTS_DISABLE_TRACING: '1'
          OPENAI_AGENTS_TRACE_INCLUDE_SENSITIVE_DATA: '0'
        run: |
          ruff check tests/unit/test_mcp_agent_identity_bridge.py tests/unit/test_mcp_agent_identity_bridge_boundaries.py tests/unit/test_mcp_agent_schema_bridge.py tests/unit/test_mcp_protocol_delivery_schema_drift.py tests/integration/test_openai_mcp_tool_schema_drift_adapter.py tests/integration/test_openai_mcp_tool_identity_drift_adapter.py
          pytest tests/unit/test_mcp_agent_identity_bridge.py tests/unit/test_mcp_agent_identity_bridge_boundaries.py tests/unit/test_mcp_agent_schema_bridge.py tests/unit/test_mcp_protocol_delivery_schema_drift.py
          pytest -m openai tests/integration/test_openai_mcp_tool_schema_drift_adapter.py tests/integration/test_openai_mcp_tool_identity_drift_adapter.py
      - name: Commit migration and remove helper
        run: |
          rm .github/workflows/migrate-v2-chronology.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests .github/workflows/migrate-v2-chronology.yml
          git commit -m 'test: enforce post-mutation cached discovery chronology'
          git push origin HEAD:fix/mcp-post-mutation-stale-discovery
