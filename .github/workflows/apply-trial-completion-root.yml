name: Apply trial completion root binding

on:
  push:
    branches:
      - fix/trial-completion-root-binding
    paths:
      - .github/workflows/apply-trial-completion-root.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/trial-completion-root-binding
      - name: Apply semantic test and documentation changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label} match count: {count}")
              return text.replace(old, new, 1)

          path = Path('tests/unit/test_semantic_runtime.py')
          text = path.read_text()
          old = '''    assert result.semantic_judgment is not None
              assert result.semantic_judgment.decision is decision
              assert result.evidence.events[-1].kind is EvidenceKind.SEMANTIC_JUDGMENT
          '''.replace('              ', '')
          new = '''    assert result.semantic_judgment is not None
              assert result.semantic_judgment.decision is decision
              assert result.completion_evidence_root == result.evidence.evidence_root
              assert result.semantic_judgment.subject_evidence_root != result.completion_evidence_root
              assert result.evidence.events[-1].kind is EvidenceKind.SEMANTIC_JUDGMENT
          '''.replace('              ', '')
          text = once(text, old, new, 'semantic final completion root assertions')
          path.write_text(text)

          path = Path('docs/ASSURANCE_REPORTS.md')
          text = path.read_text()
          old = '''`AssuranceReport.from_session()` verifies the in-memory session before creating an artifact:

          - at least one evaluated trial must exist;
          - every trial evidence envelope must match the session subject identity;
          '''.replace('          ', '')
          new = '''`AssuranceReport.from_session()` verifies the in-memory session before creating an artifact:

          - at least one evaluated trial must exist;
          - every trial's current final evidence root must match the runtime-only completion root captured when its verdict/oracle/semantic tuple was finalized;
          - every trial evidence envelope must match the session subject identity;
          '''.replace('          ', '')
          text = once(text, old, new, 'assurance generation finalization bullet')

          old = '''Only then is the release gate evaluated and the report root produced.
          '''.replace('          ', '')
          new = '''Only then is the release gate evaluated and the report root produced.

          `EvaluatedTrial.completion_evidence_root` is a runtime-only finalization commitment, not an Assurance Report v3 field. It prevents report construction from pairing a post-finalization-mutated evidence root with stale grading facts. For semantic trials it captures the final envelope root after the terminal semantic event, while the nested semantic receipt continues to bind the distinct pre-semantic root. This does not make returned Python evidence tamper-proof; it makes later mutation detectable at the report boundary.
          '''.replace('          ', '')
          text = once(text, old, new, 'assurance finalization explanation')
          path.write_text(text)
          PY
      - name: Commit permanent changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/test_semantic_runtime.py docs/ASSURANCE_REPORTS.md
          git diff --cached --check
          git commit -m "test: bind semantic completion root and document finalization"
          git push origin HEAD:fix/trial-completion-root-binding
