name: dependency-governance

on:
  pull_request:
    paths:
      - '.github/dependabot.yml'
      - '.github/dependency-governance.json'
      - '.github/dependency-recovery.json'
      - '.github/security-scanners.json'
      - '.github/scripts/dependency_governance.py'
      - '.github/scripts/dependency_governance_selfcheck.py'
      - '.github/scripts/dependency_lock_publisher.py'
      - '.github/scripts/dependency_lock_publisher_selfcheck.py'
      - '.github/scripts/dependency_lock_provenance.py'
      - '.github/workflows/dependency-lock-publisher.yml'
      - '.github/workflows/dependency-locks.yml'
      - '.github/scripts/dependency_recovery.py'
      - '.github/scripts/dependency_recovery_selfcheck.py'
      - '.github/scripts/validate_codeql_sarif.py'
      - '.github/scripts/validate_codeql_sarif_selfcheck.py'
      - '.github/scripts/validate_security_stack.py'
      - '.github/scripts/validate_workflow_graph.py'
      - '.github/scripts/verify_required_codeql.py'
      - '.github/scripts/release_candidate.py'
      - '.github/scripts/release_statement.py'
      - '.github/scripts/release_version.py'
      - '.github/scripts/validate_runtime_policy.py'
      - '.github/workflows/dependency-governance.yml'
      - '.github/workflows/prepare-release.yml'
      - '.github/workflows/publish-release.yml'
      - '.github/workflows/publish-pypi.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/codeql.yml'
      - '.github/workflows/security-scorecard.yml'
      - '.github/workflows/security.yml'
      - '.github/scripts/generate_ci_lock.py'
      - '.github/scripts/compact_compatibility_lock.py'
      - '.github/scripts/validate_ci_locks.py'
      - '.github/scripts/validate_dependency_compatibility.py'
      - '.github/semantic-adr-policy.json'
      - '.github/scripts/audit_live_repo_controls.py'
      - '.github/scripts/validate_semantic_adr.py'
      - '.github/scripts/verify_codeql_pr_publication.py'
      - '.github/scripts/verify_native_pr_codeql.py'
      - '.github/workflows/codeql-pr-publisher.yml'
      - 'CI_DEPENDENCY_LOCKS.md'
      - 'requirements-dev-ci-build.txt'
      - 'requirements/locks/**'
      - 'requirements/compatibility/**'
      - 'pyproject.toml'
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-governance-${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || 'reconcile' }}
  cancel-in-progress: false

env:
  GOVERNANCE_CONFIG: .github/dependency-governance.json
  RECOVERY_CONFIG: .github/dependency-recovery.json

jobs:
  self-test:
    name: governance-self-test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout proposed governance code without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Compile governance control plane
        run: >-
          python -m compileall -q
          .github/scripts/dependency_governance.py
          .github/scripts/dependency_governance_selfcheck.py
          .github/scripts/dependency_lock_publisher.py
          .github/scripts/dependency_lock_publisher_selfcheck.py
          .github/scripts/dependency_lock_provenance.py
          .github/scripts/dependency_recovery.py
          .github/scripts/dependency_recovery_selfcheck.py
          .github/scripts/validate_codeql_sarif.py
          .github/scripts/validate_codeql_sarif_selfcheck.py
          .github/scripts/validate_security_stack.py
          .github/scripts/validate_workflow_graph.py
          .github/scripts/verify_required_codeql.py
          .github/scripts/audit_live_repo_controls.py
          .github/scripts/validate_semantic_adr.py
          .github/scripts/verify_codeql_pr_publication.py
          .github/scripts/verify_native_pr_codeql.py
      - name: Validate governance and recovery configuration
        run: |
          python .github/scripts/dependency_governance.py --validate-config
          python .github/scripts/dependency_recovery.py --validate-config
      - name: Exercise fail-closed policy self-checks
        run: |
          python .github/scripts/dependency_governance_selfcheck.py
          python .github/scripts/dependency_lock_publisher_selfcheck.py
          python .github/scripts/dependency_recovery_selfcheck.py
          python .github/scripts/validate_codeql_sarif_selfcheck.py
          python .github/scripts/validate_security_stack.py
          python .github/scripts/verify_required_codeql.py --self-test
          python .github/scripts/verify_codeql_pr_publication.py --self-test
          python .github/scripts/verify_native_pr_codeql.py --self-test

  govern:
    name: govern-dependabot
    if: github.event_name != 'pull_request' && (github.event_name != 'push' || (github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      actions: write
      checks: read
      contents: write
      issues: write
      pull-requests: write
      statuses: read
    steps:
      - name: Authorize only exact-current-main native push wake
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/dependency-governance.yml@refs/heads/main"
          live_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          test "$live_main" = "$GITHUB_SHA"
      - name: Checkout trusted default-branch governance code only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Validate trusted governance and recovery policy
        run: |
          python .github/scripts/dependency_governance.py --validate-config --self-test
          python .github/scripts/dependency_recovery.py --validate-config --self-test
      - name: Attempt one bounded transient recovery
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/dependency_recovery.py --recover
      - name: Reconcile Dependabot merge authority
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPENDABOT_OWNER_TOKEN: ${{ secrets.DEPENDABOT_OWNER_TOKEN }}
        run: |
          args=(--reconcile)
          case "$GITHUB_EVENT_NAME" in
            schedule|workflow_dispatch|push) args+=(--allow-merge) ;;
          esac
          python .github/scripts/dependency_governance.py "${args[@]}"
