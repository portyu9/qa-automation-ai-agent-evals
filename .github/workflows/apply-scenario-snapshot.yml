name: Apply scenario contract snapshot hardening

on:
  push:
    branches:
      - fix/scenario-contract-runtime-snapshot
    paths:
      - .github/workflows/apply-scenario-snapshot.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/scenario-contract-runtime-snapshot
      - name: Apply runtime snapshot hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label} match count: {count}")
              return text.replace(old, new)

          def replace_in_scope(
              text: str,
              start_marker: str,
              end_marker: str,
              old: str,
              new: str,
              label: str,
          ) -> str:
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              scope = replace_once(text[start:end], old, new, label)
              return text[:start] + scope + text[end:]

          identity = (
              '    @property\n'
              '    def identity(self) -> str:\n'
              '        return _sha256_json(self.model_dump(mode="python", exclude_none=True))\n'
          )

          path = Path("src/agent_evals/contracts/models.py")
          text = path.read_text()
          text = replace_in_scope(
              text,
              "class SubjectFingerprint(BaseModel):",
              "\n\nclass HandoffAuthorityGrant(BaseModel):",
              identity,
              identity
              + (
                  '\n    def snapshot(self) -> SubjectFingerprint:\n'
                  '        """Return a detached, revalidated copy for one runtime boundary."""\n'
                  '        return SubjectFingerprint.model_validate_json(self.model_dump_json())\n'
              ),
              "SubjectFingerprint identity",
          )
          text = replace_in_scope(
              text,
              "class EvaluationScenario(BaseModel):",
              "\n\ndef _agent_path_requires_approval",
              identity,
              identity
              + (
                  '\n    def snapshot(self) -> EvaluationScenario:\n'
                  '        """Return a detached, revalidated copy for one runtime boundary."""\n'
                  '        return EvaluationScenario.model_validate_json(self.model_dump_json())\n'
              ),
              "EvaluationScenario identity",
          )
          path.write_text(text)

          path = Path("src/agent_evals/runtime/evaluator.py")
          text = path.read_text()
          text = replace_once(
              text,
              """    ) -> EvaluatedTrial:
                  started = perf_counter()
                  try:
                      result = await adapter.execute(
                          subject=subject,
                          scenario=scenario,
                          trial_id=trial_id,
                      )
          """.replace("                  ", ""),
              """    ) -> EvaluatedTrial:
                  started = perf_counter()
                  subject = subject.snapshot()
                  scenario = scenario.snapshot()
                  execution_scenario = scenario.snapshot()
                  scenario_identity = scenario.identity
                  try:
                      result = await adapter.execute(
                          subject=subject,
                          scenario=execution_scenario,
                          trial_id=trial_id,
                      )
          """.replace("                  ", ""),
              "TrialRunner entry",
          )
          text = replace_once(
              text,
              "        except AdapterPreconditionError as exc:\n            elapsed_ms =",
              """        except AdapterPreconditionError as exc:
                      if self._scenario_contract_drifted(execution_scenario, scenario_identity):
                          return self._scenario_contract_mutated(
                              adapter=adapter,
                              subject=subject,
                              scenario=scenario,
                              trial_id=trial_id,
                              elapsed_ms=(perf_counter() - started) * 1000.0,
                          )
                      elapsed_ms =""".replace("                      ", "        "),
              "adapter precondition mutation check",
          )
          text = replace_once(
              text,
              "        except Exception as exc:  # adapter boundary: provider failure becomes structured evidence\n            elapsed_ms =",
              """        except Exception as exc:  # adapter boundary: provider failure becomes structured evidence
                      if self._scenario_contract_drifted(execution_scenario, scenario_identity):
                          return self._scenario_contract_mutated(
                              adapter=adapter,
                              subject=subject,
                              scenario=scenario,
                              trial_id=trial_id,
                              elapsed_ms=(perf_counter() - started) * 1000.0,
                          )
                      elapsed_ms =""".replace("                      ", "        "),
              "runtime exception mutation check",
          )
          text = replace_once(
              text,
              "        if not isinstance(result, AdapterResult):\n",
              """        if self._scenario_contract_drifted(execution_scenario, scenario_identity):
                  return self._scenario_contract_mutated(
                      adapter=adapter,
                      subject=subject,
                      scenario=scenario,
                      trial_id=trial_id,
                      elapsed_ms=(perf_counter() - started) * 1000.0,
                  )

              if not isinstance(result, AdapterResult):
          """.replace("              ", ""),
              "post-adapter mutation check",
          )
          marker = "    @staticmethod\n    def _semantic_verdict(decision: SemanticDecision) -> TrialVerdict:\n"
          helper = """    @staticmethod
              def _scenario_contract_drifted(
                  scenario: EvaluationScenario,
                  expected_identity: str,
              ) -> bool:
                  try:
                      return scenario.identity != expected_identity
                  except (TypeError, ValueError):
                      return True

              @staticmethod
              def _scenario_contract_mutated(
                  *,
                  adapter: AgentAdapter,
                  subject: SubjectFingerprint,
                  scenario: EvaluationScenario,
                  trial_id: str,
                  elapsed_ms: float,
              ) -> EvaluatedTrial:
                  event = EvidenceEvent(
                      sequence=0,
                      kind=EvidenceKind.EVALUATION_ERROR,
                      source=f"evaluator:adapter:{adapter.name}",
                      payload={
                          "code": "scenario_contract_mutated",
                          "reason": (
                              "adapter-facing scenario contract changed during execution; "
                              "the evaluator retained the pre-execution contract"
                          ),
                      },
                      critical=True,
                  )
                  evidence = TrialEvidence(
                      trial_id=trial_id,
                      subject_identity=subject.identity,
                      scenario_identity=scenario.identity,
                      events=(event,),
                      elapsed_ms=elapsed_ms,
                  )
                  return EvaluatedTrial(
                      evidence=evidence,
                      oracle_results=(),
                      verdict=TrialVerdict.BLOCKED,
                  )

              @staticmethod
              def _semantic_verdict(decision: SemanticDecision) -> TrialVerdict:
          """.replace("              ", "")
          text = replace_once(text, marker, helper, "scenario drift helpers")
          path.write_text(text)

          path = Path("src/agent_evals/runtime/session.py")
          text = path.read_text()
          text = replace_once(
              text,
              """        if isinstance(k, bool) or not isinstance(k, int) or k < 1:
                  raise ValueError("k must be a positive integer")

              evaluated: list[EvaluatedTrial] = []
          """.replace("              ", ""),
              """        if isinstance(k, bool) or not isinstance(k, int) or k < 1:
                  raise ValueError("k must be a positive integer")

              subject = subject.snapshot()
              scenario = scenario.snapshot()
              evaluated: list[EvaluatedTrial] = []
          """.replace("              ", ""),
              "session boundary snapshot",
          )
          path.write_text(text)
          PY
      - name: Commit runtime hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/agent_evals/contracts/models.py src/agent_evals/runtime/evaluator.py src/agent_evals/runtime/session.py
          git diff --cached --check
          git commit -m "fix: snapshot scenario contracts across runtime boundaries"
          git push origin HEAD:fix/scenario-contract-runtime-snapshot