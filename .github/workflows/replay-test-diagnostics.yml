name: Replay diagnostic cleanup patch

on:
  push:
    branches: [fix/mcp-protocol-replay-evidence-binding]
    paths: [.github/workflows/replay-test-diagnostics.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/mcp-protocol-replay-evidence-binding
      - name: Restore stable stale-cache diagnostic and remove helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/agent_evals/mcp/delivery.py')
          text = path.read_text()
          old = 'phase="stale-cache rejection",'
          new = 'phase="stale-cache normalized rejection",'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one stale-cache diagnostic phase, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          rm -rf .audit
          git rm .github/workflows/replay-test-diagnostics.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/agent_evals/mcp/delivery.py
          git commit -m 'fix: preserve stale-cache replay diagnostic wording'
          git push
