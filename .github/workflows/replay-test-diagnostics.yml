name: Replay test diagnostics

on:
  push:
    branches: [fix/mcp-protocol-replay-evidence-binding]
    paths: [.github/workflows/replay-test-diagnostics.yml]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/mcp-protocol-replay-evidence-binding
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Capture provider-neutral failures
        shell: bash
        run: |
          set +e
          pytest -q --maxfail=20 > /tmp/replay-test-output.txt 2>&1
          status=$?
          cat /tmp/replay-test-output.txt
          mkdir -p .audit
          cp /tmp/replay-test-output.txt .audit/replay-test-output.txt
          printf '\nexit_code=%s\n' "$status" >> .audit/replay-test-output.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .audit/replay-test-output.txt
          git commit -m 'chore: capture replay test diagnostics'
          git push
          exit 0
