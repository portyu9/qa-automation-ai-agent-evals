name: Temporary autonomous dependency patch

on:
  push:
    branches:
      - automation/autonomous-dependency-promotion
    paths:
      - .github/workflows/_autonomous_dependency_patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.2
        with:
          ref: automation/autonomous-dependency-promotion
          fetch-depth: 1

      - name: Apply reviewed autonomous dependency patch
        run: python .github/scripts/_patch_autonomous_dependencies.py

      - name: Commit reviewed patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/dependency-governance.json .github/scripts/dependency_governance.py docs/DEPENDABOT_AUTOMATION.md
          git diff --cached --check
          git commit -m 'ci: automate exact-subject dependency promotion'
          git push origin HEAD:automation/autonomous-dependency-promotion
