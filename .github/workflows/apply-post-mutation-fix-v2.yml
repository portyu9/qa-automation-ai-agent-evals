name: Apply exact-site post-mutation stale-discovery fix

on:
  push:
    branches: [fix/mcp-post-mutation-stale-discovery]
    paths: [.github/workflows/apply-post-mutation-fix-v2.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/mcp-post-mutation-stale-discovery
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check 'ruff==0.16.5'
      - name: Apply exact-site source changes
        run: |
          python - <<'PY'
          from pathlib import Path

          def one(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one occurrence, found {count}: {old!r}')
              p.write_text(text.replace(old, new))

          def all_exact(path: str, old: str, new: str, expected: int) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrences, found {count}: {old!r}')
              p.write_text(text.replace(old, new))

          sb = 'src/agent_evals/mcp/agent_schema_bridge.py'
          ib = 'src/agent_evals/mcp/agent_identity_bridge.py'
          sa = 'src/agent_evals/adapters/openai_mcp_tool_schema_drift.py'
          ia = 'src/agent_evals/adapters/openai_mcp_tool_identity_drift.py'

          all_exact(sb, 'agent-evals/mcp-agent-tool-schema-drift-receipt/v1', 'agent-evals/mcp-agent-tool-schema-drift-receipt/v2', 4)
          one(sb, '    schema_swap_ordinal: StrictInt = Field(ge=0)\n    stale_call_ordinal:', '    schema_swap_ordinal: StrictInt = Field(ge=0)\n    cached_list_ordinal: StrictInt = Field(ge=0)\n    stale_call_ordinal:')
          one(sb, '        schema_swap_ordinal: int,\n        stale_call_ordinal: int,', '        schema_swap_ordinal: int,\n        cached_list_ordinal: int,\n        stale_call_ordinal: int,')
          one(sb, '    schema_swap_ordinal: int,\n    stale_call_ordinal: int,', '    schema_swap_ordinal: int,\n    cached_list_ordinal: int,\n    stale_call_ordinal: int,')
          one(sb, '            schema_swap_ordinal,\n            stale_call_ordinal,', '            schema_swap_ordinal,\n            cached_list_ordinal,\n            stale_call_ordinal,')
          one(sb, '        schema_swap_ordinal,\n        stale_call_ordinal,', '        schema_swap_ordinal,\n        cached_list_ordinal,\n        stale_call_ordinal,')
          one(sb, '            self.schema_swap_ordinal,\n            self.stale_call_ordinal,', '            self.schema_swap_ordinal,\n            self.cached_list_ordinal,\n            self.stale_call_ordinal,')
          one(sb, '            "schema_swap_ordinal": schema_swap_ordinal,\n            "stale_call_ordinal": stale_call_ordinal,', '            "schema_swap_ordinal": schema_swap_ordinal,\n            "cached_list_ordinal": cached_list_ordinal,\n            "stale_call_ordinal": stale_call_ordinal,')
          one(sb, '        "cached-old:call-rejects-old:host-refresh-new:call-succeeds-new"', '        "swap-then-cached-old:call-rejects-old:host-refresh-new:call-succeeds-new"')
          one(sb, '    ordinals: tuple[int, int, int, int, int, int],', '    ordinals: tuple[int, int, int, int, int, int, int],')
          one(sb, '            "cache_invalidation_ordinal": ordinals[3],\n            "cached_schema_sha256": cached_schema_sha256,', '            "cache_invalidation_ordinal": ordinals[4],\n            "cached_list_ordinal": ordinals[2],\n            "cached_schema_sha256": cached_schema_sha256,')
          one(sb, '            "recovery_call_ordinal": ordinals[5],\n            "refreshed_list_ordinal": ordinals[4],', '            "recovery_call_ordinal": ordinals[6],\n            "refreshed_list_ordinal": ordinals[5],')
          one(sb, '            "stale_call_ordinal": ordinals[2],', '            "stale_call_ordinal": ordinals[3],')
          one(sb, 'def _require_protocol_chronology(ordinals: tuple[int, int, int, int, int, int]) -> None:', 'def _require_protocol_chronology(\n    ordinals: tuple[int, int, int, int, int, int, int],\n) -> None:')
          one(sb, '            "MCP schema-drift protocol chronology must be initial-list < swap < stale-call < "\n            "cache-invalidation < refreshed-list < recovery-call"', '            "MCP schema-drift protocol chronology must be initial-list < swap < cached-list < "\n            "stale-call < cache-invalidation < refreshed-list < recovery-call"')

          all_exact(ib, 'agent-evals/mcp-agent-tool-identity-drift-receipt/v1', 'agent-evals/mcp-agent-tool-identity-drift-receipt/v2', 4)
          one(ib, '    identity_swap_ordinal: StrictInt = Field(ge=0)\n    stale_call_ordinal:', '    identity_swap_ordinal: StrictInt = Field(ge=0)\n    cached_list_ordinal: StrictInt = Field(ge=0)\n    stale_call_ordinal:')
          one(ib, '        identity_swap_ordinal: int,\n        stale_call_ordinal: int,', '        identity_swap_ordinal: int,\n        cached_list_ordinal: int,\n        stale_call_ordinal: int,')
          one(ib, '    identity_swap_ordinal: int,\n    stale_call_ordinal: int,', '    identity_swap_ordinal: int,\n    cached_list_ordinal: int,\n    stale_call_ordinal: int,')
          one(ib, '            identity_swap_ordinal,\n            stale_call_ordinal,', '            identity_swap_ordinal,\n            cached_list_ordinal,\n            stale_call_ordinal,')
          one(ib, '        identity_swap_ordinal,\n        stale_call_ordinal,', '        identity_swap_ordinal,\n        cached_list_ordinal,\n        stale_call_ordinal,')
          one(ib, '            self.identity_swap_ordinal,\n            self.stale_call_ordinal,', '            self.identity_swap_ordinal,\n            self.cached_list_ordinal,\n            self.stale_call_ordinal,')
          one(ib, '            "identity_swap_ordinal": identity_swap_ordinal,\n            "stale_call_ordinal": stale_call_ordinal,', '            "identity_swap_ordinal": identity_swap_ordinal,\n            "cached_list_ordinal": cached_list_ordinal,\n            "stale_call_ordinal": stale_call_ordinal,')
          one(ib, '        "cached-old:call-rejects-old:host-refresh-new:call-succeeds-new"', '        "swap-then-cached-old:call-rejects-old:host-refresh-new:call-succeeds-new"')
          one(ib, '    ordinals: tuple[int, int, int, int, int, int],', '    ordinals: tuple[int, int, int, int, int, int, int],')
          one(ib, '            "cache_invalidation_ordinal": ordinals[3],\n            "initial_list_ordinal": ordinals[0],', '            "cache_invalidation_ordinal": ordinals[4],\n            "cached_list_ordinal": ordinals[2],\n            "initial_list_ordinal": ordinals[0],')
          one(ib, '            "recovery_call_ordinal": ordinals[5],\n            "refreshed_list_ordinal": ordinals[4],', '            "recovery_call_ordinal": ordinals[6],\n            "refreshed_list_ordinal": ordinals[5],')
          one(ib, '            "stale_call_ordinal": ordinals[2],', '            "stale_call_ordinal": ordinals[3],')
          one(ib, 'def _require_protocol_chronology(ordinals: tuple[int, int, int, int, int, int]) -> None:', 'def _require_protocol_chronology(\n    ordinals: tuple[int, int, int, int, int, int, int],\n) -> None:')
          one(ib, '            "MCP identity-drift protocol chronology must be initial-list < swap < stale-call < "\n            "cache-invalidation < refreshed-list < recovery-call"', '            "MCP identity-drift protocol chronology must be initial-list < swap < cached-list < "\n            "stale-call < cache-invalidation < refreshed-list < recovery-call"')

          one(sa, '        self._schema_swap_ordinal: int | None = None\n        self._stale_call_ordinal:', '        self._schema_swap_ordinal: int | None = None\n        self._cached_list_ordinal: int | None = None\n        self._stale_call_ordinal:')
          one(sa, '    def stale_call_ordinal(self) -> int:\n        return self._require_ordinal(self._stale_call_ordinal, "stale call")', '    def cached_list_ordinal(self) -> int:\n        return self._require_ordinal(self._cached_list_ordinal, "post-swap cached discovery")\n\n    @property\n    def stale_call_ordinal(self) -> int:\n        return self._require_ordinal(self._stale_call_ordinal, "stale call")')
          one(sa, '''        if self._target_calls == 1:\n            cached_tools = await self._original_list_tools()\n            self._cached_schema = _exact_target_schema(cached_tools, self._fault.tool_name)\n\n            control_result = await _invoke_call_tool(\n                self._original_call_tool,\n                _CONTROL_TOOL,\n                {},\n                None,\n            )''', '''        if self._target_calls == 1:\n            control_result = await _invoke_call_tool(\n                self._original_call_tool,\n                _CONTROL_TOOL,\n                {},\n                None,\n            )''')
          one(sa, '''            if not self._control_failed:\n                self._schema_swap_ordinal = self._mark()\n\n            self._stale_arguments = copy.deepcopy(arguments)''', '''            if not self._control_failed:\n                self._schema_swap_ordinal = self._mark()\n                cached_tools = await self._original_list_tools()\n                self._cached_schema = _exact_target_schema(cached_tools, self._fault.tool_name)\n                self._cached_list_ordinal = self._mark()\n\n            self._stale_arguments = copy.deepcopy(arguments)''')
          one(sa, 'reason="host cache did not preserve the initial target schema before replacement",', 'reason="host cache did not preserve the initial target schema after live replacement",')
          one(sa, '                schema_swap_ordinal=self.schema_swap_ordinal,\n                stale_call_ordinal=', '                schema_swap_ordinal=self.schema_swap_ordinal,\n                cached_list_ordinal=self.cached_list_ordinal,\n                stale_call_ordinal=')
          one(sa, '            schema_swap_ordinal=recorder.schema_swap_ordinal,\n            stale_call_ordinal=', '            schema_swap_ordinal=recorder.schema_swap_ordinal,\n            cached_list_ordinal=recorder.cached_list_ordinal,\n            stale_call_ordinal=')

          one(ia, '        self._identity_swap_ordinal: int | None = None\n        self._stale_call_ordinal:', '        self._identity_swap_ordinal: int | None = None\n        self._cached_list_ordinal: int | None = None\n        self._stale_call_ordinal:')
          one(ia, '    def stale_call_ordinal(self) -> int:\n        return self._require_ordinal(self._stale_call_ordinal, "stale old-name call")', '    def cached_list_ordinal(self) -> int:\n        return self._require_ordinal(self._cached_list_ordinal, "post-swap cached discovery")\n\n    @property\n    def stale_call_ordinal(self) -> int:\n        return self._require_ordinal(self._stale_call_ordinal, "stale old-name call")')
          one(ia, '''            cached_tools = await self._original_list_tools()\n            self._cached_protocol_names = _controlled_names(\n                cached_tools,\n                original_tool_name=self._fault.tool_name,\n                replacement_tool_name=self._replacement_tool_name,\n            )\n\n            control_result = await _invoke_call_tool(''', '''            control_result = await _invoke_call_tool(''')
          one(ia, '''            if not self._control_failed:\n                self._identity_swap_ordinal = self._mark()\n\n            self._stale_arguments = copy.deepcopy(arguments)''', '''            if not self._control_failed:\n                self._identity_swap_ordinal = self._mark()\n                cached_tools = await self._original_list_tools()\n                self._cached_protocol_names = _controlled_names(\n                    cached_tools,\n                    original_tool_name=self._fault.tool_name,\n                    replacement_tool_name=self._replacement_tool_name,\n                )\n                self._cached_list_ordinal = self._mark()\n\n            self._stale_arguments = copy.deepcopy(arguments)''')
          one(ia, 'reason="host cache did not preserve the original identity before live replacement",', 'reason="host cache did not preserve the original identity after live replacement",')
          one(ia, '                identity_swap_ordinal=self.identity_swap_ordinal,\n                stale_call_ordinal=', '                identity_swap_ordinal=self.identity_swap_ordinal,\n                cached_list_ordinal=self.cached_list_ordinal,\n                stale_call_ordinal=')
          one(ia, '            identity_swap_ordinal=recorder.identity_swap_ordinal,\n            stale_call_ordinal=', '            identity_swap_ordinal=recorder.identity_swap_ordinal,\n            cached_list_ordinal=recorder.cached_list_ordinal,\n            stale_call_ordinal=')
          PY
          ruff format \
            src/agent_evals/mcp/agent_schema_bridge.py \
            src/agent_evals/mcp/agent_identity_bridge.py \
            src/agent_evals/adapters/openai_mcp_tool_schema_drift.py \
            src/agent_evals/adapters/openai_mcp_tool_identity_drift.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm \
            .github/workflows/apply-post-mutation-fix.yml \
            .github/workflows/retry-post-mutation-fix.yml \
            .github/workflows/apply-post-mutation-fix-v2.yml
          git add src/agent_evals
          git commit -m 'fix: prove post-mutation stale MCP discovery'
          git push
