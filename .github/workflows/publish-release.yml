name: Publish retained release

on:
  repository_dispatch:
    types: [release-request]

permissions:
  actions: read
  contents: write

concurrency:
  group: retained-release-publication
  cancel-in-progress: false

jobs:
  publish:
    name: Publish exact CI-tested artifacts
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact dispatch-time default-branch release logic
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Self-test release candidate validator
        run: python .github/scripts/release_candidate.py self-test
      - name: Self-test release compatibility statement
        run: python .github/scripts/release_statement.py self-test
      - name: Validate dispatch, CI run, tag, version, and release absence
        id: candidate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/release_candidate.py validate \
            --event "$GITHUB_EVENT_PATH" \
            --repository "$GITHUB_REPOSITORY" \
            --workflow-ref "$GITHUB_REF" \
            --workflow-sha "$GITHUB_SHA" \
            --api-url "$GITHUB_API_URL" \
            --output validated-release.json
      - name: Materialize exact CI-qualified source contract
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_COMMIT_SHA: ${{ steps.candidate.outputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CI_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::validated candidate commit must remain a canonical SHA"
            exit 1
          }
          files=(
            pyproject.toml
            requirements/compatibility/core-minimum-py311.txt
            requirements/compatibility/core-latest-py314.txt
            requirements/compatibility/mcp-minimum-py311.txt
            requirements/compatibility/mcp-latest-py314.txt
            requirements/compatibility/openai-mcp-minimum-py311.txt
            requirements/compatibility/openai-mcp-latest-py314.txt
          )
          mkdir -p candidate-source
          for path in "${files[@]}"; do
            mkdir -p "candidate-source/$(dirname "$path")"
            gh api --method GET \
              -H "Accept: application/vnd.github.raw+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/$GITHUB_REPOSITORY/contents/$path?ref=$CI_COMMIT_SHA" \
              > "candidate-source/$path"
          done
      - name: Download exact CI-tested package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-artifacts-${{ steps.candidate.outputs.ci_run_id }}
          path: retained-dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.candidate.outputs.ci_run_id }}
      - name: Reverify retained package manifest and digests
        run: |
          python .github/scripts/package_artifact_manifest.py verify \
            --dist-dir retained-dist \
            --repository "$GITHUB_REPOSITORY" \
            --commit-sha "${{ steps.candidate.outputs.commit_sha }}" \
            --workflow "CI" \
            --run-id "${{ steps.candidate.outputs.ci_run_id }}" \
            --run-attempt "${{ steps.candidate.outputs.ci_run_attempt }}"
      - name: Download retained release supply-chain evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-supply-chain-${{ steps.candidate.outputs.ci_run_id }}
          path: retained-supply-chain
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.candidate.outputs.ci_run_id }}
      - name: Download retained CI qualification evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-qualification-${{ steps.candidate.outputs.ci_run_id }}
          path: retained-qualification
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.candidate.outputs.ci_run_id }}
      - name: Download retained release compatibility statement
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-statement-${{ steps.candidate.outputs.ci_run_id }}
          path: retained-release-statement
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.candidate.outputs.ci_run_id }}
      - name: Download retained release provenance
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-provenance-${{ steps.candidate.outputs.ci_run_id }}
          path: retained-provenance
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.candidate.outputs.ci_run_id }}
      - name: Exercise retained wheel in exact hash-checked environment
        run: |
          python -m pip install --disable-pip-version-check --require-hashes \
            -r requirements/locks/core-py311.txt
          python -m pip install --disable-pip-version-check --no-deps retained-dist/*.whl
          python -c "import agent_evals; print(agent_evals.__name__)"
          agent-evals --help >/dev/null
      - name: Reverify retained SPDX SBOM and dependency license evidence
        run: |
          python .github/scripts/release_supply_chain.py verify \
            --package-dir retained-dist \
            --evidence-dir retained-supply-chain \
            --policy .github/dependency-license-policy.json \
            --repository "$GITHUB_REPOSITORY" \
            --commit-sha "${{ steps.candidate.outputs.commit_sha }}" \
            --workflow "CI" \
            --run-id "${{ steps.candidate.outputs.ci_run_id }}" \
            --run-attempt "${{ steps.candidate.outputs.ci_run_attempt }}"
      - name: Reverify retained CI qualification evidence
        run: |
          python .github/scripts/ci_qualification_evidence.py verify \
            --evidence retained-qualification/ci-qualification-evidence.json \
            --repository "$GITHUB_REPOSITORY" \
            --commit-sha "${{ steps.candidate.outputs.commit_sha }}" \
            --ref "refs/heads/main" \
            --workflow "CI" \
            --run-id "${{ steps.candidate.outputs.ci_run_id }}" \
            --run-attempt "${{ steps.candidate.outputs.ci_run_attempt }}" \
            --event "push"
      - name: Reverify retained release compatibility statement
        run: |
          python .github/scripts/release_statement.py verify \
            --statement retained-release-statement/release-statement.json \
            --repo-root candidate-source \
            --package-dir retained-dist \
            --supply-chain-dir retained-supply-chain \
            --qualification-dir retained-qualification \
            --repository "$GITHUB_REPOSITORY" \
            --commit-sha "${{ steps.candidate.outputs.commit_sha }}" \
            --ref "refs/heads/main" \
            --workflow "CI" \
            --run-id "${{ steps.candidate.outputs.ci_run_id }}" \
            --run-attempt "${{ steps.candidate.outputs.ci_run_attempt }}" \
            --expected-tag "${{ steps.candidate.outputs.version_tag }}"
      - name: Reverify retained OIDC provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_COMMIT_SHA: ${{ steps.candidate.outputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          bundle="retained-provenance/release-provenance.sigstore.json"
          test -f "$bundle"
          (
            cd retained-provenance
            sha256sum -c bundle-checksum.sha256
          )
          sha256sum -c retained-provenance/subject-checksums.sha256
          subjects=(
            retained-dist/*.whl
            retained-dist/*.tar.gz
            retained-dist/artifact-manifest.json
            retained-supply-chain/release-sbom.spdx.json
            retained-supply-chain/release-supply-chain-evidence.json
            retained-qualification/ci-qualification-evidence.json
            retained-release-statement/release-statement.json
          )
          test "${#subjects[@]}" -eq 7
          for subject in "${subjects[@]}"; do
            gh attestation verify "$subject" \
              --repo "$GITHUB_REPOSITORY" \
              --bundle "$bundle" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" \
              --signer-digest "$CI_COMMIT_SHA" \
              --source-digest "$CI_COMMIT_SHA" \
              --source-ref "refs/heads/main" \
              --predicate-type "https://slsa.dev/provenance/v1" \
              --deny-self-hosted-runners \
              --format json >/dev/null
          done
      - name: Exercise retained source distribution
        run: |
          python -m pip uninstall -y qa-automation-ai-agent-evals
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation retained-dist/*.tar.gz
          python -c "import agent_evals; print(agent_evals.__name__)"
          agent-evals --help >/dev/null
      - name: Revalidate tag and release state immediately before publication
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/release_candidate.py validate \
            --event "$GITHUB_EVENT_PATH" \
            --repository "$GITHUB_REPOSITORY" \
            --workflow-ref "$GITHUB_REF" \
            --workflow-sha "$GITHUB_SHA" \
            --api-url "$GITHUB_API_URL" \
            --output revalidated-release.json
      - name: Publish existing verified tag from retained bytes only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_TAG: ${{ steps.candidate.outputs.version_tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$VERSION_TAG" \
            retained-dist/*.whl \
            retained-dist/*.tar.gz \
            retained-dist/artifact-manifest.json \
            retained-supply-chain/release-sbom.spdx.json \
            retained-supply-chain/release-supply-chain-evidence.json \
            retained-qualification/ci-qualification-evidence.json \
            retained-release-statement/release-statement.json \
            retained-provenance/release-provenance.sigstore.json \
            retained-provenance/subject-checksums.sha256 \
            retained-provenance/bundle-checksum.sha256 \
            retained-provenance/verification/*.json \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$VERSION_TAG" \
            --notes "Published from exact retained CI-tested package bytes with retained SPDX 2.3/license evidence, retained canonical CI qualification evidence, an attested release compatibility statement, and a reverified GitHub Actions OIDC/Sigstore SLSA provenance bundle for the exact subjects. The release statement binds the expected tag, supported Python/package contract, reviewed min/latest compatibility snapshots, and exact retained subject digests. The provenance authenticates the GitHub workflow/source identity for those files; it does not itself sign the GitHub Release entity, authenticate a human maintainer, prove external target behavior, retroactively authenticate older unsigned evidence, or establish PyPI Trusted Publishing."
