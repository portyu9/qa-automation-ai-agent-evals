name: Publish retained release

on:
  workflow_run:
    workflows: ["Release request"]
    types: [completed]

permissions:
  contents: read

jobs:
  publish:
    name: Publish exact CI-tested artifacts
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout trusted default-branch release logic
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Download triggering release request
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-request-${{ github.event.workflow_run.id }}
          path: release-request
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Self-test release candidate validator
        run: python .github/scripts/release_candidate.py self-test
      - name: Validate request, CI run, tag, version, and release absence
        id: candidate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/release_candidate.py validate \
            --request release-request/release-request.json \
            --event "$GITHUB_EVENT_PATH" \
            --repository "$GITHUB_REPOSITORY" \
            --api-url "$GITHUB_API_URL" \
            --output validated-release.json
      - name: Download exact CI-tested package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-artifacts-${{ steps.candidate.outputs.ci_run_id }}
          path: retained-dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.candidate.outputs.ci_run_id }}
      - name: Reverify retained package manifest and digests
        run: |
          python .github/scripts/package_artifact_manifest.py verify \
            --dist-dir retained-dist \
            --repository "$GITHUB_REPOSITORY" \
            --commit-sha "${{ steps.candidate.outputs.commit_sha }}" \
            --workflow "CI" \
            --run-id "${{ steps.candidate.outputs.ci_run_id }}" \
            --run-attempt "${{ steps.candidate.outputs.ci_run_attempt }}"
      - name: Exercise retained wheel
        run: |
          python -m pip install --disable-pip-version-check retained-dist/*.whl
          python -c "import agent_evals; print(agent_evals.__name__)"
          agent-evals --help >/dev/null
      - name: Exercise retained source distribution
        run: |
          python -m pip uninstall -y qa-automation-ai-agent-evals
          python -m pip install --disable-pip-version-check --no-deps retained-dist/*.tar.gz
          python -c "import agent_evals; print(agent_evals.__name__)"
          agent-evals --help >/dev/null
      - name: Publish existing verified tag from retained bytes only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_TAG: ${{ steps.candidate.outputs.version_tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$VERSION_TAG" \
            retained-dist/*.whl \
            retained-dist/*.tar.gz \
            retained-dist/artifact-manifest.json \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$VERSION_TAG" \
            --notes "Published from exact retained CI-tested package bytes. This GitHub Release is distribution integrity, not a cryptographic signature, OIDC provenance/attestation, SBOM, non-repudiation proof, or reproducible-build proof."
