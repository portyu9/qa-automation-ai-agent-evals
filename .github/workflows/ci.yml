name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Repository policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Validate runtime and CI support contract
        run: python .github/scripts/validate_runtime_policy.py

  quality:
    name: Quality / Python ${{ matrix.python-version }}
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Dependency consistency
        run: python -m pip check
      - name: Ruff
        run: ruff check .
      - name: Ruff format
        run: ruff format --check --diff .
      - name: Mypy
        run: mypy
      - name: Tests
        run: |
          pytest --cov=agent_evals --cov-branch --cov-report=term-missing
          coverage report --fail-under=90
      - name: Bandit
        run: bandit -q -r src
      - name: Dependency audit
        run: pip-audit

  openai-adapter:
    name: OpenAI adapter / deterministic SDK
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install OpenAI adapter test dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev,openai,mcp]'
      - name: Dependency consistency
        run: python -m pip check
      - name: Run deterministic SDK adapter tests
        env:
          OPENAI_AGENTS_DISABLE_TRACING: "1"
          OPENAI_AGENTS_TRACE_INCLUDE_SENSITIVE_DATA: "0"
        run: pytest -m openai tests/integration/test_openai_*.py
      - name: Audit complete runtime dependency graph
        run: pip-audit

  mcp-lab:
    name: MCP fault lab / deterministic protocol
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install MCP fault-lab test dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev,mcp]'
      - name: Run deterministic MCP protocol tests
        run: pytest -m mcp tests/integration/test_mcp_*.py

  mcp-remote-auth:
    name: MCP remote auth / loopback HTTP
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install MCP remote-auth test dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev,mcp]'
      - name: Run loopback Streamable HTTP authorization tests
        run: pytest -m mcp_remote tests/integration/test_mcp_*.py

  mcp-oauth-flow:
    name: MCP OAuth flow / separated AS-RS
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install MCP OAuth-flow test dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev,mcp]'
      - name: Run separated authorization-server/resource-server OAuth tests
        run: pytest -m mcp_oauth tests/integration/test_mcp_*.py

  package:
    name: Package integrity
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Build
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev-ci-build.txt
          python -m build
      - name: Inspect distributions
        run: |
          python - <<'PY'
          from configparser import ConfigParser
          from email.parser import BytesParser
          from pathlib import Path
          import tarfile
          import tomllib
          import zipfile

          from packaging.specifiers import SpecifierSet

          project = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']
          expected_name = project['name']
          expected_version = project['version']
          expected_python = project['requires-python']
          expected_extras = set(project.get('optional-dependencies', {}))
          expected_script = project['scripts']['agent-evals']

          def verify_metadata(message, *, label):
              actual_name = message.get('Name')
              actual_version = message.get('Version')
              actual_python = message.get('Requires-Python')
              if actual_name != expected_name or actual_version != expected_version:
                  raise SystemExit(
                      f'{label} core metadata mismatch: '
                      f'name={actual_name!r}/{expected_name!r}, '
                      f'version={actual_version!r}/{expected_version!r}'
                  )
              if actual_python is None:
                  raise SystemExit(f'{label} metadata is missing Requires-Python')
              if SpecifierSet(actual_python) != SpecifierSet(expected_python):
                  raise SystemExit(
                      f'{label} Requires-Python mismatch: '
                      f'{actual_python!r} != {expected_python!r}'
                  )
              extras = set(message.get_all('Provides-Extra', []))
              if extras != expected_extras:
                  raise SystemExit(
                      f'{label} optional extras mismatch: {sorted(extras)} != {sorted(expected_extras)}'
                  )

          wheels = list(Path('dist').glob('*.whl'))
          sdists = list(Path('dist').glob('*.tar.gz'))
          if len(wheels) != 1:
              raise SystemExit(f'expected exactly one wheel, found {len(wheels)}')
          if len(sdists) != 1:
              raise SystemExit(f'expected exactly one sdist, found {len(sdists)}')

          source_root = Path('src/agent_evals')
          source_files = {
              path
              for path in source_root.rglob('*')
              if path.is_file() and (path.suffix == '.py' or path.name == 'py.typed')
          }
          if not source_files:
              raise SystemExit('source package inventory is unexpectedly empty')

          expected_wheel = {
              path.relative_to(source_root.parent).as_posix()
              for path in source_files
          }
          with zipfile.ZipFile(wheels[0]) as archive:
              wheel_files = set(archive.namelist())
              metadata_paths = [name for name in wheel_files if name.endswith('.dist-info/METADATA')]
              entrypoint_paths = [
                  name for name in wheel_files if name.endswith('.dist-info/entry_points.txt')
              ]
              if len(metadata_paths) != 1:
                  raise SystemExit(
                      f'expected exactly one wheel METADATA file, found {len(metadata_paths)}'
                  )
              if len(entrypoint_paths) != 1:
                  raise SystemExit(
                      'expected exactly one wheel entry_points.txt file, '
                      f'found {len(entrypoint_paths)}'
                  )
              verify_metadata(
                  BytesParser().parsebytes(archive.read(metadata_paths[0])),
                  label='wheel',
              )
              entrypoints = ConfigParser()
              entrypoints.read_string(archive.read(entrypoint_paths[0]).decode('utf-8'))
              actual_script = entrypoints.get('console_scripts', 'agent-evals', fallback=None)
              if actual_script != expected_script:
                  raise SystemExit(
                      f'wheel console entry point mismatch: {actual_script!r} != {expected_script!r}'
                  )
              if not any(Path(name).name == 'LICENSE' for name in wheel_files):
                  raise SystemExit('wheel is missing the declared LICENSE file')

          missing_wheel = sorted(expected_wheel.difference(wheel_files))
          if missing_wheel:
              raise SystemExit(f'wheel is missing source package files: {missing_wheel}')

          with tarfile.open(sdists[0], mode='r:gz') as archive:
              sdist_files = {
                  member.name
                  for member in archive.getmembers()
                  if member.isfile()
              }
              roots = {name.split('/', 1)[0] for name in sdist_files if '/' in name}
              if len(roots) != 1:
                  raise SystemExit(f'expected one sdist archive root, found {sorted(roots)}')
              sdist_root = roots.pop()
              pkg_info = f'{sdist_root}/PKG-INFO'
              if pkg_info not in sdist_files:
                  raise SystemExit('sdist is missing PKG-INFO')
              pkg_info_file = archive.extractfile(pkg_info)
              if pkg_info_file is None:
                  raise SystemExit('could not read sdist PKG-INFO')
              verify_metadata(BytesParser().parse(pkg_info_file), label='sdist')

          expected_sdist = {f'{sdist_root}/{path.as_posix()}' for path in source_files}
          expected_sdist.update(
              f'{sdist_root}/{path}' for path in ('pyproject.toml', 'README.md', 'LICENSE')
          )
          missing_sdist = sorted(expected_sdist.difference(sdist_files))
          if missing_sdist:
              raise SystemExit(f'sdist is missing required files: {missing_sdist}')

          print(f'{wheels[0]} contains all {len(expected_wheel)} source package files')
          print(f'{wheels[0]} metadata, extras, entry point, and license match pyproject.toml')
          print(f'{sdists[0]} contains all source package files and required project metadata')
          print(f'{sdists[0]} metadata and extras match pyproject.toml')
          PY
      - name: Install built wheel
        run: |
          python -m pip install --disable-pip-version-check dist/*.whl
          python -c "import agent_evals; print(agent_evals.__name__)"
          agent-evals --help >/dev/null
          python - <<'PY'
          import json
          import subprocess
          from importlib.metadata import version

          expected = version('qa-automation-ai-agent-evals')
          doctor = json.loads(subprocess.check_output(['agent-evals', 'doctor'], text=True))
          if doctor['version'] != expected:
              raise SystemExit(f'doctor version mismatch: {doctor["version"]!r} != {expected!r}')
          PY
      - name: Install from built source distribution
        run: |
          python -m pip uninstall -y qa-automation-ai-agent-evals
          python -m pip install --disable-pip-version-check --no-deps dist/*.tar.gz
          python -c "import agent_evals; print(agent_evals.__name__)"
          agent-evals --help >/dev/null
          python - <<'PY'
          import json
          import subprocess
          from importlib.metadata import version

          expected = version('qa-automation-ai-agent-evals')
          doctor = json.loads(subprocess.check_output(['agent-evals', 'doctor'], text=True))
          if doctor['version'] != expected:
              raise SystemExit(f'doctor version mismatch: {doctor["version"]!r} != {expected!r}')
          PY

  ci-gate:
    name: ci-gate
    if: always()
    needs:
      - policy
      - quality
      - openai-adapter
      - mcp-lab
      - mcp-remote-auth
      - mcp-oauth-flow
      - package
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Evaluate required CI jobs
        env:
          POLICY: ${{ needs.policy.result }}
          QUALITY: ${{ needs.quality.result }}
          OPENAI_ADAPTER: ${{ needs['openai-adapter'].result }}
          MCP_LAB: ${{ needs['mcp-lab'].result }}
          MCP_REMOTE_AUTH: ${{ needs['mcp-remote-auth'].result }}
          MCP_OAUTH_FLOW: ${{ needs['mcp-oauth-flow'].result }}
          PACKAGE: ${{ needs.package.result }}
        run: |
          set -euo pipefail
          for result in "$POLICY" "$QUALITY" "$OPENAI_ADAPTER" "$MCP_LAB" "$MCP_REMOTE_AUTH" "$MCP_OAUTH_FLOW" "$PACKAGE"; do
            [[ "$result" == "success" ]] || { echo "required job result=$result"; exit 1; }
          done
