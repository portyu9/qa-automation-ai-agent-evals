name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "13 4 * * 4"
  workflow_dispatch:
    inputs:
      subject_sha:
        description: Exact main commit the governed merge requires CI evidence for
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Repository policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Bind explicit dispatch to exact main subject
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SUBJECT_SHA: ${{ inputs.subject_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SUBJECT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::subject_sha must be a canonical 40-character lowercase SHA"
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::explicit CI dispatch is allowed only for refs/heads/main"
            exit 1
          fi
          if [[ "$GITHUB_SHA" != "$EXPECTED_SUBJECT_SHA" ]]; then
            echo "::error::dispatched CI subject does not match the exact requested main SHA"
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Validate runtime and CI support contract
        run: python .github/scripts/validate_runtime_policy.py
      - name: Validate repository governance contract
        run: python .github/scripts/validate_governance_policy.py
      - name: Self-test assurance-semantic ADR policy
        run: python .github/scripts/validate_semantic_adr.py --self-test
      - name: Self-test public project-governance documentation bindings
        run: python .github/scripts/validate_project_governance_docs.py --self-test
      - name: Validate public project-governance documentation bindings
        run: python .github/scripts/validate_project_governance_docs.py
      - name: Require ADR for assurance-semantic pull-request changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-status "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/semantic-adr-changes.txt"
          python .github/scripts/validate_semantic_adr.py \
            --changed-files "$RUNNER_TEMP/semantic-adr-changes.txt"
      - name: Validate mandatory security scanner stack
        run: python .github/scripts/validate_security_stack.py
      - name: Install exact hash-checked semantic parser tools
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements/locks/core-py311.txt
      - name: Self-test semantic workflow graph validator
        run: python .github/scripts/validate_workflow_graph.py --self-test
      - name: Validate semantic workflow graph
        run: python .github/scripts/validate_workflow_graph.py
      - name: Self-test retained release candidate validation
        run: python .github/scripts/release_candidate.py self-test
      - name: Self-test release SPDX and license evidence
        run: python .github/scripts/release_supply_chain.py self-test
      - name: Self-test CI qualification evidence
        run: python .github/scripts/ci_qualification_evidence.py self-test
      - name: Self-test release compatibility statement
        run: python .github/scripts/release_statement.py self-test
      - name: Validate repository-owned CI locks
        run: python .github/scripts/validate_ci_locks.py
      - name: Self-test compatibility lock compactor
        run: python .github/scripts/compact_compatibility_lock.py --self-test
      - name: Self-test dependency compatibility policy
        run: python .github/scripts/validate_dependency_compatibility.py --self-test
      - name: Validate committed dependency compatibility locks
        run: python .github/scripts/validate_dependency_compatibility.py
      - name: Self-test coverage policy
        run: python .github/scripts/check_coverage_policy.py --self-test

  actions-security:
    name: Actions security / actionlint + zizmor
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout exact workflow subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install hash-verified actionlint
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          install_dir="$RUNNER_TEMP/actionlint"
          curl --fail --silent --show-error --location             --output "$archive"             https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '%s  %s\n'             '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'             "$archive" | sha256sum --check --strict
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir"
          "$install_dir/actionlint" -version
          "$install_dir/actionlint" -color
      - name: Audit GitHub Actions with pinned zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: "1.30.1"
          online-audits: "false"
          advanced-security: "false"
          annotations: "true"
          persona: "regular"
          min-severity: "medium"
          min-confidence: "medium"

  dependency-review:
    name: Dependency review
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      review_state: ${{ steps.classify.outputs.state }}
    steps:
      - name: Verify dependency-graph precondition
        id: dependency_graph
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/dependency-review-capability.json"
          status="$(
            curl --silent --show-error --location \
              --output "$response" \
              --write-out '%{http_code}' \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/dependency-graph/compare/$BASE_SHA...$MERGE_SHA"
          )"
          case "$status" in
            200)
              echo "state=available" >> "$GITHUB_OUTPUT"
              ;;
            403|404)
              echo "state=blocked-admin-prerequisite" >> "$GITHUB_OUTPUT"
              echo "::warning::Dependency review BLOCKED: repository dependency graph is not enabled; tracked by #193."
              ;;
            *)
              cat "$response" >&2 || true
              echo "::error::dependency-review precondition probe returned HTTP $status"
              exit 1
              ;;
          esac
      - name: Review dependency changes
        id: review
        if: github.event_name == 'pull_request' && steps.dependency_graph.outputs.state == 'available'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: "moderate"
          vulnerability-check: "true"
          license-check: "false"
          warn-only: "false"
      - name: Record blocked repository prerequisite
        if: github.event_name == 'pull_request' && steps.dependency_graph.outputs.state == 'blocked-admin-prerequisite'
        run: |
          echo "Dependency review is BLOCKED, not PASS or FAIL: dependency graph requires repository-administrator enablement."
      - name: Record non-PR applicability
        if: github.event_name != 'pull_request'
        run: echo "Dependency review is PR-delta authority; no dependency delta exists for this event."
      - name: Classify dependency review state
        id: classify
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          GRAPH_STATE: ${{ steps.dependency_graph.outputs.state }}
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "state=not-applicable" >> "$GITHUB_OUTPUT"
          elif [[ "$GRAPH_STATE" == "available" && "$REVIEW_OUTCOME" == "success" ]]; then
            echo "state=passed" >> "$GITHUB_OUTPUT"
          elif [[ "$GRAPH_STATE" == "available" ]]; then
            echo "state=failed" >> "$GITHUB_OUTPUT"
          elif [[ "$GRAPH_STATE" == "blocked-admin-prerequisite" ]]; then
            echo "state=blocked-admin-prerequisite" >> "$GITHUB_OUTPUT"
          else
            echo "::error::dependency-review state cannot be classified safely"
            exit 1
          fi

  quality:
    name: Quality / Python ${{ matrix.python-version }}
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install exact hash-checked core profile
        shell: bash
        run: |
          set -euo pipefail
          python_version="${{ matrix.python-version }}"
          lock_suffix="${python_version/./}"
          python -m pip install --disable-pip-version-check --require-hashes             -r "requirements/locks/core-py${lock_suffix}.txt"
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation .
      - name: Dependency consistency
        run: python -m pip check
      - name: Ruff
        run: ruff check .
      - name: Ruff format
        run: ruff format --check --diff .
      - name: Mypy
        run: mypy
      - name: Tests and trust-class coverage gates
        run: |
          pytest --cov=agent_evals --cov-branch --cov-report=term-missing --cov-report=json:coverage-core.json --junitxml="junit-core-${{ matrix.python-version }}.xml"
          coverage report --fail-under=90
          python .github/scripts/check_coverage_policy.py             --coverage coverage-core.json             --profile core-trust
      - name: Bandit
        run: bandit -q -r src
      - name: Dependency audit
        run: pip-audit
      - name: Retain JUnit and coverage history
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-history-${{ matrix.python-version }}-${{ github.run_id }}
          path: |
            coverage-core.json
            junit-core-${{ matrix.python-version }}.xml
          if-no-files-found: error
          retention-days: 30

  compatibility:
    name: Compatibility / ${{ matrix.profile }} / ${{ matrix.boundary }} / Python ${{ matrix.python-version }}
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: core
            boundary: minimum
            python-version: "3.11"
            lock: requirements/compatibility/core-minimum-py311.txt
          - profile: core
            boundary: latest
            python-version: "3.14"
            lock: requirements/compatibility/core-latest-py314.txt
          - profile: mcp
            boundary: minimum
            python-version: "3.11"
            lock: requirements/compatibility/mcp-minimum-py311.txt
          - profile: mcp
            boundary: latest
            python-version: "3.14"
            lock: requirements/compatibility/mcp-latest-py314.txt
          - profile: openai-mcp
            boundary: minimum
            python-version: "3.11"
            lock: requirements/compatibility/openai-mcp-minimum-py311.txt
          - profile: openai-mcp
            boundary: latest
            python-version: "3.14"
            lock: requirements/compatibility/openai-mcp-latest-py314.txt
    steps:
      - name: Checkout exact compatibility subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up boundary Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Require the lock artifact-selection platform
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUNNER_OS" == "Linux" ]]
          [[ "$RUNNER_ARCH" == "X64" ]]
      - name: Install exact hash-checked compatibility profile
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r "${{ matrix.lock }}"
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation .
      - name: Require a consistent installed dependency graph
        run: python -m pip check
      - name: Exercise deterministic boundary contract
        env:
          PROFILE: ${{ matrix.profile }}
          OPENAI_AGENTS_DISABLE_TRACING: "1"
          OPENAI_AGENTS_TRACE_INCLUDE_SENSITIVE_DATA: "0"
        shell: bash
        run: |
          set -euo pipefail
          case "$PROFILE" in
            core)
              pytest
              ;;
            mcp)
              pytest -m "mcp or mcp_remote or mcp_oauth" tests/integration/test_mcp_*.py
              ;;
            openai-mcp)
              pytest -m openai tests/integration/test_openai_*.py
              ;;
            *)
              echo "::error::unsupported compatibility profile: $PROFILE"
              exit 1
              ;;
          esac

  mutation:
    name: Mutation assurance / trust kernels
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install exact hash-checked core profile
        run: |
          python -m pip install --disable-pip-version-check --require-hashes             -r requirements/locks/core-py311.txt
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation .
      - name: Dependency consistency
        run: python -m pip check
      - name: Run fresh mutation campaign
        run: |
          set -uo pipefail
          rm -rf mutants
          set +e
          mutmut run --max-children 2
          mutation_exit=$?
          set -e
          printf '%s\n' "$mutation_exit" > mutation-run-exit-code.txt
          mutmut export-cicd-stats
          mutmut results > mutation-results.txt 2>&1 || true
      - name: Enforce mutation score and completeness
        run: python .github/scripts/check_mutation_score.py mutants/mutmut-cicd-stats.json
      - name: Upload mutation diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-assurance-${{ github.run_id }}
          path: |
            mutants/mutmut-cicd-stats.json
            mutation-results.txt
            mutation-run-exit-code.txt
          if-no-files-found: warn
          retention-days: 14
          overwrite: true

  openai-adapter:
    name: OpenAI adapter / deterministic SDK
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install exact hash-checked OpenAI plus MCP profile
        run: |
          python -m pip install --disable-pip-version-check --require-hashes             -r requirements/locks/openai-mcp-py311.txt
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation .
      - name: Dependency consistency
        run: python -m pip check
      - name: Run deterministic SDK adapter tests with optional-module coverage
        env:
          OPENAI_AGENTS_DISABLE_TRACING: "1"
          OPENAI_AGENTS_TRACE_INCLUDE_SENSITIVE_DATA: "0"
        run: |
          pytest -m openai tests/integration/test_openai_*.py             --cov=agent_evals             --cov-branch             --cov-config=.github/coverage/optional.coveragerc             --cov-report=term-missing             --cov-report=json:coverage-openai.json
          python .github/scripts/check_coverage_policy.py             --coverage coverage-openai.json             --profile openai
      - name: Audit complete runtime dependency graph
        run: pip-audit

  mcp-lab:
    name: MCP fault lab / deterministic protocol
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install MCP fault-lab test dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes \
            -r requirements/locks/mcp-py311.txt
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation .
      - name: Run deterministic MCP protocol tests with optional-module coverage
        run: |
          pytest -m mcp tests/integration/test_mcp_*.py             --cov=agent_evals             --cov-branch             --cov-config=.github/coverage/optional.coveragerc             --cov-report=term-missing             --cov-report=json:coverage-mcp-lab.json
          python .github/scripts/check_coverage_policy.py             --coverage coverage-mcp-lab.json             --profile mcp-lab

  mcp-remote-auth:
    name: MCP remote auth / loopback HTTP
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install MCP remote-auth test dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes \
            -r requirements/locks/mcp-py311.txt
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation .
      - name: Run loopback Streamable HTTP authorization tests with coverage
        run: |
          pytest -m mcp_remote tests/integration/test_mcp_*.py             --cov=agent_evals             --cov-branch             --cov-config=.github/coverage/optional.coveragerc             --cov-report=term-missing             --cov-report=json:coverage-mcp-remote-auth.json
          python .github/scripts/check_coverage_policy.py             --coverage coverage-mcp-remote-auth.json             --profile mcp-remote-auth

  mcp-oauth-flow:
    name: MCP OAuth flow / separated AS-RS
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install MCP OAuth-flow test dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes \
            -r requirements/locks/mcp-py311.txt
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation .
      - name: Run separated authorization-server/resource-server OAuth tests with coverage
        run: |
          pytest -m mcp_oauth tests/integration/test_mcp_*.py             --cov=agent_evals             --cov-branch             --cov-config=.github/coverage/optional.coveragerc             --cov-report=term-missing             --cov-report=json:coverage-mcp-oauth.json
          python .github/scripts/check_coverage_policy.py             --coverage coverage-mcp-oauth.json             --profile mcp-oauth

  package:
    name: Package build and inspection
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Build reproducible package bytes from locked backend environment
        run: |
          python -m pip install --disable-pip-version-check --require-hashes \
            -r requirements/locks/core-py311.txt
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"
          export SOURCE_DATE_EPOCH
          [[ "$SOURCE_DATE_EPOCH" =~ ^[0-9]+$ ]] || {
            echo "::error::could not derive deterministic SOURCE_DATE_EPOCH from $GITHUB_SHA"
            exit 1
          }
          export PYTHONHASHSEED=0
          python -m build --no-isolation
      - name: Inspect distributions
        run: |
          python - <<'PY'
          from configparser import ConfigParser
          from email.parser import BytesParser
          from pathlib import Path
          import tarfile
          import tomllib
          import zipfile

          from packaging.specifiers import SpecifierSet

          project = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']
          expected_name = project['name']
          expected_version = project['version']
          expected_python = project['requires-python']
          expected_extras = set(project.get('optional-dependencies', {}))
          expected_script = project['scripts']['agent-evals']

          def verify_metadata(message, *, label):
              actual_name = message.get('Name')
              actual_version = message.get('Version')
              actual_python = message.get('Requires-Python')
              if actual_name != expected_name or actual_version != expected_version:
                  raise SystemExit(
                      f'{label} core metadata mismatch: '
                      f'name={actual_name!r}/{expected_name!r}, '
                      f'version={actual_version!r}/{expected_version!r}'
                  )
              if actual_python is None:
                  raise SystemExit(f'{label} metadata is missing Requires-Python')
              if SpecifierSet(actual_python) != SpecifierSet(expected_python):
                  raise SystemExit(
                      f'{label} Requires-Python mismatch: '
                      f'{actual_python!r} != {expected_python!r}'
                  )
              extras = set(message.get_all('Provides-Extra', []))
              if extras != expected_extras:
                  raise SystemExit(
                      f'{label} optional extras mismatch: {sorted(extras)} != {sorted(expected_extras)}'
                  )

          wheels = list(Path('dist').glob('*.whl'))
          sdists = list(Path('dist').glob('*.tar.gz'))
          if len(wheels) != 1:
              raise SystemExit(f'expected exactly one wheel, found {len(wheels)}')
          if len(sdists) != 1:
              raise SystemExit(f'expected exactly one sdist, found {len(sdists)}')

          source_root = Path('src/agent_evals')
          source_files = {
              path
              for path in source_root.rglob('*')
              if path.is_file() and (path.suffix == '.py' or path.name == 'py.typed')
          }
          if not source_files:
              raise SystemExit('source package inventory is unexpectedly empty')

          expected_wheel = {
              path.relative_to(source_root.parent).as_posix()
              for path in source_files
          }
          with zipfile.ZipFile(wheels[0]) as archive:
              wheel_files = set(archive.namelist())
              metadata_paths = [name for name in wheel_files if name.endswith('.dist-info/METADATA')]
              entrypoint_paths = [
                  name for name in wheel_files if name.endswith('.dist-info/entry_points.txt')
              ]
              if len(metadata_paths) != 1:
                  raise SystemExit(
                      f'expected exactly one wheel METADATA file, found {len(metadata_paths)}'
                  )
              if len(entrypoint_paths) != 1:
                  raise SystemExit(
                      'expected exactly one wheel entry_points.txt file, '
                      f'found {len(entrypoint_paths)}'
                  )
              verify_metadata(
                  BytesParser().parsebytes(archive.read(metadata_paths[0])),
                  label='wheel',
              )
              entrypoints = ConfigParser()
              entrypoints.read_string(archive.read(entrypoint_paths[0]).decode('utf-8'))
              actual_script = entrypoints.get('console_scripts', 'agent-evals', fallback=None)
              if actual_script != expected_script:
                  raise SystemExit(
                      f'wheel console entry point mismatch: {actual_script!r} != {expected_script!r}'
                  )
              if not any(Path(name).name == 'LICENSE' for name in wheel_files):
                  raise SystemExit('wheel is missing the declared LICENSE file')

          missing_wheel = sorted(expected_wheel.difference(wheel_files))
          if missing_wheel:
              raise SystemExit(f'wheel is missing source package files: {missing_wheel}')

          with tarfile.open(sdists[0], mode='r:gz') as archive:
              sdist_files = {
                  member.name
                  for member in archive.getmembers()
                  if member.isfile()
              }
              roots = {name.split('/', 1)[0] for name in sdist_files if '/' in name}
              if len(roots) != 1:
                  raise SystemExit(f'expected one sdist archive root, found {sorted(roots)}')
              sdist_root = roots.pop()
              pkg_info = f'{sdist_root}/PKG-INFO'
              if pkg_info not in sdist_files:
                  raise SystemExit('sdist is missing PKG-INFO')
              pkg_info_file = archive.extractfile(pkg_info)
              if pkg_info_file is None:
                  raise SystemExit('could not read sdist PKG-INFO')
              verify_metadata(BytesParser().parse(pkg_info_file), label='sdist')

          expected_sdist = {f'{sdist_root}/{path.as_posix()}' for path in source_files}
          expected_sdist.update(
              f'{sdist_root}/{path}' for path in ('pyproject.toml', 'README.md', 'LICENSE')
          )
          missing_sdist = sorted(expected_sdist.difference(sdist_files))
          if missing_sdist:
              raise SystemExit(f'sdist is missing required files: {missing_sdist}')

          print(f'{wheels[0]} contains all {len(expected_wheel)} source package files')
          print(f'{wheels[0]} metadata, extras, entry point, and license match pyproject.toml')
          print(f'{sdists[0]} contains all source package files and required project metadata')
          print(f'{sdists[0]} metadata and extras match pyproject.toml')
          PY
      - name: Install built wheel
        run: |
          python -m pip install --disable-pip-version-check --no-deps dist/*.whl
          python -c "import agent_evals; print(agent_evals.__name__)"
          agent-evals --help >/dev/null
          python - <<'PY'
          import json
          import subprocess
          from importlib.metadata import version

          expected = version('qa-automation-ai-agent-evals')
          doctor = json.loads(subprocess.check_output(['agent-evals', 'doctor'], text=True))
          if doctor['version'] != expected:
              raise SystemExit(f'doctor version mismatch: {doctor["version"]!r} != {expected!r}')
          PY
      - name: Install from built source distribution
        run: |
          python -m pip uninstall -y qa-automation-ai-agent-evals
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation dist/*.tar.gz
          python -c "import agent_evals; print(agent_evals.__name__)"
          agent-evals --help >/dev/null
          python - <<'PY'
          import json
          import subprocess
          from importlib.metadata import version

          expected = version('qa-automation-ai-agent-evals')
          doctor = json.loads(subprocess.check_output(['agent-evals', 'doctor'], text=True))
          if doctor['version'] != expected:
              raise SystemExit(f'doctor version mismatch: {doctor["version"]!r} != {expected!r}')
          PY
      - name: Create retained package artifact manifest
        run: |
          python .github/scripts/package_artifact_manifest.py create \
            --dist-dir dist \
            --repository "$GITHUB_REPOSITORY" \
            --commit-sha "$GITHUB_SHA" \
            --workflow "$GITHUB_WORKFLOW" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Upload exact tested package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-artifacts-${{ github.run_id }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/artifact-manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true

