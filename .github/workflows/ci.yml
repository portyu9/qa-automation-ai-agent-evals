            --commit-sha "$GITHUB_SHA" \
            --workflow "$GITHUB_WORKFLOW" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"
          python -m pip install --disable-pip-version-check --no-deps retained-dist/*.whl
          python .github/scripts/release_supply_chain.py verify \
            --package-dir retained-dist \
            --evidence-dir retained-supply-chain \
            --policy .github/dependency-license-policy.json \
            --repository "$GITHUB_REPOSITORY" \
            --commit-sha "$GITHUB_SHA" \
            --workflow "$GITHUB_WORKFLOW" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"
          python .github/scripts/ci_qualification_evidence.py verify \
            --evidence retained-qualification/ci-qualification-evidence.json \
            --repository "$GITHUB_REPOSITORY" \
            --commit-sha "$GITHUB_SHA" \
            --ref "$GITHUB_REF" \
            --workflow "$GITHUB_WORKFLOW" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --event "$GITHUB_EVENT_NAME"
          python .github/scripts/release_statement.py verify \
            --statement retained-release-statement/release-statement.json \
            --repo-root . \
            --package-dir retained-dist \
            --supply-chain-dir retained-supply-chain \
            --qualification-dir retained-qualification \
            --repository "$GITHUB_REPOSITORY" \
            --commit-sha "$GITHUB_SHA" \
            --ref "$GITHUB_REF" \
            --workflow "$GITHUB_WORKFLOW" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Generate keyless SLSA provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            retained-dist/*.whl
            retained-dist/*.tar.gz
            retained-dist/artifact-manifest.json
            retained-supply-chain/release-sbom.spdx.json
            retained-supply-chain/release-supply-chain-evidence.json
            retained-qualification/ci-qualification-evidence.json
            retained-release-statement/release-statement.json
      - name: Retain and cryptographically reverify Sigstore bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BUNDLE_PATH"
          test -f "$BUNDLE_PATH"
          mkdir -p release-provenance/verification
          cp "$BUNDLE_PATH" release-provenance/release-provenance.sigstore.json
          subjects=(
            retained-dist/*.whl
            retained-dist/*.tar.gz
            retained-dist/artifact-manifest.json
            retained-supply-chain/release-sbom.spdx.json
            retained-supply-chain/release-supply-chain-evidence.json
            retained-qualification/ci-qualification-evidence.json
            retained-release-statement/release-statement.json
          )
          test "${#subjects[@]}" -eq 7
          for subject in "${subjects[@]}"; do
            base="$(basename "$subject")"
            gh attestation verify "$subject" \
              --repo "$GITHUB_REPOSITORY" \
              --bundle release-provenance/release-provenance.sigstore.json \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" \
              --signer-digest "$GITHUB_SHA" \
              --source-digest "$GITHUB_SHA" \
              --source-ref "$GITHUB_REF" \
              --predicate-type "https://slsa.dev/provenance/v1" \
              --deny-self-hosted-runners \
              --format json \
              > "release-provenance/verification/${base}.json"
          done
          sha256sum \
            retained-dist/*.whl \
            retained-dist/*.tar.gz \
            retained-dist/artifact-manifest.json \
            retained-supply-chain/release-sbom.spdx.json \
            retained-supply-chain/release-supply-chain-evidence.json \
            retained-qualification/ci-qualification-evidence.json \
            retained-release-statement/release-statement.json \
            > release-provenance/subject-checksums.sha256
          (
            cd release-provenance
            sha256sum release-provenance.sigstore.json > bundle-checksum.sha256
          )
      - name: Upload retained provenance evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-provenance-${{ github.run_id }}
          path: |
            release-provenance/release-provenance.sigstore.json
            release-provenance/subject-checksums.sha256
            release-provenance/bundle-checksum.sha256
            release-provenance/verification/*.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true

  ci-gate:
    name: ci-gate
    if: always()
    needs:
      - policy
      - actions-security
      - dependency-review
      - quality
      - compatibility
      - mutation
      - openai-adapter
      - mcp-lab
      - mcp-remote-auth
      - mcp-oauth-flow
      - package
      - package-reverify
      - package-reproduce
      - release-supply-chain
      - release-supply-chain-reverify
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Evaluate required CI jobs
        env:
          POLICY: ${{ needs.policy.result }}
          ACTIONS_SECURITY: ${{ needs['actions-security'].result }}
          DEPENDENCY_REVIEW: ${{ needs['dependency-review'].result }}
          DEPENDENCY_REVIEW_STATE: ${{ needs['dependency-review'].outputs.review_state }}
          QUALITY: ${{ needs.quality.result }}
          COMPATIBILITY: ${{ needs.compatibility.result }}
          MUTATION: ${{ needs.mutation.result }}
          OPENAI_ADAPTER: ${{ needs['openai-adapter'].result }}
          MCP_LAB: ${{ needs['mcp-lab'].result }}
          MCP_REMOTE_AUTH: ${{ needs['mcp-remote-auth'].result }}
          MCP_OAUTH_FLOW: ${{ needs['mcp-oauth-flow'].result }}
          PACKAGE: ${{ needs.package.result }}
          PACKAGE_REVERIFY: ${{ needs['package-reverify'].result }}
          PACKAGE_REPRODUCE: ${{ needs['package-reproduce'].result }}
          RELEASE_SUPPLY_CHAIN: ${{ needs['release-supply-chain'].result }}
          RELEASE_SUPPLY_CHAIN_REVERIFY: ${{ needs['release-supply-chain-reverify'].result }}
        run: |
          set -euo pipefail
          for result in "$POLICY" "$ACTIONS_SECURITY" "$DEPENDENCY_REVIEW" "$QUALITY" "$COMPATIBILITY" "$MUTATION" "$OPENAI_ADAPTER" "$MCP_LAB" "$MCP_REMOTE_AUTH" "$MCP_OAUTH_FLOW" "$PACKAGE" "$PACKAGE_REVERIFY" "$PACKAGE_REPRODUCE" "$RELEASE_SUPPLY_CHAIN" "$RELEASE_SUPPLY_CHAIN_REVERIFY"; do
            [[ "$result" == "success" ]] || { echo "required job result=$result"; exit 1; }
          done
          case "$DEPENDENCY_REVIEW_STATE" in
            passed|not-applicable)
              ;;
            blocked-admin-prerequisite)
              echo "::warning::dependency-review state=BLOCKED because the repository dependency graph is disabled; see #193"
              ;;
            *)
              echo "::error::unrecognized dependency-review state=$DEPENDENCY_REVIEW_STATE"
              exit 1
              ;;
          esac

  protected-gate:
    name: Package integrity
    if: always()
    needs:
      - ci-gate
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Checkout protected-gate subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require aggregate CI success
        env:
          CI_GATE: ${{ needs.ci-gate.result }}
        run: |
          set -euo pipefail
          [[ "$CI_GATE" == "success" ]] || {
            echo "::error::aggregate ci-gate result=$CI_GATE"
            exit 1
          }
      - name: Self-test exact-subject CodeQL bridge
        run: python .github/scripts/verify_required_codeql.py --self-test
      - name: Require exact-subject CodeQL success
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SUBJECT_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          TRIGGER_EVENT: ${{ github.event_name }}
        run: |
          python .github/scripts/verify_required_codeql.py \
            --subject-sha "$SUBJECT_SHA" \
            --branch "$SUBJECT_BRANCH" \
            --trigger-event "$TRIGGER_EVENT"

