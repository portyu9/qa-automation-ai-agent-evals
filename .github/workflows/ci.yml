  package-reproduce:
    name: Reproduce package artifacts independently
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout same package source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up independent build Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Download retained reference artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-artifacts-${{ github.run_id }}
          path: ${{ runner.temp }}/retained-dist
      - name: Verify retained reference manifest
        run: |
          python .github/scripts/package_artifact_manifest.py verify \
            --dist-dir "$RUNNER_TEMP/retained-dist" \
            --repository "$GITHUB_REPOSITORY" \
            --commit-sha "$GITHUB_SHA" \
            --workflow "$GITHUB_WORKFLOW" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Rebuild same source in fresh locked runner
        run: |
          python -m pip install --disable-pip-version-check --require-hashes \
            -r requirements/locks/core-py311.txt
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"
          export SOURCE_DATE_EPOCH
          [[ "$SOURCE_DATE_EPOCH" =~ ^[0-9]+$ ]] || {
            echo "::error::could not derive deterministic SOURCE_DATE_EPOCH from $GITHUB_SHA"
            exit 1
          }
          export PYTHONHASHSEED=0
          python -m build --no-isolation --outdir "$RUNNER_TEMP/reproduced-dist"
      - name: Require exact byte-for-byte reproducibility
        run: |
          python .github/scripts/package_artifact_manifest.py compare \
            --dist-dir "$RUNNER_TEMP/reproduced-dist" \
            --reference-dir "$RUNNER_TEMP/retained-dist" \
            --repository "$GITHUB_REPOSITORY" \
            --commit-sha "$GITHUB_SHA" \
            --workflow "$GITHUB_WORKFLOW" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"


  release-supply-chain:
    name: Generate release SPDX SBOM and license evidence
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout same package source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Install exact hash-checked core profile
        run: |
          python -m pip install --disable-pip-version-check --require-hashes \
            -r requirements/locks/core-py311.txt
      - name: Download retained package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-artifacts-${{ github.run_id }}
          path: retained-dist
      - name: Verify retained package manifest
        run: |
          python .github/scripts/package_artifact_manifest.py verify \
            --dist-dir retained-dist \
            --repository "$GITHUB_REPOSITORY" \
            --commit-sha "$GITHUB_SHA" \
            --workflow "$GITHUB_WORKFLOW" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Install retained wheel and exact runtime dependency closure
        run: python -m pip install --disable-pip-version-check --no-deps retained-dist/*.whl
      - name: Generate deterministic SPDX and license evidence
        run: |
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"
          export SOURCE_DATE_EPOCH
          [[ "$SOURCE_DATE_EPOCH" =~ ^[0-9]+$ ]] || {
            echo "::error::could not derive deterministic SOURCE_DATE_EPOCH from $GITHUB_SHA"
            exit 1
          }
          python .github/scripts/release_supply_chain.py create \
            --package-dir retained-dist \
            --evidence-dir supply-chain \
            --policy .github/dependency-license-policy.json \
            --repository "$GITHUB_REPOSITORY" \
            --commit-sha "$GITHUB_SHA" \
            --workflow "$GITHUB_WORKFLOW" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --source-date-epoch "$SOURCE_DATE_EPOCH"
      - name: Verify generated SPDX and license evidence
        run: |
          python .github/scripts/release_supply_chain.py verify \
            --package-dir retained-dist \
            --evidence-dir supply-chain \
            --policy .github/dependency-license-policy.json \
            --repository "$GITHUB_REPOSITORY" \
            --commit-sha "$GITHUB_SHA" \
            --workflow "$GITHUB_WORKFLOW" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Upload release supply-chain evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-supply-chain-${{ github.run_id }}
          path: |
            supply-chain/release-sbom.spdx.json
            supply-chain/release-supply-chain-evidence.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true

