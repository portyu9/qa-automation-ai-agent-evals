name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      subject_sha:
        description: Exact main commit the governed merge requires CI evidence for
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Repository policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Bind explicit dispatch to exact main subject
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SUBJECT_SHA: ${{ inputs.subject_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SUBJECT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::subject_sha must be a canonical 40-character lowercase SHA"
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::explicit CI dispatch is allowed only for refs/heads/main"
            exit 1
          fi
          if [[ "$GITHUB_SHA" != "$EXPECTED_SUBJECT_SHA" ]]; then
            echo "::error::dispatched CI subject does not match the exact requested main SHA"
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Validate runtime and CI support contract
        run: python .github/scripts/validate_runtime_policy.py
      - name: Self-test retained release candidate validation
        run: python .github/scripts/release_candidate.py self-test
      - name: Self-test release SPDX and license evidence
        run: python .github/scripts/release_supply_chain.py self-test
      - name: Self-test coverage policy
        run: python .github/scripts/check_coverage_policy.py --self-test

  quality:
    name: Quality / Python ${{ matrix.python-version }}
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Dependency consistency
        run: python -m pip check
      - name: Ruff
        run: ruff check .
      - name: Ruff format
        run: ruff format --check --diff .
      - name: Mypy
        run: mypy
      - name: Tests and trust-class coverage gates
        run: |
          pytest --cov=agent_evals --cov-branch --cov-report=term-missing --cov-report=json:coverage-core.json
          coverage report --fail-under=90
          python .github/scripts/check_coverage_policy.py             --coverage coverage-core.json             --profile core-trust
      - name: Bandit
        run: bandit -q -r src
      - name: Dependency audit
        run: pip-audit

  mutation:
    name: Mutation assurance / trust kernels
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install mutation test dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Dependency consistency
        run: python -m pip check
      - name: Run fresh mutation campaign
        run: |
          set -uo pipefail
          rm -rf mutants
          set +e
          mutmut run --max-children 2
          mutation_exit=$?
          set -e
          printf '%s\n' "$mutation_exit" > mutation-run-exit-code.txt
          mutmut export-cicd-stats
          mutmut results > mutation-results.txt 2>&1 || true
      - name: Enforce mutation score and completeness
        run: python .github/scripts/check_mutation_score.py mutants/mutmut-cicd-stats.json
      - name: Upload mutation diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-assurance-${{ github.run_id }}
          path: |
            mutants/mutmut-cicd-stats.json
            mutation-results.txt
            mutation-run-exit-code.txt
          if-no-files-found: warn
          retention-days: 14
          overwrite: true

  openai-adapter:
    name: OpenAI adapter / deterministic SDK
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install OpenAI adapter test dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev,openai,mcp]'
      - name: Dependency consistency
        run: python -m pip check
      - name: Run deterministic SDK adapter tests with optional-module coverage
        env:
          OPENAI_AGENTS_DISABLE_TRACING: "1"
          OPENAI_AGENTS_TRACE_INCLUDE_SENSITIVE_DATA: "0"
        run: |
          pytest -m openai tests/integration/test_openai_*.py             --cov=agent_evals             --cov-branch             --cov-config=.github/coverage/optional.coveragerc             --cov-report=term-missing             --cov-report=json:coverage-openai.json
          python .github/scripts/check_coverage_policy.py             --coverage coverage-openai.json             --profile openai
      - name: Audit complete runtime dependency graph
        run: pip-audit

  mcp-lab:
    name: MCP fault lab / deterministic protocol
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install MCP fault-lab test dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev,mcp]'
      - name: Run deterministic MCP protocol tests with optional-module coverage
        run: |
          pytest -m mcp tests/integration/test_mcp_*.py             --cov=agent_evals             --cov-branch             --cov-config=.github/coverage/optional.coveragerc             --cov-report=term-missing             --cov-report=json:coverage-mcp-lab.json
          python .github/scripts/check_coverage_policy.py             --coverage coverage-mcp-lab.json             --profile mcp-lab

  mcp-remote-auth:
    name: MCP remote auth / loopback HTTP
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install MCP remote-auth test dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev,mcp]'
      - name: Run loopback Streamable HTTP authorization tests with coverage
        run: |
          pytest -m mcp_remote tests/integration/test_mcp_*.py             --cov=agent_evals             --cov-branch             --cov-config=.github/coverage/optional.coveragerc             --cov-report=term-missing             --cov-report=json:coverage-mcp-remote-auth.json
          python .github/scripts/check_coverage_policy.py             --coverage coverage-mcp-remote-auth.json             --profile mcp-remote-auth

  mcp-oauth-flow:
    name: MCP OAuth flow / separated AS-RS
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install MCP OAuth-flow test dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev,mcp]'
      - name: Run separated authorization-server/resource-server OAuth tests with coverage
        run: |
          pytest -m mcp_oauth tests/integration/test_mcp_*.py             --cov=agent_evals             --cov-branch             --cov-config=.github/coverage/optional.coveragerc             --cov-report=term-missing             --cov-report=json:coverage-mcp-oauth.json
          python .github/scripts/check_coverage_policy.py             --coverage coverage-mcp-oauth.json             --profile mcp-oauth

  package:
    name: Package build and inspection
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Build reproducible package bytes
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev-ci-build.txt
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"
          [[ "$SOURCE_DATE_EPOCH" =~ ^[0-9]+$ ]] || {
            echo "::error::could not derive deterministic SOURCE_DATE_EPOCH from $GITHUB_SHA"
            exit 1
          }
          export PYTHONHASHSEED=0
          python -m build
      - name: Inspect distributions
        run: |
          python - <<'PY'
          from configparser import ConfigParser
          from email.parser import BytesParser
          from pathlib import Path
          import tarfile
          import tomllib
          import zipfile

          from packaging.specifiers import SpecifierSet

          project = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']
          expected_name = project['name']
          expected_version = project['version']
          expected_python = project['requires-python']
          expected_extras = set(project.get('optional-dependencies', {}))
          expected_script = project['scripts']['agent-evals']

          def verify_metadata(message, *, label):
              actual_name = message.get('Name')
              actual_version = message.get('Version')
              actual_python = message.get('Requires-Python')
              if actual_name != expected_name or actual_version != expected_version:
                  raise SystemExit(
                      f'{label} core metadata mismatch: '
                      f'name={actual_name!r}/{expected_name!r}, '
                      f'version={actual_version!r}/{expected_version!r}'
                  )
              if actual_python is None:
                  raise SystemExit(f'{label} metadata is missing Requires-Python')
              if SpecifierSet(actual_python) != SpecifierSet(expected_python):
                  raise SystemExit(
                      f'{label} Requires-Python mismatch: '
                      f'{actual_python!r} != {expected_python!r}'
                  )
              extras = set(message.get_all('Provides-Extra', []))
              if extras != expected_extras:
                  raise SystemExit(
                      f'{label} optional extras mismatch: {sorted(extras)} != {sorted(expected_extras)}'
                  )

          wheels = list(Path('dist').glob('*.whl'))
          sdists = list(Path('dist').glob('*.tar.gz'))
          if len(wheels) != 1:
              raise SystemExit(f'expected exactly one wheel, found {len(wheels)}')
          if len(sdists) != 1:
              raise SystemExit(f'expected exactly one sdist, found {len(sdists)}')

          source_root = Path('src/agent_evals')
          source_files = {
              path
              for path in source_root.rglob('*')
              if path.is_file() and (path.suffix == '.py' or path.name == 'py.typed')
          }
          if not source_files:
              raise SystemExit('source package inventory is unexpectedly empty')

          expected_wheel = {
              path.relative_to(source_root.parent).as_posix()
              for path in source_files
          }
          with zipfile.ZipFile(wheels[0]) as archive:
              wheel_files = set(archive.namelist())
              metadata_paths = [name for name in wheel_files if name.endswith('.dist-info/METADATA')]
              entrypoint_paths = [
                  name for name in wheel_files if name.endswith('.dist-info/entry_points.txt')
              ]
              if len(metadata_paths) != 1:
                  raise SystemExit(
                      f'expected exactly one wheel METADATA file, found {len(metadata_paths)}'
                  )
              if len(entrypoint_paths) != 1:
                  raise SystemExit(
                      'expected exactly one wheel entry_points.txt file, '
                      f'found {len(entrypoint_paths)}'
                  )
              verify_metadata(
                  BytesParser().parsebytes(archive.read(metadata_paths[0])),
                  label='wheel',
              )
              entrypoints = ConfigParser()
              entrypoints.read_string(archive.read(entrypoint_paths[0]).decode('utf-8'))
              actual_script = entrypoints.get('console_scripts', 'agent-evals', fallback=None)
              if actual_script != expected_script:
                  raise SystemExit(
                      f'wheel console entry point mismatch: {actual_script!r} != {expected_script!r}'
                  )
              if not any(Path(name).name == 'LICENSE' for name in wheel_files):
                  raise SystemExit('wheel is missing the declared LICENSE file')

          missing_wheel = sorted(expected_wheel.difference(wheel_files))
          if missing_wheel:
              raise SystemExit(f'wheel is missing source package files: {missing_wheel}')

          with tarfile.open(sdists[0], mode='r:gz') as archive:
              sdist_files = {
                  member.name
                  for member in archive.getmembers()
                  if member.isfile()
              }
              roots = {name.split('/', 1)[0] for name in sdist_files if '/' in name}
              if len(roots) != 1:
                  raise SystemExit(f'expected one sdist archive root, found {sorted(roots)}')
              sdist_root = roots.pop()
              pkg_info = f'{sdist_root}/PKG-INFO'
              if pkg_info not in sdist_files:
                  raise SystemExit('sdist is missing PKG-INFO')
              pkg_info_file = archive.extractfile(pkg_info)
              if pkg_info_file is None:
                  raise SystemExit('could not read sdist PKG-INFO')
              verify_metadata(BytesParser().parse(pkg_info_file), label='sdist')

          expected_sdist = {f'{sdist_root}/{path.as_posix()}' for path in source_files}
          expected_sdist.update(
              f'{sdist_root}/{path}' for path in ('pyproject.toml', 'README.md', 'LICENSE')
          )
          missing_sdist = sorted(expected_sdist.difference(sdist_files))
          if missing_sdist:
              raise SystemExit(f'sdist is missing required files: {missing_sdist}')

          print(f'{wheels[0]} contains all {len(expected_wheel)} source package files')
          print(f'{wheels[0]} metadata, extras, entry point, and license match pyproject.toml')
          print(f'{sdists[0]} contains all source package files and required project metadata')
          print(f'{sdists[0]} metadata and extras match pyproject.toml')
          PY
      - name: Install built wheel
        run: |
          python -m pip install --disable-pip-version-check dist/*.whl
          python -c "import agent_evals; print(agent_evals.__name__)"
          agent-evals --help >/dev/null
          python - <<'PY'
          import json
          import subprocess
          from importlib.metadata import version

          expected = version('qa-automation-ai-agent-evals')
          doctor = json.loads(subprocess.check_output(['agent-evals', 'doctor'], text=True))
          if doctor['version'] != expected:
              raise SystemExit(f'doctor version mismatch: {doctor["version"]!r} != {expected!r}')
          PY
      - name: Install from built source distribution
        run: |
          python -m pip uninstall -y qa-automation-ai-agent-evals
          python -m pip install --disable-pip-version-check --no-deps dist/*.tar.gz
          python -c "import agent_evals; print(agent_evals.__name__)"
          agent-evals --help >/dev/null
          python - <<'PY'
          import json
          import subprocess
          from importlib.metadata import version

          expected = version('qa-automation-ai-agent-evals')
          doctor = json.loads(subprocess.check_output(['agent-evals', 'doctor'], text=True))
          if doctor['version'] != expected:
              raise SystemExit(f'doctor version mismatch: {doctor["version"]!r} != {expected!r}')
          PY
      - name: Create retained package artifact manifest
        run: |
          python .github/scripts/package_artifact_manifest.py create \
            --dist-dir dist \
            --repository "$GITHUB_REPOSITORY" \
            --commit-sha "$GITHUB_SHA" \
            --workflow "$GITHUB_WORKFLOW" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Upload exact tested package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-artifacts-${{ github.run_id }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/artifact-manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true

  package-reverify:
    name: Reverify retained package artifacts
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Download exact tested package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-artifacts-${{ github.run_id }}
          path: retained-dist
      - name: Verify retained package manifest and digests
        run: |
          python .github/scripts/package_artifact_manifest.py verify \
            --dist-dir retained-dist \
            --repository "$GITHUB_REPOSITORY" \
            --commit-sha "$GITHUB_SHA" \
            --workflow "$GITHUB_WORKFLOW" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Install retained wheel
        run: |
          python -m pip install --disable-pip-version-check retained-dist/*.whl
          python -c "import agent_evals; print(agent_evals.__name__)"
          agent-evals --help >/dev/null
          python - <<'PY'
          import json
          import subprocess
          from importlib.metadata import version

          expected = version('qa-automation-ai-agent-evals')
          doctor = json.loads(subprocess.check_output(['agent-evals', 'doctor'], text=True))
          if doctor['version'] != expected:
              raise SystemExit(f'doctor version mismatch: {doctor["version"]!r} != {expected!r}')
          PY
      - name: Install retained source distribution
        run: |
          python -m pip uninstall -y qa-automation-ai-agent-evals
          python -m pip install --disable-pip-version-check --no-deps retained-dist/*.tar.gz
          python -c "import agent_evals; print(agent_evals.__name__)"
          agent-evals --help >/dev/null
          python - <<'PY'
          import json
          import subprocess
          from importlib.metadata import version

          expected = version('qa-automation-ai-agent-evals')
          doctor = json.loads(subprocess.check_output(['agent-evals', 'doctor'], text=True))
          if doctor['version'] != expected:
              raise SystemExit(f'doctor version mismatch: {doctor["version"]!r} != {expected!r}')
          PY


  package-reproduce:
    name: Reproduce package artifacts independently
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout same package source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up independent build Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Download retained reference artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-artifacts-${{ github.run_id }}
          path: ${{ runner.temp }}/retained-dist
      - name: Verify retained reference manifest
        run: |
          python .github/scripts/package_artifact_manifest.py verify \
            --dist-dir "$RUNNER_TEMP/retained-dist" \
            --repository "$GITHUB_REPOSITORY" \
            --commit-sha "$GITHUB_SHA" \
            --workflow "$GITHUB_WORKFLOW" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Rebuild same source in fresh runner
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev-ci-build.txt
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"
          [[ "$SOURCE_DATE_EPOCH" =~ ^[0-9]+$ ]] || {
            echo "::error::could not derive deterministic SOURCE_DATE_EPOCH from $GITHUB_SHA"
            exit 1
          }
          export PYTHONHASHSEED=0
          python -m build --outdir "$RUNNER_TEMP/reproduced-dist"
      - name: Require exact byte-for-byte reproducibility
        run: |
          python .github/scripts/package_artifact_manifest.py compare \
            --dist-dir "$RUNNER_TEMP/reproduced-dist" \
            --reference-dir "$RUNNER_TEMP/retained-dist" \
            --repository "$GITHUB_REPOSITORY" \
            --commit-sha "$GITHUB_SHA" \
            --workflow "$GITHUB_WORKFLOW" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"


  release-supply-chain:
    name: Generate release SPDX SBOM and license evidence
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout same package source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Install supply-chain verifier dependency
        run: python -m pip install --disable-pip-version-check -r requirements-dev-ci-build.txt
      - name: Download retained package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-artifacts-${{ github.run_id }}
          path: retained-dist
      - name: Verify retained package manifest
        run: |
          python .github/scripts/package_artifact_manifest.py verify \
            --dist-dir retained-dist \
            --repository "$GITHUB_REPOSITORY" \
            --commit-sha "$GITHUB_SHA" \
            --workflow "$GITHUB_WORKFLOW" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Install retained wheel and exact runtime dependency closure
        run: python -m pip install --disable-pip-version-check retained-dist/*.whl
      - name: Generate deterministic SPDX and license evidence
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"
          [[ "$SOURCE_DATE_EPOCH" =~ ^[0-9]+$ ]] || {
            echo "::error::could not derive deterministic SOURCE_DATE_EPOCH from $GITHUB_SHA"
            exit 1
          }
          python .github/scripts/release_supply_chain.py create \
            --package-dir retained-dist \
            --evidence-dir supply-chain \
            --policy .github/dependency-license-policy.json \
            --repository "$GITHUB_REPOSITORY" \
            --commit-sha "$GITHUB_SHA" \
            --workflow "$GITHUB_WORKFLOW" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --source-date-epoch "$SOURCE_DATE_EPOCH"
      - name: Verify generated SPDX and license evidence
        run: |
          python .github/scripts/release_supply_chain.py verify \
            --package-dir retained-dist \
            --evidence-dir supply-chain \
            --policy .github/dependency-license-policy.json \
            --repository "$GITHUB_REPOSITORY" \
            --commit-sha "$GITHUB_SHA" \
            --workflow "$GITHUB_WORKFLOW" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Upload release supply-chain evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-supply-chain-${{ github.run_id }}
          path: |
            supply-chain/release-sbom.spdx.json
            supply-chain/release-supply-chain-evidence.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true

  release-supply-chain-reverify:
    name: Reverify release supply-chain evidence
    needs:
      - package
      - release-supply-chain
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact evidence subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Install supply-chain verifier dependency
        run: python -m pip install --disable-pip-version-check -r requirements-dev-ci-build.txt
      - name: Download retained package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-artifacts-${{ github.run_id }}
          path: retained-dist
      - name: Download retained supply-chain evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-supply-chain-${{ github.run_id }}
          path: retained-supply-chain
      - name: Verify retained package manifest
        run: |
          python .github/scripts/package_artifact_manifest.py verify \
            --dist-dir retained-dist \
            --repository "$GITHUB_REPOSITORY" \
            --commit-sha "$GITHUB_SHA" \
            --workflow "$GITHUB_WORKFLOW" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Install retained wheel and independently resolve runtime closure
        run: python -m pip install --disable-pip-version-check retained-dist/*.whl
      - name: Independently reverify SPDX, artifact binding, closure and license policy
        run: |
          python .github/scripts/release_supply_chain.py verify \
            --package-dir retained-dist \
            --evidence-dir retained-supply-chain \
            --policy .github/dependency-license-policy.json \
            --repository "$GITHUB_REPOSITORY" \
            --commit-sha "$GITHUB_SHA" \
            --workflow "$GITHUB_WORKFLOW" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"


  lock-bootstrap:
    name: Temporary lock bootstrap / ${{ matrix.profile }} / Python ${{ matrix.python-version }}
    if: github.event_name == 'pull_request' && github.head_ref == 'hardening/295-hashed-ci-locks'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: core
            python-version: "3.11"
            suffix: py311
          - profile: core
            python-version: "3.12"
            suffix: py312
          - profile: core
            python-version: "3.13"
            suffix: py313
          - profile: core
            python-version: "3.14"
            suffix: py314
          - profile: mcp
            python-version: "3.11"
            suffix: py311
          - profile: openai-mcp
            python-version: "3.11"
            suffix: py311
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned bootstrap compiler
        run: |
          python -m pip install --disable-pip-version-check "pip==25.3"
          python -m pip install --disable-pip-version-check "pip-tools==7.5.2"
      - name: Compile hash-checked lock
        run: |
          python .github/scripts/generate_ci_lock.py \
            --profile "${{ matrix.profile }}" \
            --output "generated/${{ matrix.profile }}-${{ matrix.suffix }}.txt"
      - name: Upload generated lock
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lock-${{ matrix.profile }}-${{ matrix.suffix }}
          path: generated/*.txt
          if-no-files-found: error
          retention-days: 1

  lock-bootstrap-commit:
    name: Temporary lock bootstrap / commit
    if: github.event_name == 'pull_request' && github.head_ref == 'hardening/295-hashed-ci-locks'
    needs: lock-bootstrap
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch for one-time lock commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: hardening/295-hashed-ci-locks
      - name: Download all generated locks
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: lock-*
          path: requirements/locks
          merge-multiple: true
      - name: Commit generated locks to active branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements/locks
          git diff --cached --quiet && {
            echo "::error::no generated lock changes found"
            exit 1
          }
          git commit -m "ci(deps): generate exact hashed CI lock profiles"
          git push origin HEAD:hardening/295-hashed-ci-locks

  ci-gate:
    name: ci-gate
    if: always()
    needs:
      - policy
      - quality
      - mutation
      - openai-adapter
      - mcp-lab
      - mcp-remote-auth
      - mcp-oauth-flow
      - package
      - package-reverify
      - package-reproduce
      - release-supply-chain
      - release-supply-chain-reverify
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Evaluate required CI jobs
        env:
          POLICY: ${{ needs.policy.result }}
          QUALITY: ${{ needs.quality.result }}
          MUTATION: ${{ needs.mutation.result }}
          OPENAI_ADAPTER: ${{ needs['openai-adapter'].result }}
          MCP_LAB: ${{ needs['mcp-lab'].result }}
          MCP_REMOTE_AUTH: ${{ needs['mcp-remote-auth'].result }}
          MCP_OAUTH_FLOW: ${{ needs['mcp-oauth-flow'].result }}
          PACKAGE: ${{ needs.package.result }}
          PACKAGE_REVERIFY: ${{ needs['package-reverify'].result }}
          PACKAGE_REPRODUCE: ${{ needs['package-reproduce'].result }}
          RELEASE_SUPPLY_CHAIN: ${{ needs['release-supply-chain'].result }}
          RELEASE_SUPPLY_CHAIN_REVERIFY: ${{ needs['release-supply-chain-reverify'].result }}
        run: |
          set -euo pipefail
          for result in "$POLICY" "$QUALITY" "$MUTATION" "$OPENAI_ADAPTER" "$MCP_LAB" "$MCP_REMOTE_AUTH" "$MCP_OAUTH_FLOW" "$PACKAGE" "$PACKAGE_REVERIFY" "$PACKAGE_REPRODUCE" "$RELEASE_SUPPLY_CHAIN" "$RELEASE_SUPPLY_CHAIN_REVERIFY"; do
            [[ "$result" == "success" ]] || { echo "required job result=$result"; exit 1; }
          done

  protected-gate:
    name: Package integrity
    if: always()
    needs:
      - ci-gate
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Checkout protected-gate subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require aggregate CI success
        env:
          CI_GATE: ${{ needs.ci-gate.result }}
        run: |
          set -euo pipefail
          [[ "$CI_GATE" == "success" ]] || {
            echo "::error::aggregate ci-gate result=$CI_GATE"
            exit 1
          }
      - name: Self-test exact-subject CodeQL bridge
        run: python .github/scripts/verify_required_codeql.py --self-test
      - name: Require exact-subject CodeQL success
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SUBJECT_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          TRIGGER_EVENT: ${{ github.event_name }}
        run: |
          python .github/scripts/verify_required_codeql.py \
            --subject-sha "$SUBJECT_SHA" \
            --branch "$SUBJECT_BRANCH" \
            --trigger-event "$TRIGGER_EVENT"

