name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: Ruff format
        run: ruff format --check --diff .
      - name: Mypy
        run: mypy
      - name: Tests
        run: |
          pytest --cov=agent_evals --cov-branch --cov-report=term-missing
          coverage report --fail-under=90
      - name: Bandit
        run: bandit -q -r src
      - name: Dependency audit
        run: pip-audit

  openai-adapter:
    name: OpenAI adapter / deterministic SDK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install OpenAI adapter test dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev,openai,mcp]'
      - name: Run deterministic SDK adapter tests
        env:
          OPENAI_AGENTS_DISABLE_TRACING: "1"
          OPENAI_AGENTS_TRACE_INCLUDE_SENSITIVE_DATA: "0"
        run: >-
          pytest -m openai
          tests/integration/test_openai_adapter.py
          tests/integration/test_openai_resource_adapter.py
          tests/integration/test_openai_environment_adapter.py
          tests/integration/test_openai_handoff_authority_adapter.py
          tests/integration/test_openai_hitl_approval_adapter.py
          tests/integration/test_openai_semantic_judge.py
          tests/integration/test_openai_retrieval_adapter.py
          tests/integration/test_openai_side_effect_idempotency_adapter.py
          tests/integration/test_openai_side_effect_idempotency_fail_closed.py
          tests/integration/test_openai_mcp_tool_result_adapter.py
          tests/integration/test_openai_mcp_tool_error_recovery_adapter.py
          tests/integration/test_openai_mcp_tool_metadata_adapter.py
          tests/integration/test_openai_mcp_tool_schema_drift_adapter.py
          tests/integration/test_openai_mcp_tool_schema_drift_contract.py
          tests/integration/test_openai_mcp_tool_identity_drift_adapter.py
          tests/integration/test_openai_mcp_tool_stale_cache_adapter.py

  mcp-lab:
    name: MCP fault lab / deterministic protocol
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install MCP fault-lab test dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev,mcp]'
      - name: Run deterministic MCP protocol tests
        run: pytest -m mcp tests/integration/test_mcp_fault_lab.py

  mcp-remote-auth:
    name: MCP remote auth / loopback HTTP
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install MCP remote-auth test dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev,mcp]'
      - name: Run loopback Streamable HTTP authorization tests
        run: pytest -m mcp_remote tests/integration/test_mcp_remote_auth.py

  mcp-oauth-flow:
    name: MCP OAuth flow / separated AS-RS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install MCP OAuth-flow test dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev,mcp]'
      - name: Run separated authorization-server/resource-server OAuth tests
        run: pytest -m mcp_oauth tests/integration/test_mcp_oauth_flow.py

  package:
    name: Package integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Build
        run: |
          python -m pip install --disable-pip-version-check 'build==1.6.0'
          python -m build
      - name: Inspect wheel
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          wheels = list(Path('dist').glob('*.whl'))
          if len(wheels) != 1:
              raise SystemExit(f'expected exactly one wheel, found {len(wheels)}')
          with zipfile.ZipFile(wheels[0]) as archive:
              names = archive.namelist()
          required = {'agent_evals/__init__.py', 'agent_evals/py.typed'}
          missing = sorted(required.difference(names))
          if missing:
              raise SystemExit(f'wheel is missing required package files: {missing}')
          print(wheels[0])
          PY
      - name: Install built wheel
        run: |
          python -m pip install --disable-pip-version-check dist/*.whl
          python -c "import agent_evals; print(agent_evals.__name__)"
          agent-evals --help >/dev/null
