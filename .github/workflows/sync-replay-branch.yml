name: Sync replay fix with main

on:
  push:
    branches: [fix/mcp-protocol-replay-evidence-binding]
    paths: [.github/workflows/sync-replay-branch.yml]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/mcp-protocol-replay-evidence-binding
          fetch-depth: 0
      - name: Merge current protected main and remove helper
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
          git rm .github/workflows/sync-replay-branch.yml
          git commit -m 'chore: remove temporary branch sync helper'
          git push
