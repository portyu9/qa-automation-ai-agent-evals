name: Retry post-mutation stale-discovery fix

on:
  push:
    branches: [fix/mcp-post-mutation-stale-discovery]
    paths: [.github/workflows/retry-post-mutation-fix.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/mcp-post-mutation-stale-discovery
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check 'ruff==0.16.5'
      - name: Execute corrected assertion-backed patch
        run: |
          python - <<'PY'
          from pathlib import Path

          helper = Path('.github/workflows/apply-post-mutation-fix.yml')
          text = helper.read_text()
          for old, new in (
              ("'agent-evals/mcp-agent-tool-schema-drift-receipt/v2', 3)", "'agent-evals/mcp-agent-tool-schema-drift-receipt/v2', 4)"),
              ("'agent-evals/mcp-agent-tool-identity-drift-receipt/v2', 3)", "'agent-evals/mcp-agent-tool-identity-drift-receipt/v2', 4)"),
          ):
              if text.count(old) != 1:
                  raise SystemExit(f'expected one helper assertion to patch: {old}')
              text = text.replace(old, new)
          helper.write_text(text)

          marker = "          python - <<'PY'\n"
          start = text.index(marker) + len(marker)
          end = text.index("\n          PY\n", start)
          code = text[start:end]
          code = "\n".join(line[10:] if line.startswith("          ") else line for line in code.splitlines())
          exec(compile(code, str(helper), 'exec'), {})
          PY
          ruff format \
            src/agent_evals/mcp/agent_schema_bridge.py \
            src/agent_evals/mcp/agent_identity_bridge.py \
            src/agent_evals/adapters/openai_mcp_tool_schema_drift.py \
            src/agent_evals/adapters/openai_mcp_tool_identity_drift.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-post-mutation-fix.yml .github/workflows/retry-post-mutation-fix.yml
          git add src/agent_evals
          git commit -m 'fix: prove post-mutation stale MCP discovery'
          git push
