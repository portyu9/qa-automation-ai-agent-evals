name: OpenSSF Scorecard

on:
  # Reassess real supply-chain findings on every accepted main push.
  # This monitor never executes untrusted PR code with security-events:write.
  # It reports posture after acceptance; it does not replace PR merge gates.
  push:
    branches: [main]
  schedule:
    - cron: "41 8 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scorecard-${{ github.repository }}
  cancel-in-progress: true

jobs:
  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      checks: read
      issues: read
      pull-requests: read
      security-events: write
    steps:
      - name: Checkout exact monitored subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Scorecard Docker action writes directly into the bind-mounted
      # workspace and does not create intermediate host directories.
      # Prepare the destination before invoking it; never fabricate a SARIF
      # result or turn a missing result into a successful scan.
      - name: Prepare Scorecard SARIF destination
        run: mkdir -p reports/security
      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: reports/security/scorecard.sarif
          results_format: sarif
          publish_results: "false"
      - name: Upload Scorecard SARIF to code scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: reports/security/scorecard.sarif
          category: openssf-scorecard
      # This observes raw scanner findings without suppressing SARIF. A new or
      # increased category fails the monitor but must not block SARIF retention.
      - name: Classify genuine SARIF against accepted security posture baseline
        if: always()
        run: python3 .github/scripts/classify_scorecard_sarif.py reports/security/scorecard.sarif --report reports/security/scorecard-triage.json
      - name: Retain Scorecard evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openssf-scorecard-${{ github.run_id }}
          path: |
            reports/security/scorecard.sarif
            reports/security/scorecard-triage.json
          if-no-files-found: error
          retention-days: 30
