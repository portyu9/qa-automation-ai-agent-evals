name: OpenSSF Scorecard

on:
  # Verify Scorecard's real SARIF creation on the accepted main revision
  # whenever the Scorecard workflow itself changes. Do not grant PR code
  # the security-events:write permission required for SARIF publication.
  push:
    branches: [main]
    paths:
      - ".github/workflows/security-scorecard.yml"
  schedule:
    - cron: "41 8 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scorecard-${{ github.repository }}
  cancel-in-progress: true

jobs:
  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout exact monitored subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Scorecard Docker action writes directly into the bind-mounted
      # workspace and does not create intermediate host directories.
      # Prepare the destination before invoking it; never fabricate a SARIF
      # result or turn a missing result into a successful scan.
      - name: Prepare Scorecard SARIF destination
        run: mkdir -p reports/security
      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: reports/security/scorecard.sarif
          results_format: sarif
          publish_results: "false"
      - name: Upload Scorecard SARIF to code scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: reports/security/scorecard.sarif
          category: openssf-scorecard
      - name: Retain Scorecard evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openssf-scorecard-${{ github.run_id }}
          path: reports/security/scorecard.sarif
          if-no-files-found: error
          retention-days: 30
