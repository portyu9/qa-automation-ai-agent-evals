name: Apply approval predecision result fix

on:
  push:
    branches:
      - fix/approval-predecision-result
    paths:
      - .github/workflows/apply-approval-predecision-result.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/approval-predecision-result
      - name: Apply approval result chronology fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("src/agent_evals/evidence/approval_intent.py")
          text = source.read_text()
          old = '''    post_decision = evidence.events[decision_event.sequence + 1 :]
    resumed_requests = [
        event
        for event in post_decision
        if event.kind is EvidenceKind.TOOL_REQUEST
        and event.payload.get("call_id") == receipt.call_id
    ]
    if len(resumed_requests) > 1:
        raise ApprovalIntentError("approval decision maps to multiple resumed tool requests")

    matching_results = [
        event
        for event in post_decision
        if event.kind is EvidenceKind.TOOL_RESULT
        and event.payload.get("call_id") == receipt.call_id
    ]
'''
          new = '''    matching_results = [
        event
        for event in evidence.events
        if event.kind is EvidenceKind.TOOL_RESULT
        and event.payload.get("call_id") == receipt.call_id
    ]
    if any(event.sequence <= decision_event.sequence for event in matching_results):
        raise ApprovalIntentError("approval continuation result cannot precede its decision")

    post_decision = evidence.events[decision_event.sequence + 1 :]
    resumed_requests = [
        event
        for event in post_decision
        if event.kind is EvidenceKind.TOOL_REQUEST
        and event.payload.get("call_id") == receipt.call_id
    ]
    if len(resumed_requests) > 1:
        raise ApprovalIntentError("approval decision maps to multiple resumed tool requests")

    matching_results = [
        event for event in matching_results if event.sequence > decision_event.sequence
    ]
'''
          if text.count(old) != 1:
              raise SystemExit(f"approval verifier anchor count={text.count(old)}")
          source.write_text(text.replace(old, new, 1))

          tests = Path("tests/unit/test_approval_continuation_chronology.py")
          text = tests.read_text()
          if "test_approved_predecision_result_is_rejected_before_policy_grading" in text:
              raise SystemExit("predecision regression tests already present")
          addition = '''


def _predecision_result_evidence(
    scenario: EvaluationScenario,
) -> TrialEvidence:
    decision = _receipt(scenario).to_event(sequence=2, source="evaluator:approval-intent")
    events: list[EvidenceEvent] = [
        _approval_request(),
        _result(1),
        decision,
    ]
    if scenario.approval_intent is not None and scenario.approval_intent.decision is ApprovalDecision.APPROVE:
        events.extend((_execution(3), _result(4)))
    else:
        events.append(
            _event(
                3,
                EvidenceKind.TOOL_RESULT,
                agent=_AGENT,
                call_id=_CALL,
                output="Tool execution was rejected.",
                approval_rejected=True,
            )
        )
    return TrialEvidence(
        trial_id=f"approval-predecision-{scenario.approval_intent.decision.value}",
        subject_identity=_SUBJECT.identity,
        scenario_identity=scenario.identity,
        events=tuple(events),
    )


def test_approved_predecision_result_is_rejected_before_policy_grading() -> None:
    scenario = _scenario()
    malformed = _predecision_result_evidence(scenario)

    # Before approval verification, the deterministic policy path sees the later approved request
    # and ignores the contradictory earlier result, so the malformed history would otherwise PASS.
    assert PolicyOracle().grade(scenario, malformed).verdict is TrialVerdict.PASS

    with pytest.raises(ApprovalIntentError, match="result cannot precede its decision"):
        verify_approval_intent(scenario, malformed)

    blocked = asyncio.run(
        TrialRunner().run(
            EvidenceReplayAdapter(malformed),
            subject=_SUBJECT,
            scenario=scenario,
            trial_id=malformed.trial_id,
        )
    )
    assert blocked.verdict is TrialVerdict.BLOCKED
    assert blocked.oracle_results == ()
    assert blocked.evidence.events[-1].kind is EvidenceKind.EVALUATION_ERROR
    assert blocked.evidence.events[-1].payload["code"] == "approval_intent_unverified"


def test_clean_rejection_rejects_matching_result_before_decision() -> None:
    scenario = _scenario(ApprovalDecision.REJECT)
    malformed = _predecision_result_evidence(scenario)

    # The clean-rejection policy path also ignores result events, so without the verifier this
    # impossible same-call history would be accepted as policy PASS.
    assert PolicyOracle().grade(scenario, malformed).verdict is TrialVerdict.PASS

    with pytest.raises(ApprovalIntentError, match="result cannot precede its decision"):
        verify_approval_intent(scenario, malformed)
'''
          tests.write_text(text + addition)
          PY
      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Normalize and validate focused approval surface
        shell: bash
        run: |
          ruff check --fix src/agent_evals/evidence/approval_intent.py tests/unit/test_approval_continuation_chronology.py
          ruff format src/agent_evals/evidence/approval_intent.py tests/unit/test_approval_continuation_chronology.py
          ruff check src/agent_evals/evidence/approval_intent.py tests/unit/test_approval_continuation_chronology.py
          ruff format --check src/agent_evals/evidence/approval_intent.py tests/unit/test_approval_continuation_chronology.py
          pytest -q tests/unit/test_approval_continuation_chronology.py tests/unit/test_approval_intent.py tests/unit/test_approval_intent_fail_closed.py tests/unit/test_approval_intent_legacy_downgrade.py
          git diff --check
      - name: Commit permanent changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/agent_evals/evidence/approval_intent.py tests/unit/test_approval_continuation_chronology.py
          git commit -m "fix: reject approval results before decision"
          git push origin HEAD:fix/approval-predecision-result
