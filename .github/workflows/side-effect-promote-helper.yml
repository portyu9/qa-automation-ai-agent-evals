name: Side-effect promotion helper

on:
  push:
    branches:
      - feat/side-effect-idempotency

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Promote proven side-effect assurance into permanent CI
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          adapter = 'src/agent_evals/adapters/openai_side_effect_idempotency.py'
          replace_once(
              adapter,
              '''        if len(observed) != contract.attempts:\n            raise AdapterPreconditionError(\n                code=("side_effect_call_missing" if not observed else "side_effect_call_ambiguous"),\n                reason="side-effect assurance requires exactly two target callback invocations",\n            )\n''',
              '''        if len(observed) != contract.attempts:\n            raise AdapterPreconditionError(\n                code=(\n                    "side_effect_call_missing"\n                    if len(observed) < contract.attempts\n                    else "side_effect_call_ambiguous"\n                ),\n                reason="side-effect assurance requires exactly two target callback invocations",\n            )\n''',
          )
          replace_once(
              adapter,
              '''        if len(requests) != contract.attempts:\n            raise AdapterPreconditionError(\n                code=("side_effect_call_missing" if not requests else "side_effect_call_ambiguous"),\n                reason="side-effect assurance requires exactly two normalized target requests",\n            )\n''',
              '''        if len(requests) != contract.attempts:\n            raise AdapterPreconditionError(\n                code=(\n                    "side_effect_call_missing"\n                    if len(requests) < contract.attempts\n                    else "side_effect_call_ambiguous"\n                ),\n                reason="side-effect assurance requires exactly two normalized target requests",\n            )\n''',
          )
          replace_once(
              'pyproject.toml',
              '  "src/agent_evals/adapters/openai_retrieval.py",\n',
              '  "src/agent_evals/adapters/openai_retrieval.py",\n  "src/agent_evals/adapters/openai_side_effect_idempotency.py",\n',
          )
          replace_once(
              '.github/workflows/ci.yml',
              '''          tests/integration/test_openai_retrieval_adapter.py\n          tests/integration/test_openai_mcp_tool_result_adapter.py\n''',
              '''          tests/integration/test_openai_retrieval_adapter.py\n          tests/integration/test_openai_side_effect_idempotency_adapter.py\n          tests/integration/test_openai_side_effect_idempotency_fail_closed.py\n          tests/integration/test_openai_mcp_tool_result_adapter.py\n''',
          )
          PY
          rm .github/workflows/side-effect-validation.yml
          rm .github/workflows/side-effect-promote-helper.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/agent_evals/adapters/openai_side_effect_idempotency.py pyproject.toml .github/workflows/ci.yml .github/workflows/side-effect-validation.yml .github/workflows/side-effect-promote-helper.yml
          git commit -m 'feat: promote side-effect assurance into permanent CI'
          git push origin HEAD:feat/side-effect-idempotency
