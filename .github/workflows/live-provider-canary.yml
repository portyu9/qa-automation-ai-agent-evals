name: Live provider canary

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:
    inputs:
      model:
        description: Live model identifier; falls back to repository variable OPENAI_CANARY_MODEL
        required: false
        type: string
      input_usd_per_million:
        description: Reviewed input-token price snapshot for cost bounding
        required: false
        type: string
      output_usd_per_million:
        description: Reviewed output-token price snapshot for cost bounding
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: live-provider-canary
  cancel-in-progress: false

jobs:
  openai-canary:
    name: OpenAI historical observation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_CANARY_MODEL: ${{ inputs.model || vars.OPENAI_CANARY_MODEL }}
      OPENAI_CANARY_INPUT_USD_PER_MILLION: ${{ inputs.input_usd_per_million || vars.OPENAI_CANARY_INPUT_USD_PER_MILLION }}
      OPENAI_CANARY_OUTPUT_USD_PER_MILLION: ${{ inputs.output_usd_per_million || vars.OPENAI_CANARY_OUTPUT_USD_PER_MILLION }}
      OPENAI_CANARY_MAX_ESTIMATED_COST_USD: "0.01"
      OPENAI_CANARY_MAX_REQUESTS_PER_MINUTE: "6"
      OPENAI_CANARY_MAX_ATTEMPTS: "3"
      OPENAI_CANARY_REQUEST_TIMEOUT_SECONDS: "15"
      OPENAI_CANARY_WALL_CLOCK_SECONDS: "45"
      OPENAI_CANARY_MAX_INPUT_TOKENS: "256"
      OPENAI_CANARY_MAX_OUTPUT_TOKENS: "32"
      CANARY_OUTPUT: live-canary/observation.json
    steps:
      - name: Checkout exact canary implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Install exact hash-checked runtime
        run: |
          python -m pip install --disable-pip-version-check --require-hashes \
            -r requirements/locks/core-py311.txt
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation .
      - name: Run bounded live provider canary
        id: canary
        continue-on-error: true
        run: python .github/scripts/run_live_provider_canary.py
      - name: Retain historical observation
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-provider-canary-${{ github.run_id }}
          path: live-canary/observation.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Enforce canary result
        if: always()
        env:
          CANARY_OUTCOME: ${{ steps.canary.outcome }}
        run: |
          set -euo pipefail
          [[ "$CANARY_OUTCOME" == "success" ]] || {
            echo "::error::live provider canary did not produce a successful historical observation"
            exit 1
          }
