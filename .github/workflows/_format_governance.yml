name: Temporary governance formatter

on:
  push:
    branches:
      - automation/autonomous-dependency-promotion
    paths:
      - .github/workflows/_format_governance.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.2
        with:
          ref: automation/autonomous-dependency-promotion
          fetch-depth: 1
      - name: Format governance controller
        run: |
          python -m pip install --disable-pip-version-check ruff==0.16.7
          ruff format .github/scripts/dependency_governance.py
          ruff check .github/scripts/dependency_governance.py
      - name: Commit formatting
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/scripts/dependency_governance.py
          git diff --cached --check
          git commit -m 'style: format autonomous dependency governance'
          git push origin HEAD:automation/autonomous-dependency-promotion
